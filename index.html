<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Vitality - Notes & Tasks</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🌊</span>
            <div>
                <h1 class="font-bold text-lg">Team Vitality</h1>
                <p class="text-xs text-indigo-400 font-medium">Daily Hub & Tracker</p>
            </div>
        </div>
        <a href="./" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition-colors">Home Hub</a>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 max-w-3xl w-full mx-auto space-y-6">
        
        <!-- Welcome Card -->
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-sm">
            <h2 class="text-xl font-bold mb-2">Welcome to your Tracker</h2>
            <p class="text-slate-400 text-sm">Use this space to keep track of your daily notes, milestones, or quick reminders for your 60-day challenge.</p>
        </div>

        <!-- Quick Notes Section -->
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-sm space-y-4">
            <h3 class="font-semibold text-md text-emerald-400">Quick Notes</h3>
            <form id="note-form" class="space-y-3">
                <textarea 
                    id="note-input" 
                    rows="3" 
                    placeholder="Write a quick note or goal for today..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 transition-colors resize-none"
                    required
                ></textarea>
                <button 
                    type="submit" 
                    class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl font-medium text-sm transition-colors cursor-pointer"
                >
                    Add Note
                </button>
            </form>

            <!-- Notes List -->
            <div id="notes-container" class="space-y-2 mt-4">
                <!-- Dynamic notes appear here -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 text-center text-xs text-slate-500">
        Team Vitality Challenge &bull; Route: /dashboard
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const noteForm = document.getElementById('note-form');
        const noteInput = document.getElementById('note-input');
        const notesContainer = document.getElementById('notes-container');

        // Load saved notes from localStorage
        let notes = JSON.parse(localStorage.getItem('vitality_notes')) || [];

        function renderNotes() {
            notesContainer.innerHTML = '';
            if (notes.length === 0) {
                notesContainer.innerHTML = '<p class="text-slate-500 text-sm italic">No notes added yet.</p>';
                return;
            }

            notes.forEach((note, index) => {
                const noteDiv = document.createElement('div');
                noteDiv.className = 'bg-slate-900/60 border border-slate-700/80 p-3.5 rounded-xl flex items-start justify-between gap-3 text-sm';

                const textSpan = document.createElement('span');
                textSpan.className = 'flex-1 break-words';
                textSpan.textContent = note;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'text-slate-400 hover:text-red-400 text-xs px-2 py-1 rounded transition-colors';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = () => {
                    notes.splice(index, 1);
                    localStorage.setItem('vitality_notes', JSON.stringify(notes));
                    renderNotes();
                };

                noteDiv.appendChild(textSpan);
                noteDiv.appendChild(deleteBtn);
                notesContainer.appendChild(noteDiv);
            });
        }

        noteForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = noteInput.value.trim();
            if (!text) return;

            notes.push(text);
            localStorage.setItem('vitality_notes', JSON.stringify(notes));
            noteInput.value = '';
            renderNotes();
        });

        // Initial render
        renderNotes();
    </script>
</body>
</html>
