<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABTalks - Team Vitality V for the Win (Astra Design System)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                }
            }
        }
    </script>
    <style>
        /* Astra Design System Core Styles */
        :root {
            --bg-surface: #0a0711;
            --panel-raised: #151022;
            --violet-glow: rgba(139, 92, 246, 0.25);
            --border-subtle: rgba(139, 92, 246, 0.15);
        }

        body {
            background-color: var(--bg-surface);
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }

        .astra-panel {
            background-color: var(--panel-raised);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px var(--violet-glow);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .astra-panel:hover {
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(139, 92, 246, 0.4);
        }

        .astra-input {
            background: #0d0a17;
            border: 1px solid rgba(139, 92, 246, 0.2);
            color: #ffffff;
            border-radius: 9999px; /* Pill control */
            transition: all 0.3s ease;
        }

        .astra-input:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
        }

        .astra-btn-pill {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            border-radius: 9999px; /* Pill control */
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.35);
            transition: all 0.3s ease;
        }

        .astra-btn-pill:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.55);
        }

        .luminous-glow {
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-purple-500 selection:text-white">

    <!-- Ambient Glow Orbs -->
    <div class="fixed top-0 left-1/4 w-[700px] h-[700px] bg-purple-900/10 rounded-full blur-[180px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[700px] h-[700px] bg-indigo-900/10 rounded-full blur-[180px] pointer-events-none"></div>

    <!-- NAVBAR -->
    <header class="border-b border-[var(--border-subtle)] bg-[var(--bg-surface)]/80 backdrop-blur-xl sticky top-0 z-50 px-6 lg:px-20 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigateTo('/')">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-purple-500/20">
                ⚡
            </div>
            <div>
                <span class="font-extrabold tracking-widest text-xs text-white uppercase">ABTALKS</span>
                <span class="block text-[9px] text-purple-400 font-bold tracking-widest uppercase">Team Vitality — V for the Win</span>
            </div>
        </div>
        <button onclick="router.navigateTo('/')" class="text-xs text-purple-300 hover:text-white font-medium transition">
            ← Return Home
        </button>
    </header>

    <!-- MAIN LOGIN / AUTH CONTAINER -->
    <main class="flex-grow max-w-xl mx-auto w-full px-6 py-12 z-10 flex items-center justify-center">
        <div class="astra-panel w-full p-8 sm:p-10 rounded-[2.5rem] space-y-6">
            
            <div class="text-center space-y-2">
                <span class="bg-purple-500/10 text-purple-300 border border-purple-500/30 px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest">
                    Team Vitality • V for the Win 👑
                </span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight luminous-glow">
                    Welcome Back, Scholar
                </h1>
                <p class="text-xs text-slate-400">
                    Enter your credentials to synchronize your 60-day challenge session.
                </p>
            </div>

            <!-- Auth Mode Switcher (Pill Controls) -->
            <div class="flex bg-[#0d0a17] p-1 rounded-full border border-purple-500/20">
                <button onclick="setAuthMode('login')" id="tabLogin" class="flex-1 py-2.5 rounded-full text-xs font-bold transition bg-purple-600 text-white shadow-md">
                    Existing User Login
                </button>
                <button onclick="setAuthMode('register')" id="tabRegister" class="flex-1 py-2.5 rounded-full text-xs font-bold transition text-slate-400 hover:text-white">
                    New Registration
                </button>
            </div>

            <!-- Form Content -->
            <div class="space-y-4 pt-2">
                <div id="nameFieldContainer" class="hidden space-y-1">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3">Full Name</label>
                    <input type="text" id="regName" placeholder="Aarav Sharma" class="astra-input w-full px-5 py-3.5 text-xs">
                </div>

                <div class="space-y-1">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3">College Email / Username</label>
                    <input type="email" id="authEmail" placeholder="student@university.ac.in" class="astra-input w-full px-5 py-3.5 text-xs">
                </div>

                <div class="space-y-1">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3">Password / Security Pin</label>
                    <input type="password" id="authPass" placeholder="••••••••" class="astra-input w-full px-5 py-3.5 text-xs">
                </div>

                <button onclick="handleAuthentication()" class="astra-btn-pill w-full py-4 text-xs tracking-wide uppercase mt-4">
                    <span id="submitBtnText">Authenticate & Launch Dashboard ⚡</span>
                </button>
            </div>

            <!-- Sandbox Helper Note -->
            <div class="bg-[#0d0a17] border border-purple-500/20 p-4 rounded-2xl text-[11px] text-purple-300 text-center font-mono">
                🛡️ Astra Dark-First Violet Protocol Active. V for the Win Edition.
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-[var(--border-subtle)] bg-[var(--bg-surface)] py-6 px-6 text-center text-xs text-slate-500">
        © 2026 ABTalks Ecosystem. Team Vitality — V for the Win.
    </footer>

    <!-- ASTRA DESIGN SYSTEM SCRIPT ENGINE -->
    <script>
        let currentMode = 'login';

        function setAuthMode(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const nameContainer = document.getElementById('nameFieldContainer');
            const submitBtn = document.getElementById('submitBtnText');

            if (mode === 'login') {
                tabLogin.className = "flex-1 py-2.5 rounded-full text-xs font-bold transition bg-purple-600 text-white shadow-md";
                tabRegister.className = "flex-1 py-2.5 rounded-full text-xs font-bold transition text-slate-400 hover:text-white";
                nameContainer.classList.add('hidden');
                submitBtn.innerText = "Authenticate & Launch Dashboard ⚡";
            } else {
                tabRegister.className = "flex-1 py-2.5 rounded-full text-xs font-bold transition bg-purple-600 text-white shadow-md";
                tabLogin.className = "flex-1 py-2.5 rounded-full text-xs font-bold transition text-slate-400 hover:text-white";
                nameContainer.classList.remove('hidden');
                submitBtn.innerText = "Initialize Account & Send OTP ✉️";
            }
        }

        function handleAuthentication() {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPass').value.trim();

            if (!email || !pass) {
                alert('Please fill out all required authentication fields.');
                return;
            }

            const userName = currentMode === 'register' ? (document.getElementById('regName').value || 'Scholar') : (email.split('@')[0] || 'Scholar');
            
            const sessionUser = { name: userName, email: email, avatar: 'Aarav' };
            localStorage.setItem('abtalks_user', JSON.stringify(sessionUser));
            
            alert(`Session verified successfully for ${userName}! V for the Win!`);
            window.location.href = '#/dashboard';
        }

        const router = {
            navigateTo(path) {
                window.location.href = path;
            }
        };
    </script>
</body>
</html>
