<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphism & Class — Advanced Algebraic UI Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                }
            }
        }
    </script>
    <style>
        .morphism-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .morphism-glass:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.2);
        }
        .algebraic-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #312e81 100%);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }
        .algebraic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.6);
        }
        @keyframes morphFloat {
            0%, 100% { transform: translateY(0) scale(1); border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            50% { transform: translateY(-15px) scale(1.05); border-radius: 50% 50% 30% 70% / 50% 70% 30% 50%; }
        }
        .animate-morph { animation: morphFloat 8s ease-in-out infinite; }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Background Orbs -->
    <div class="fixed top-[-10%] left-[-10%] w-[600px] h-[600px] bg-indigo-600/15 rounded-full blur-[150px] pointer-events-none animate-morph"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-purple-600/15 rounded-full blur-[150px] pointer-events-none animate-morph" style="animation-delay: -4s;"></div>

    <!-- NAVBAR -->
    <header class="border-b border-white/10 bg-slate-950/60 backdrop-blur-xl sticky top-0 z-50 px-6 lg:px-20 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3 cursor-pointer" onclick="app.navigate('home')">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg">⚡</div>
            <div>
                <span class="font-bold tracking-wider text-sm text-white uppercase">Morphism OS</span>
                <span class="block text-[10px] text-indigo-400 font-mono">Class Algebra v2.4</span>
            </div>
        </div>
        <nav class="hidden md:flex gap-6 text-xs font-medium text-slate-400">
            <button onclick="app.navigate('home')" class="hover:text-white transition">Theory Core</button>
            <button onclick="app.navigate('classes')" class="hover:text-white transition">Class Registry</button>
            <button onclick="app.navigate('morphism')" class="hover:text-white transition">Transformation Matrix</button>
        </nav>
        <div class="flex items-center gap-3">
            <button onclick="app.navigate('auth')" id="navAuthBtn" class="algebraic-btn px-5 py-2.5 rounded-xl text-xs">Initialize Session ✦</button>
        </div>
    </header>

    <!-- CONTAINER ROUTER -->
    <main id="routerContainer" class="flex-grow max-w-7xl mx-auto w-full px-6 lg:px-20 py-12 z-10"></main>

    <!-- FOOTER -->
    <footer class="border-t border-white/10 bg-slate-950/80 py-8 px-6 lg:px-20 text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>© 2026 Morphism & Class Engine. Built with pure functional UI mechanics.</div>
        <div class="flex gap-4 font-mono text-indigo-400">
            <span>[Category Theory Active]</span>
            <span>[Objects: 256]</span>
            <span>[Functors: Synced]</span>
        </div>
    </footer>

    <!-- ENGINE LOGIC -->
    <script>
        // CORE OOP CLASS DEFINITION SYSTEM (Object-Oriented Programming & Morphism)
        class CategoryObject {
            constructor(name, properties) {
                this.name = name;
                this.properties = properties;
                this.id = Math.random().toString(36.substring(2, 9));
            }
            describe() {
                return `Object Class [${this.name}] with properties: ${Object.keys(this.properties).join(', ')}`;
            }
        }

        class MorphismTransformation {
            constructor(sourceClass, targetClass, transformationFunction) {
                this.source = sourceClass;
                this.target = targetClass;
                this.transform = transformationFunction;
            }
            execute(data) {
                return this.transform(data);
            }
        }

        // APPLICATION STATE & ROUTER ENGINE
        const app = {
            route: 'home',
            authMode: 'signin', // 'signin', 'signup'
            user: JSON.parse(localStorage.getItem('morphism_user')) || null,
            
            navigate(route) {
                this.route = route;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            render() {
                const container = document.getElementById('routerContainer');
                let html = '';
                
                if (this.route === 'home') html = this.renderHome();
                else if (this.route === 'auth') html = this.renderAuth();
                else if (this.route === 'classes') html = this.renderClasses();
                else if (this.route === 'morphism') html = this.renderMorphismPlayground();
                else if (this.route === 'dashboard') html = this.renderDashboard();

                container.innerHTML = html;
                this.updateNavbar();
            },

            updateNavbar() {
                const btn = document.getElementById('navAuthBtn');
                if (this.user) {
                    btn.innerText = `👤 ${this.user.name}`;
                    btn.onclick = () => this.navigate('dashboard');
                } else {
                    btn.innerText = 'Initialize Session ✦';
                    btn.onclick = () => this.navigate('auth');
                }
            },

            renderHome() {
                return `
                    <div class="space-y-16 animate-fadeIn">
                        <div class="morphism-glass p-12 lg:p-20 rounded-[3rem] text-center space-y-8 relative overflow-hidden">
                            <div class="absolute -top-32 -left-32 w-80 h-80 bg-indigo-500/10 rounded-full blur-3xl"></div>
                            <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-purple-500/10 rounded-full blur-3xl"></div>

                            <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-5 py-2 rounded-full text-xs font-mono uppercase tracking-widest">
                                Algebraic UI Architecture
                            </span>
                            <h1 class="text-4xl lg:text-7xl font-bold tracking-tight text-white max-w-4xl mx-auto leading-tight">
                                The Synthesis of <span class="bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Class</span> and <span class="bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">Morphism</span>.
                            </h1>
                            <p class="text-slate-400 text-base lg:text-lg max-w-2xl mx-auto">
                                Explore a web application built entirely on object-oriented class hierarchies and category-theoretic structural transformations.
                            </p>
                            <div class="flex justify-center gap-4 pt-4">
                                <button onclick="app.navigate('classes')" class="algebraic-btn px-8 py-4 rounded-2xl text-sm">Explore Class Hierarchy →</button>
                                <button onclick="app.navigate('morphism')" class="morphism-glass px-8 py-4 rounded-2xl text-sm hover:bg-white/10 text-slate-200">Run Morphism Lab 🧪</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="morphism-glass p-8 rounded-[2.5rem] space-y-4">
                                <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl font-bold">🏛️</div>
                                <h3 class="text-xl font-bold text-white">Class-Based Encapsulation</h3>
                                <p class="text-slate-400 text-sm leading-relaxed">
                                    Objects maintain state, behavior, and inheritance structures, mapped directly into interactive user interface components.
                                </p>
                            </div>
                            <div class="morphism-glass p-8 rounded-[2.5rem] space-y-4">
                                <div class="w-12 h-12 rounded-2xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-xl font-bold">🔄</div>
                                <h3 class="text-xl font-bold text-white">Structure-Preserving Morphisms</h3>
                                <p class="text-slate-400 text-sm leading-relaxed">
                                    Transform objects from one category state to another securely while maintaining relational integrity and type safety.
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderAuth() {
                const isLogin = this.authMode === 'login';
                return `
                    <div class="max-w-md mx-auto py-10 animate-fadeIn">
                        <div class="glass-card morphism-glass p-10 rounded-[3rem] space-y-8 relative overflow-hidden">
                            <div class="text-center space-y-2">
                                <span class="text-xs font-mono text-indigo-400 uppercase tracking-widest bg-indigo-500/10 border border-indigo-500/30 px-3.5 py-1.5 rounded-full">
                                    Authentication Functor
                                </span>
                                <h2 class="text-2xl font-bold text-white pt-2">${isLogin ? 'Access Portal' : 'Register Entity'}</h2>
                                <p class="text-xs text-slate-400">Initialize your user class object instance.</p>
                            </div>

                            <!-- Mode Switcher -->
                            <div class="flex bg-slate-900/60 p-1.5 rounded-2xl border border-white/10">
                                <button onclick="app.authMode='signin'; app.render();" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition ${!isLogin ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">
                                    Sign Up
                                </button>
                                <button onclick="app.authMode='login'; app.render();" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition ${isLogin ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">
                                    Login
                                </button>
                            </div>

                            <div class="space-y-4">
                                ${!isLogin ? `
                                    <div>
                                        <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Entity Name</label>
                                        <input type="text" id="authName" placeholder="Dr. Alan Turing" class="w-full bg-slate-950/60 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 shadow-inner">
                                    </div>
                                ` : ''}
                                <div>
                                    <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Identifier (Email)</label>
                                    <input type="email" id="authEmail" placeholder="turing@algebra.edu" class="w-full bg-slate-950/60 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 shadow-inner">
                                </div>
                                <div>
                                    <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Security Key (Password)</label>
                                    <input type="password" id="authPass" placeholder="••••••••" class="w-full bg-slate-950/40 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 shadow-inner">
                                </div>
                                <button onclick="app.handleAuthSubmit()" class="algebraic-btn w-full py-4 rounded-2xl text-sm font-bold shadow-lg">
                                    ${isLogin ? 'Authenticate Session ⚡' : 'Instantiate Entity ✦'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            handleAuthSubmit() {
                const email = document.getElementById('authEmail').value;
                const name = document.getElementById('authName') ? document.getElementById('authName').value : 'Scholar';
                if (!email) {
                    alert('Please provide a valid identifier.');
                    return;
                }
                this.user = { name: name || email.split('@')[0], email, role: 'Category Theorist' };
                localStorage.setItem('morphism_user', JSON.stringify(this.user));
                this.navigate('dashboard');
            },

            renderDashboard() {
                const u = this.user || { name: 'Guest', email: 'guest@system.net', role: 'Observer' };
                return `
                    <div class="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                        <div class="morphism-glass p-8 rounded-[3rem] flex flex-col sm:flex-row items-center justify-between gap-6">
                            <div class="flex items-center gap-6 text-center sm:text-left">
                                <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-3xl shadow-xl">👑</div>
                                <div class="space-y-1">
                                    <span class="text-[10px] font-mono text-indigo-400 uppercase tracking-widest">Active Object Instance</span>
                                    <h2 class="text-2xl font-bold text-white">${u.name}</h2>
                                    <p class="text-xs text-slate-400 font-mono">${u.email} • Role: ${u.role}</p>
                                </div>
                            </div>
                            <button onclick="app.user=null; localStorage.removeItem('morphism_user'); app.navigate('home');" class="bg-red-500/10 border border-red-500/30 px-5 py-3 rounded-2xl text-xs font-bold text-red-400 hover:bg-red-500/20 transition">
                                Terminate Session ⎋
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="morphism-glass p-7 rounded-[2.5rem] space-y-3">
                                <span class="text-xs font-mono uppercase text-indigo-400">Class Type</span>
                                <div class="text-2xl font-bold text-white">UserEntity[Class]</div>
                                <p class="text-xs text-slate-400">Inherits from CategoryObject base class with active state binding.</p>
                            </div>
                            <div class="morphism-glass p-7 rounded-[2.5rem] space-y-3">
                                <span class="text-xs font-mono uppercase text-purple-400">Morphism Status</span>
                                <div class="text-2xl font-bold text-white">Isomorphic (1:1)</div>
                                <p class="text-xs text-slate-400">State mapping is fully synchronized with local storage category database.</p>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderClasses() {
                return `
                    <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto">
                        <div class="text-center space-y-3">
                            <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-4 py-1.5 rounded-full text-xs font-mono uppercase tracking-widest">
                                Object-Oriented Taxonomy
                            </span>
                            <h1 class="text-3xl lg:text-4xl font-bold text-white">Class Hierarchy Registry</h1>
                            <p class="text-slate-400 text-sm">Interactive inspection of classes instantiated within the application engine.</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4">
                            <div class="morphism-glass p-8 rounded-[2.5rem] space-y-4">
                                <div class="text-xs font-mono text-indigo-400">Base Class</div>
                                <h3 class="text-xl font-bold text-white">CategoryObject</h3>
                                <p class="text-xs text-slate-400 leading-relaxed">Defines properties, unique identifiers, and structural metadata for all UI entities.</p>
                                <div class="p-3 bg-slate-950/60 rounded-xl font-mono text-[11px] text-indigo-300 border border-white/5">
                                    class CategoryObject { constructor(name, props)... }
                                </div>
                            </div>
                            <div class="morphism-glass p-8 rounded-[2.5rem] space-y-4">
                                <div class="text-xs font-mono text-purple-400">Derived Class</div>
                                <h3 class="text-xl font-bold text-white">UserEntity</h3>
                                <p class="text-xs text-slate-400 leading-relaxed">Extends base class to handle secure user authentication, sessions, and permissions.</p>
                                <div class="p-3 bg-slate-950/60 rounded-xl font-mono text-[11px] text-purple-300 border border-white/5">
                                    class UserEntity extends CategoryObject { authenticate()... }
                                </div>
                            </div>
                            <div class="morphism-glass p-8 rounded-[2.5rem] space-y-4">
                                <div class="text-xs font-mono text-pink-400">Transformation Class</div>
                                <h3 class="text-xl font-bold text-white">MorphismEngine</h3>
                                <p class="text-xs text-slate-400 leading-relaxed">Executes mapping functions to convert domain models into display structures.</p>
                                <div class="p-3 bg-slate-950/60 rounded-xl font-mono text-[11px] text-pink-300 border border-white/5">
                                    class MorphismTransformation { execute(data)... }
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderMorphismPlayground() {
                return `
                    <div class="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                        <div class="text-center space-y-3">
                            <span class="bg-purple-500/10 text-purple-300 border border-purple-500/30 px-4 py-1.5 rounded-full text-xs font-mono uppercase tracking-widest">
                                Category Theory Lab
                            </span>
                            <h1 class="text-3xl lg:text-4xl font-bold text-white">Morphism Transformation Matrix</h1>
                            <p class="text-slate-400 text-sm">Input raw object state data and observe morphism mapping into structured UI views.</p>
                        </div>

                        <div class="morphism-glass p-8 rounded-[3rem] space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-2">
                                    <label class="text-xs font-mono uppercase text-slate-400">Source Object (JSON)</label>
                                    <textarea id="sourceObjInput" rows="6" class="w-full bg-slate-950/60 border border-white/10 rounded-2xl p-4 font-mono text-xs text-indigo-300 focus:outline-none focus:border-indigo-500">{
  "rawName": "alex turing",
  "clearanceLevel": 5,
  "systemActive": true
}</textarea>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-xs font-mono uppercase text-slate-400">Transformed Output (Morphism Result)</label>
                                    <div id="morphismOutput" class="w-full bg-slate-950/80 border border-white/10 rounded-2xl p-4 font-mono text-xs text-emerald-400 h-[146px] overflow-y-auto">
                                        Click execute to apply morphism transformation...
                                    </div>
                                </div>
                            </div>
                            <button onclick="app.runMorphismTest()" class="algebraic-btn w-full py-4 rounded-2xl text-sm font-bold shadow-lg">
                                Execute Morphism Functor ⚡
                            </button>
                        </div>
                    </div>
                `;
            },

            runMorphismTest() {
                try {
                    const rawText = document.getElementById('sourceObjInput').value;
                    const parsed = JSON.parse(rawText);
                    
                    // Define a morphism: Category A -> Category B
                    const morphism = new MorphismTransformation('RawData', 'DisplayEntity', (data) => ({
                        displayName: data.rawName.toUpperCase(),
                        accessTier: `Level-${data.clearanceLevel} [Verified]`,
                        statusFlag: data.systemActive ? 'ONLINE 🟢' : 'OFFLINE 🔴',
                        morphismTimestamp: new Date().toISOString()
                    }));

                    const result = morphism.execute(parsed);
                    document.getElementById('morphismOutput').innerText = JSON.stringify(result, null, 2);
                } catch (e) {
                    document.getElementById('morphismOutput').innerText = `Morphism Error: Invalid JSON input format (${e.message})`;
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => { app.render(); });
    </script>
</body>
</html>
