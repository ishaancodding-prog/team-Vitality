<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Vitality - Sign In & Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.75) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }
        .glass-panel-hover:hover {
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 25px 50px -12px rgba(6, 182, 212, 0.15);
            transform: translateY(-3px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .text-gradient {
            background: linear-gradient(135deg, #22d3ee 0%, #818cf8 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .interactive-tab {
            transition: all 0.25s ease;
        }
        .interactive-tab:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Toast Notification System -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <div id="toast-box" class="glass-panel px-6 py-4 rounded-2xl border border-cyan-500/40 text-sm font-bold text-white shadow-2xl flex items-center gap-3">
            <span id="toast-icon">✨</span>
            <span id="toast-text">Notification message</span>
        </div>
    </div>

    <!-- Animated Background Orbs -->
    <div class="fixed top-0 left-1/4 w-[600px] h-[600px] bg-cyan-500/10 rounded-full blur-[140px] pointer-events-none animate-pulse-slow"></div>
    <div class="fixed bottom-0 right-1/4 w-[600px] h-[600px] bg-indigo-500/10 rounded-full blur-[140px] pointer-events-none animate-pulse-slow" style="animation-delay: 2s;"></div>

    <!-- NAVBAR (Hidden on Sign-In view until logged in) -->
    <header id="main-header" class="border-b border-slate-900/80 bg-[#030712]/90 backdrop-blur-2xl sticky top-0 z-40 px-8 lg:px-12 py-4 flex justify-between items-center shadow-2xl hidden">
        <div class="flex items-center gap-3.5 cursor-pointer group" onclick="router.navigateTo('home')">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-pink-500 flex items-center justify-center font-extrabold text-slate-950 text-xl shadow-lg shadow-cyan-500/25 group-hover:scale-110 transition">
                ⚡
            </div>
            <div>
                <span class="font-extrabold tracking-widest text-base bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">ABTALKS</span>
                <span class="block text-[10px] text-cyan-400 font-bold tracking-widest uppercase">Team Vitality</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center gap-2 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-800/80">
            <button onclick="router.navigateTo('home')" id="nav-home" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">🏠 Home</button>
            <button onclick="router.navigateTo('dashboard')" id="nav-dashboard" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">📊 Dashboard</button>
            <button onclick="router.navigateTo('day1')" id="nav-day1" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">⚡ Day 1</button>
            <button onclick="router.navigateTo('about')" id="nav-about" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">✨ About Us</button>
            <button onclick="router.navigateTo('contact')" id="nav-contact" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">📬 Contact</button>
        </nav>

        <div class="flex items-center gap-3">
            <button onclick="logout()" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-3.5 py-1.5 rounded-full font-bold hover:bg-red-500/20 transition">Log Out 🚪</button>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main id="app-router" class="flex-grow max-w-7xl mx-auto w-full px-6 lg:px-12 py-12 z-10 flex items-center justify-center"></main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-900 bg-[#030712] py-10 px-8 lg:px-12 z-10">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center text-xs text-slate-500 gap-4">
            <div>© 2026 ABTalks Ecosystem. Crafted with interactive precision by Team : <strong class="text-cyan-400">Vitality</strong>.</div>
            <div class="flex gap-6">
                <a href="#" onclick="router.navigateTo('about')" class="hover:text-cyan-400 transition font-semibold">About Us</a>
                <a href="#" onclick="router.navigateTo('contact')" class="hover:text-cyan-400 transition font-semibold">Contact Us</a>
            </div>
        </div>
    </footer>

    <!-- INTERACTIVE ENGINE & STATE MANAGEMENT -->
    <script>
        const appState = {
            isLoggedIn: false,
            streakDays: 1,
            synergyPoints: 50,
            isSubmitted: false,
            dashboardTab: 'tasks',
            captchaNum1: Math.floor(Math.random() * 8) + 2,
            captchaNum2: Math.floor(Math.random() * 8) + 1,
            feedbacks: [
                { name: "Aarav Mehta", role: "Full Stack Engineer", text: "Team Vitality's platform is super snappy and interactive. Tracking daily code challenges has never been this engaging!" },
                { name: "Sneha Roy", role: "AI Student Developer", text: "The live quote cycler and instant submission feedback make this app stand out completely." }
            ],
            quotes: [
                { quote: "Success isn't always about greatness. It's about consistency. Consistent hard work leads to success.", author: "Dwayne Johnson" },
                { quote: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Aristotle" },
                { quote: "Small disciplines repeated with consistency every day lead to great achievements gained slowly over time.", author: "John C. Maxwell" }
            ],
            currentQuoteIdx: 0
        };

        function showToast(msg, icon = "✨") {
            const container = document.getElementById('toast-container');
            document.getElementById('toast-text').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            container.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            container.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                container.classList.remove('translate-y-0', 'opacity-100');
                container.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3500);
        }

        const router = {
            currentRoute: 'signin',
            navigateTo(route) {
                if (!appState.isLoggedIn && route !== 'signin') {
                    route = 'signin';
                }
                this.currentRoute = route;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('signInEmail').value;
            const pass = document.getElementById('signInPass').value;
            if (!email || !pass) {
                showToast('Please enter both email and password!', '⚠️');
                return;
            }
            appState.isLoggedIn = true;
            document.getElementById('main-header').classList.remove('hidden');
            showToast('✨ Welcome back! Successfully signed in.', '🚀');
            router.navigateTo('home');
        }

        function logout() {
            appState.isLoggedIn = false;
            document.getElementById('main-header').classList.add('hidden');
            router.navigateTo('signin');
            showToast('Logged out successfully.', '🔒');
        }

        function nextQuote() {
            appState.currentQuoteIdx = (appState.currentQuoteIdx + 1) % appState.quotes.length;
            render();
        }

        // 1. SIGN IN VIEW (Animated & Interactive)
        function renderSignIn() {
            return `
                <div class="glass-panel p-8 sm:p-12 rounded-[2.5rem] max-w-md w-full space-y-8 border border-cyan-500/30 shadow-2xl animate-fadeIn">
                    <div class="text-center space-y-2">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-pink-500 flex items-center justify-center font-extrabold text-slate-950 text-2xl mx-auto shadow-lg shadow-cyan-500/25">⚡</div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Welcome Back</h1>
                        <p class="text-xs sm:text-sm text-slate-400">Sign in to access Team Vitality Hub</p>
                    </div>

                    <form onsubmit="handleSignIn(event)" class="space-y-5">
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Email Address</label>
                            <input type="email" id="signInEmail" placeholder="student@university.ac.in" class="w-full bg-slate-950/90 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition" required>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Password</label>
                            <input type="password" id="signInPass" placeholder="••••••••" class="w-full bg-slate-950/90 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition" required>
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:opacity-95 text-slate-950 font-extrabold py-4 rounded-2xl text-sm transition shadow-xl shadow-cyan-500/20">
                            Sign In to Dashboard 🚀
                        </button>
                    </form>
                </div>
            `;
        }

        // 2. HOME / LANDING VIEW
        function renderLanding() {
            const q = appState.quotes[appState.currentQuoteIdx];
            return `
                <div class="space-y-20 animate-fadeIn py-6 w-full">
                    <div class="glass-panel p-10 lg:p-16 rounded-[2.5rem] text-center space-y-8 border border-cyan-500/20 shadow-2xl relative overflow-hidden">
                        <div class="inline-flex items-center gap-2.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/25 px-5 py-2 rounded-full text-xs font-extrabold uppercase tracking-widest">
                            <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span> Made by Team : Vitality • Interactive Edition
                        </div>
                        <h1 class="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-white leading-[1.1] max-w-5xl mx-auto">
                            Code Without Limits.<br>Own Your <span class="text-gradient">60-Day Public Streak.</span>
                        </h1>
                        <p class="text-slate-300 text-base sm:text-lg leading-relaxed max-w-3xl mx-auto font-medium">
                            Transform post-college hours into high-impact applications. Commit code daily, build production-ready projects, and showcase your proof of work.
                        </p>
                        <div class="pt-4 flex flex-wrap justify-center items-center gap-4">
                            <button onclick="router.navigateTo('dashboard')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold px-9 py-4 rounded-2xl text-base transition shadow-xl shadow-cyan-500/25">
                                Ignite Your Dashboard 🚀
                            </button>
                            <button onclick="router.navigateTo('about')" class="glass-panel glass-panel-hover text-white font-bold px-8 py-4 rounded-2xl text-base transition">
                                Meet Team Vitality ✨
                            </button>
                        </div>
                    </div>

                    <!-- Quote Section -->
                    <div class="space-y-6 max-w-3xl mx-auto text-center">
                        <div class="glass-panel p-8 lg:p-10 rounded-[2.5rem] space-y-6 relative border border-cyan-500/30 shadow-2xl">
                            <p class="text-base lg:text-lg text-slate-200 italic font-medium">"${q.quote}"</p>
                            <div class="pt-4 border-t border-slate-800/80 flex justify-between items-center">
                                <span class="text-sm font-extrabold text-cyan-400">— ${q.author}</span>
                                <button onclick="nextQuote()" class="bg-cyan-500/15 hover:bg-cyan-500 text-cyan-300 hover:text-slate-950 border border-cyan-500/30 px-5 py-2.5 rounded-xl text-xs font-bold transition">Next Quote 🔄</button>
                            </div>
                        </div>
                    </div>

                    <!-- Testimonials -->
                    <div class="space-y-8">
                        <div class="text-center">
                            <h2 class="text-3xl font-extrabold text-white">Student Feedback & Reviews</h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${appState.feedbacks.map(fb => `
                                <div class="glass-panel p-7 rounded-[2rem] space-y-4">
                                    <div class="flex justify-between items-center">
                                        <h4 class="font-extrabold text-white text-base">${fb.name}</h4>
                                        <span class="text-[11px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/25 px-3 py-1 rounded-full font-bold">${fb.role}</span>
                                    </div>
                                    <p class="text-slate-300 text-sm">"${fb.text}"</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // 3. DASHBOARD VIEW
        function renderDashboard() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto w-full py-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass-panel p-7 rounded-[2rem]">
                            <span class="text-xs uppercase font-extrabold text-cyan-400">Current Streak</span>
                            <div class="text-4xl font-extrabold text-white mt-2">${appState.streakDays} Day 🔥</div>
                        </div>
                        <div class="glass-panel p-7 rounded-[2rem]">
                            <span class="text-xs uppercase font-extrabold text-indigo-400">Progress</span>
                            <div class="text-4xl font-extrabold text-white mt-2">1.6%</div>
                        </div>
                        <div class="glass-panel p-7 rounded-[2rem]">
                            <span class="text-xs uppercase font-extrabold text-emerald-400">Synergy Points</span>
                            <div class="text-4xl font-extrabold text-emerald-400 mt-2">${appState.synergyPoints} SP</div>
                        </div>
                    </div>

                    <div class="glass-panel p-2.5 rounded-2xl flex flex-wrap gap-2">
                        <button onclick="appState.dashboardTab='tasks';render();" class="flex-1 py-3 px-4 text-xs font-extrabold rounded-xl transition ${appState.dashboardTab === 'tasks' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400'}">📋 Today's Task</button>
                        <button onclick="appState.dashboardTab='leaderboard';render();" class="flex-1 py-3 px-4 text-xs font-extrabold rounded-xl transition ${appState.dashboardTab === 'leaderboard' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400'}">🏆 Leaderboard</button>
                    </div>

                    ${appState.dashboardTab === 'tasks' ? `
                        <div class="glass-panel p-8 rounded-[2.5rem] space-y-6">
                            <h3 class="font-extrabold text-2xl text-white">Environment Setup & Hello World</h3>
                            <p class="text-slate-300 text-sm">Initialize your public GitHub repository and deploy your Day 1 task.</p>
                            <button onclick="router.navigateTo('day1')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold px-8 py-4 rounded-2xl text-sm transition">Open Day 1 Portal →</button>
                        </div>
                    ` : `
                        <div class="glass-panel p-8 rounded-[2.5rem] space-y-4">
                            <h4 class="text-sm font-extrabold text-slate-300 uppercase">Top Performers</h4>
                            <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
                                <span class="font-bold text-cyan-300">Ishaan Thusoo (You)</span>
                                <span class="text-cyan-400 font-bold text-xs">1 Day Streak (${appState.synergyPoints} SP)</span>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        // 4. DAY 1 CHALLENGE VIEW
        function renderDay1() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-3xl mx-auto w-full py-6">
                    <button onclick="router.navigateTo('dashboard')" class="text-sm text-slate-400 hover:text-white font-bold">← Back to Dashboard</button>
                    <div class="glass-panel p-8 rounded-[2.5rem] space-y-6">
                        <h3 class="text-xl font-extrabold text-white">🚀 Submit Day 1 Proof of Work</h3>
                        <div class="space-y-4">
                            <input type="text" id="ghInput" placeholder="https://github.com/username/repo" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:border-cyan-400 outline-none">
                            <input type="text" id="liInput" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:border-cyan-400 outline-none">
                        </div>
                        <button onclick="showToast('✅ Day 1 Verified! +50 Synergy Points added.', '🔥'); appState.isSubmitted=true; router.navigateTo('dashboard');" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-4 rounded-2xl text-sm transition">
                            Verify & Submit Proof
                        </button>
                    </div>
                </div>
            `;
        }

        // 5. ABOUT US VIEW (Team Vitality Members)
        function renderAbout() {
            return `
                <div class="space-y-12 animate-fadeIn max-w-5xl mx-auto w-full py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-4 py-1.5 rounded-full">About Us • Team Vitality</span>
                        <h1 class="text-4xl font-extrabold text-white">Meet Our Core Team</h1>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="glass-panel p-8 rounded-[2.5rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-pink-500/10 text-pink-400 flex items-center justify-center text-2xl mx-auto">🎨</div>
                            <h3 class="text-2xl font-extrabold text-white">Mahima</h3>
                            <p class="text-xs text-pink-400 font-extrabold uppercase">Designer</p>
                        </div>
                        <div class="glass-panel p-8 rounded-[2.5rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-2xl mx-auto">🤖</div>
                            <h3 class="text-2xl font-extrabold text-white">Diksha</h3>
                            <p class="text-xs text-indigo-400 font-extrabold uppercase">AI Engineer</p>
                        </div>
                        <div class="glass-panel p-8 rounded-[2.5rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-2xl mx-auto">💻</div>
                            <h3 class="text-2xl font-extrabold text-white">Ishaan</h3>
                            <p class="text-xs text-cyan-400 font-extrabold uppercase">Frontend and Backend Developer</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 6. CONTACT US VIEW
        function renderContact() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-2xl mx-auto w-full py-6">
                    <div class="text-center space-y-2">
                        <h1 class="text-4xl font-extrabold text-white">Contact Team Vitality</h1>
                    </div>
                    <div class="glass-panel p-8 rounded-[2.5rem] space-y-5">
                        <input type="text" id="cName" placeholder="Your Name" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white outline-none focus:border-cyan-400">
                        <textarea id="cMsg" rows="4" placeholder="Your Message" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white outline-none focus:border-cyan-400 resize-none"></textarea>
                        <button onclick="showToast('✅ Message sent to Team Vitality!', '📬'); document.getElementById('cName').value=''; document.getElementById('cMsg').value='';" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-4 rounded-2xl text-sm">Send Message</button>
                    </div>
                </div>
            `;
        }

        function render() {
            const route = router.currentRoute;
            let html = '';
            if (route === 'signin') html = renderSignIn();
            else if (route === 'home') html = renderLanding();
            else if (route === 'dashboard') html = renderDashboard();
            else if (route === 'day1') html = renderDay1();
            else if (route === 'about') html = renderAbout();
            else if (route === 'contact') html = renderContact();
            
            document.getElementById('app-router').innerHTML = html;

            // Update nav active styling
            ['home', 'dashboard', 'day1', 'about', 'contact'].forEach(r => {
                const btn = document.getElementById('nav-' + r);
                if (btn) {
                    btn.className = (r === route) ? 'px-4 py-2 text-xs font-bold rounded-xl transition bg-cyan-500 text-slate-950 shadow-lg' : 'px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => { router.navigateTo('signin'); });
    </script>
</body>
</html>
