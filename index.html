<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABTalks - 60-Day Coding Challenge Hub (Pure White Crystal Transparency Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                }
            }
        }
    </script>
    <style>
        /* Pure White Transparent Crystal Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3), 0 0 40px rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
        }
        .white-glow-btn {
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 50%, #e5e7eb 100%);
            color: #030712;
            font-weight: 800;
            box-shadow: 0 12px 35px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .white-glow-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 18px 45px rgba(255, 255, 255, 0.5);
        }
        .white-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #e5e7eb 50%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes slideInFromRight {
            0% { opacity: 0; transform: translateX(35px) scale(0.98); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .animate-slide {
            animation: slideInFromRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: floatCard 4s ease-in-out infinite; }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 25s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }

        @keyframes morphBlob {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translate(0px, 0px) scale(1); }
            50% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; transform: translate(40px, -40px) scale(1.15); }
        }
        .animate-morph-blob {
            animation: morphBlob 16s ease-in-out infinite;
        }

        .star-rating span {
            cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .star-rating span:hover { transform: scale(1.25); }
        .star-rating span.active {
            color: #ffffff;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
        }

        @media (max-width: 768px) {
            .mobile-padding { padding-left: 1rem !important; padding-right: 1rem !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-white selection:text-slate-950 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Pure White Crystal Transparent Backdrop Ambient Orbs -->
    <div class="fixed top-[-15%] left-[-10%] w-[800px] h-[800px] bg-white/10 rounded-full blur-[200px] pointer-events-none animate-morph-blob"></div>
    <div class="fixed bottom-[-15%] right-[-10%] w-[800px] h-[800px] bg-slate-200/10 rounded-full blur-[200px] pointer-events-none animate-morph-blob" style="animation-delay: -8s;"></div>

    <!-- NAVBAR -->
    <header class="border-b border-white/15 bg-white/[0.03] backdrop-blur-3xl sticky top-0 z-50 px-4 sm:px-6 lg:px-20 py-4 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="router.navigateTo('/')">
            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-tr from-white to-slate-300 flex items-center justify-center font-extrabold text-slate-950 text-xl sm:text-2xl shadow-xl shadow-white/20 group-hover:scale-105 transition">
                💎
            </div>
            <div>
                <span class="font-extrabold tracking-widest text-xs sm:text-sm text-white uppercase">ABTALKS</span>
                <span class="block text-[9px] sm:text-[10px] text-slate-300 font-bold tracking-widest uppercase">Team Vitality</span>
            </div>
        </div>

        <nav class="hidden lg:flex items-center gap-1 bg-white/[0.05] p-1.5 rounded-2xl border border-white/15 backdrop-blur-3xl">
            <button onclick="router.navigateTo('/')" id="nav-home" class="px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white">Overview</button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white">Dashboard</button>
            <button onclick="router.navigateTo('/day/1')" id="nav-day" class="px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white">Day One</button>
            <button onclick="router.navigateTo('/chat')" id="nav-chat" class="px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white">Community Chat 💬</button>
            <button onclick="router.navigateTo('/news')" id="nav-news" class="px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white">Tech News 📰</button>
            <button onclick="router.navigateTo('/analytics')" id="nav-analytics" class="px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white">Analytics 📊</button>
            <button onclick="router.navigateTo('/resources')" id="nav-resources" class="px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white">Resources 📚</button>
            <button onclick="router.navigateTo('/about')" id="nav-about" class="px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white">About</button>
            <button onclick="router.navigateTo('/contact')" id="nav-contact" class="px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white">Contact</button>
        </nav>

        <div class="flex items-center gap-3">
            <div id="liveClock" class="hidden xl:flex items-center gap-2 bg-white/[0.05] border border-white/15 px-4 py-2 rounded-xl font-mono text-xs text-white font-bold backdrop-blur-3xl">
                <span>🕒</span> <span id="clockText">00:00:00 AM</span>
            </div>
            <button onclick="router.navigateTo('/signin')" id="nav-auth-btn" class="bg-white/10 border border-white/20 hover:border-white px-3.5 sm:px-4 py-2 rounded-xl text-xs font-bold transition text-white shadow-md backdrop-blur-3xl">
                Sign In / Login ✦
            </button>
            <button onclick="toggleMobileMenu()" class="lg:hidden p-2 rounded-xl bg-white/10 border border-white/20 text-white backdrop-blur-3xl">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
    </header>

    <!-- MOBILE NAVIGATION DRAWER -->
    <div id="mobileMenu" class="fixed inset-0 bg-slate-950/90 backdrop-blur-3xl z-50 flex flex-col p-6 space-y-4 hidden lg:hidden">
        <div class="flex justify-between items-center border-b border-white/15 pb-4">
            <span class="font-extrabold tracking-widest text-sm text-white uppercase">Menu Navigation</span>
            <button onclick="toggleMobileMenu()" class="w-10 h-10 rounded-xl bg-white/10 text-white flex items-center justify-center font-bold">✕</button>
        </div>
        <div class="flex flex-col space-y-2 overflow-y-auto flex-grow py-2">
            <button onclick="toggleMobileMenu(); router.navigateTo('/');" class="text-left px-4 py-3 rounded-xl bg-white/[0.05] text-xs font-bold text-white backdrop-blur-3xl">Overview</button>
            <button onclick="toggleMobileMenu(); router.navigateTo('/dashboard');" class="text-left px-4 py-3 rounded-xl bg-white/[0.05] text-xs font-bold text-white backdrop-blur-3xl">Dashboard</button>
            <button onclick="toggleMobileMenu(); router.navigateTo('/day/1');" class="text-left px-4 py-3 rounded-xl bg-white/[0.05] text-xs font-bold text-white backdrop-blur-3xl">Day One Challenge</button>
            <button onclick="toggleMobileMenu(); router.navigateTo('/chat');" class="text-left px-4 py-3 rounded-xl bg-white/[0.05] text-xs font-bold text-white backdrop-blur-3xl">Community Chat 💬</button>
            <button onclick="toggleMobileMenu(); router.navigateTo('/news');" class="text-left px-4 py-3 rounded-xl bg-white/[0.05] text-xs font-bold text-white backdrop-blur-3xl">Tech News 📰</button>
            <button onclick="toggleMobileMenu(); router.navigateTo('/analytics');" class="text-left px-4 py-3 rounded-xl bg-white/[0.05] text-xs font-bold text-white backdrop-blur-3xl">Analytics 📊</button>
            <button onclick="toggleMobileMenu(); router.navigateTo('/resources');" class="text-left px-4 py-3 rounded-xl bg-white/[0.05] text-xs font-bold text-white backdrop-blur-3xl">Resources 📚</button>
            <button onclick="toggleMobileMenu(); router.navigateTo('/about');" class="text-left px-4 py-3 rounded-xl bg-white/[0.05] text-xs font-bold text-white backdrop-blur-3xl">About Us</button>
            <button onclick="toggleMobileMenu(); router.navigateTo('/contact');" class="text-left px-4 py-3 rounded-xl bg-white/[0.05] text-xs font-bold text-white backdrop-blur-3xl">Contact Us</button>
        </div>
    </div>

    <!-- MAIN ROUTER CONTAINER -->
    <main id="app-router" class="flex-grow max-w-7xl mx-auto w-full mobile-padding py-8 sm:py-12 z-10 overflow-x-hidden"></main>

    <!-- TOAST NOTIFICATION POPUP -->
    <div id="toastContainer" class="fixed bottom-6 right-4 left-4 sm:left-auto sm:right-6 z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <div id="toastMessageContent" class="glass-card px-5 py-3.5 rounded-2xl border border-white/30 text-xs font-bold text-white shadow-2xl flex items-center gap-3 backdrop-blur-3xl">
            <span class="text-white">✦</span> <span id="toastText">Notification message</span>
        </div>
    </div>

    <!-- AVATAR EDITOR MODAL OVERLAY -->
    <div id="avatarModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-3xl z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card p-6 sm:p-8 rounded-[2.5rem] sm:rounded-[3rem] max-w-lg w-full space-y-6 border border-white/30 backdrop-blur-3xl">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-xs font-bold uppercase tracking-widest text-slate-300">Persona Customizer</span>
                    <h3 class="text-lg sm:text-xl font-extrabold text-white mt-1">Select Your Indian Avatar</h3>
                </div>
                <button onclick="closeAvatarModal()" class="w-9 h-9 rounded-xl bg-white/10 border border-white/25 text-white flex items-center justify-center font-bold hover:bg-white/20">✕</button>
            </div>
            <p class="text-xs text-slate-300">Choose from 10 professional student avatars:</p>
            <div class="grid grid-cols-4 sm:grid-cols-5 gap-3 max-h-60 overflow-y-auto p-2 bg-white/[0.03] border border-white/15 rounded-2xl backdrop-blur-3xl" id="modalAvatarGrid"></div>
            <div class="pt-2 flex gap-3">
                <button onclick="saveModalAvatar()" class="white-glow-btn flex-1 py-3.5 rounded-2xl text-xs">Save Avatar 💎</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="border-t border-white/15 bg-white/[0.03] py-8 sm:py-10 px-6 lg:px-20 z-10 text-xs text-slate-400 backdrop-blur-3xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 font-semibold text-center md:text-left">
            <div>© 2026 ABTalks Ecosystem. Crystal Transparent Edition by Team <span class="text-white">Vitality</span>[cite: 1].</div>
            <div class="flex flex-wrap justify-center gap-4 sm:gap-6">
                <a href="#/" onclick="router.navigateTo('/')" class="hover:text-white transition">Overview</a>
                <a href="#/dashboard" onclick="router.navigateTo('/dashboard')" class="hover:text-white transition">Dashboard</a>
                <a href="#/chat" onclick="router.navigateTo('/chat')" class="hover:text-white transition">Chat 💬</a>
                <a href="#/news" onclick="router.navigateTo('/news')" class="hover:text-white transition">News 📰</a>
                <a href="#/contact" onclick="router.navigateTo('/contact')" class="hover:text-white transition">Contact</a>
            </div>
        </div>
    </footer>

    <!-- ENGINE SCRIPT -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            if (menu) menu.classList.toggle('hidden');
        }

        // XSS Sanitization Helper[cite: 1]
        function sanitize(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        const appState = {
            streakDays: parseInt(localStorage.getItem('abtalks_streak')) || 1,
            selectedTrack: 'AI & Full Stack',
            githubLink: localStorage.getItem('abtalks_gh') || '',
            linkedinLink: localStorage.getItem('abtalks_li') || '',
            isSubmitted: localStorage.getItem('abtalks_submitted') === 'true',
            synergyPoints: parseInt(localStorage.getItem('abtalks_sp')) || 50,
            selectedCalendarDay: 1,
            selectedRating: 5,
            captchaNum1: 4,
            captchaNum2: 3,
            captchaInput: '',
            currentUser: JSON.parse(localStorage.getItem('abtalks_user')) || null, 
            selectedAvatar: 'Aarav',
            authMode: 'signin', 
            pendingEmail: '',
            pendingName: '',
            pendingPass: '',
            generatedOtp: '',
            activeSlideTab: 0,
            chatInput: '',
            chatMessages: JSON.parse(localStorage.getItem('abtalks_chat')) || [
                { sender: 'Rohan Sharma', avatar: 'Rohan', text: sanitize('Hey everyone! Welcome to the 60-day coding challenge cohort!'), time: '10:14 AM' },
                { sender: 'Priya Patel', avatar: 'Priya', text: sanitize('Just completed Day 1 setup. The AI & Full Stack track looks incredible!'), time: '10:18 AM' }
            ]
        };

        const interactiveSlides = [
            {
                tag: "PHASE 01 • FOUNDATION",
                title: "Initialize Your Developer Environment",
                desc: "Set up version control, configure your remote repository, and execute your first public deployment to ignite your 60-day streak with professional grade tools.",
                stat: "Day 1 to 15",
                highlight: "GitHub & CI/CD Setup"
            },
            {
                tag: "PHASE 02 • ARCHITECTURE",
                title: "Build High-Performance Applications",
                desc: "Implement modern component architectures, state management, and robust backend endpoints tailored for real-world production environments.",
                stat: "Day 16 to 40",
                highlight: "Full-Stack Scaling"
            },
            {
                tag: "PHASE 03 • DEPLOYMENT & LAUNCH",
                title: "Production & Professional Proof",
                desc: "Integrate robust testing suites, secure authentication pipelines, and automated deployments to stand out to elite tech recruiters.",
                stat: "Day 41 to 60",
                highlight: "Production Launch"
            }
        ];

        const avatarChoices = [
            { seed: "Aarav", name: "Aarav", role: "Software Engineer" },
            { seed: "Rohan", name: "Rohan", role: "Full Stack Dev" },
            { seed: "Kabir", name: "Kabir", role: "Backend Architect" },
            { seed: "Aditya", name: "Aditya", role: "Tech Lead" },
            { seed: "Ishaan", name: "Ishaan", role: "Cloud Specialist" },
            { seed: "Ananya", name: "Ananya", role: "UI/UX Designer" },
            { seed: "Diya", name: "Diya", role: "Frontend Dev" },
            { seed: "Priya", name: "Priya", role: "Data Scientist" },
            { seed: "Neha", name: "Neha", role: "Security Analyst" },
            { seed: "Kavya", name: "Kavya", role: "Systems Researcher" }
        ];

        const techNewsData = [
            {
                tag: "AI & LLMs",
                title: "Next-Gen AI Code Assistants Reach 98% Benchmark Precision in Complex Refactoring",
                date: "June 6, 2026",
                source: "TechCrunch AI",
                desc: "Recent evaluations of developer workflows show that advanced multi-file reasoning models have cut production debugging cycles in half for full-stack engineering teams."
            },
            {
                tag: "Cloud Infrastructure",
                title: "Serverless Edge Computing Adopted by 75% of Enterprise Scale Startups",
                date: "June 5, 2026",
                source: "DevOps Weekly",
                desc: "Global cloud providers announced new zero-latency micro-VM runtimes, enabling instantaneous full-stack application scaling across international regions."
            },
            {
                tag: "Security & DevOps",
                title: "Mandatory Automated CI/CD Checks Redefine Open Source Contribution Standards",
                date: "June 4, 2026",
                source: "GitHub Octoverse",
                desc: "Top repositories are now requiring strict zero-vulnerability container scans and automated test coverage thresholds before merging any community pull requests."
            }
        ];

        function openAvatarModal() {
            const grid = document.getElementById('modalAvatarGrid');
            if (grid) {
                grid.innerHTML = avatarChoices.map(av => `
                    <div onclick="appState.selectedAvatar='${av.seed}'; updateLiveAvatar();" class="cursor-pointer flex flex-col items-center p-2 rounded-xl transition border modal-av-item-${av.seed} ${appState.selectedAvatar === av.seed ? 'bg-white/20 border-white scale-105 shadow-md shadow-white/30' : 'border-transparent hover:bg-white/10'}">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${av.seed}&backgroundColor=ffffff" alt="${av.name}" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/20 p-0.5">
                        <span class="text-[9px] sm:text-[10px] font-bold text-white mt-1 text-center">${av.name}</span>
                    </div>
                `).join('');
            }
            document.getElementById('avatarModal').classList.remove('hidden');
        }

        function closeAvatarModal() {
            document.getElementById('avatarModal').classList.add('hidden');
        }

        function updateLiveAvatar() {
            avatarChoices.forEach(av => {
                const el = document.querySelector(`.modal-av-item-${av.seed}`);
                if (el) {
                    if (appState.selectedAvatar === av.seed) {
                        el.className = `cursor-pointer flex flex-col items-center p-2 rounded-xl transition border bg-white/20 border-white scale-105 shadow-md shadow-white/30 modal-av-item-${av.seed}`;
                    } else {
                        el.className = `cursor-pointer flex flex-col items-center p-2 rounded-xl transition border border-transparent hover:bg-white/10 modal-av-item-${av.seed}`;
                    }
                }
            });
        }

        function saveModalAvatar() {
            if (appState.currentUser) {
                appState.currentUser.avatar = appState.selectedAvatar;
                localStorage.setItem('abtalks_user', JSON.stringify(appState.currentUser));
            }
            showToast(`✦ Avatar updated to ${appState.selectedAvatar}!`);
            closeAvatarModal();
            render();
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const textEl = document.getElementById('toastText');
            if (container && textEl) {
                textEl.innerText = msg;
                container.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
                container.classList.add('translate-y-0', 'opacity-100');
                setTimeout(() => {
                    container.classList.remove('translate-y-0', 'opacity-100');
                    container.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
                }, 3500);
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const formattedHours = String(hours).padStart(2, '0');

            const timeString = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
            const clockEl = document.getElementById('clockText');
            if (clockEl) clockEl.innerText = timeString;
        }
        setInterval(updateClock, 1000);

        const router = {
            currentRoute: '/',
            init() { 
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) { 
                window.location.hash = route;
                this.currentRoute = route;
                render(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. HOMEPAGE (Overview) WITH SLIDING AVATAR MARQUEE
        function renderLanding() {
            const currentSlide = interactiveSlides[appState.activeSlideTab];
            const marqueeAvatars = [...avatarChoices, ...avatarChoices];

            return `
                <div class="space-y-12 sm:space-y-16 animate-fadeIn py-4 sm:py-6">
                    <!-- Hero Header / Crystal Transparent Call to Action -->
                    <div class="glass-card p-6 sm:p-12 lg:p-20 rounded-[2.5rem] sm:rounded-[3.5rem] relative overflow-hidden text-center space-y-6 sm:space-y-8 shadow-2xl backdrop-blur-3xl">
                        <div class="absolute -top-32 -right-32 w-96 h-96 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-slate-300/10 rounded-full blur-3xl pointer-events-none"></div>

                        <div class="inline-flex items-center gap-2 bg-white/10 text-white border border-white/25 px-4 sm:px-6 py-2 sm:py-2.5 rounded-full text-[11px] sm:text-xs font-extrabold uppercase tracking-widest shadow-inner backdrop-blur-3xl">
                            <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-white animate-pulse"></span> Team Vitality • 60-Day Elite Tech Cohort[cite: 1]
                        </div>
                        
                        <h1 class="text-3xl sm:text-5xl lg:text-7xl font-extrabold tracking-tight text-white leading-[1.15] max-w-5xl mx-auto">
                            Master Code & Build Your <span class="white-gradient">60-Day Legacy.</span>
                        </h1>
                        
                        <p class="text-slate-300 text-sm sm:text-base lg:text-lg leading-relaxed max-w-3xl mx-auto font-normal">
                            Designed specifically for ambitious engineering students. Turn post-college hours into high-impact GitHub commits, professional verification, and industry proof of work.
                        </p>

                        <!-- Action Buttons -->
                        <div class="pt-2 sm:pt-4 flex flex-col sm:flex-row justify-center items-center gap-3 sm:gap-5 w-full">
                            <button onclick="router.navigateTo('/dashboard')" class="white-glow-btn w-full sm:w-auto px-8 sm:px-10 py-3.5 sm:py-4 rounded-2xl text-sm tracking-wide">
                                Access Dashboard 💎
                            </button>
                            <button onclick="appState.authMode='signin'; router.navigateTo('/signin');" class="glass-card w-full sm:w-auto text-white font-bold px-7 sm:px-9 py-3.5 sm:py-4 rounded-2xl text-sm transition hover:bg-white/20 border border-white/30 backdrop-blur-3xl">

            appState.chatMessages.push({ sender: senderName, avatar: senderAvatar, text: sanitizedText, time: timeNow });

                    <div class="glass-card p-6 sm:p-8 rounded-[2.5rem] sm:rounded-[3.5rem] space-y-5 backdrop-blur-3xl">

                        <div class="space-y-3 text-xs">

        function renderResources() {

        // 8. ANIMATED ABOUT US SECTION (/about)
        function renderAbout() {

                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-slate-300 bg-white/10 border border-white/25 px-4 py-1.5 rounded-full backdrop-blur-3xl">About Us • Team Vitality</span>
                        <h1 class="text-2xl sm:text-4xl lg:text-5xl font-extrabold text-white tracking-tight">Meet Our Core Team</h1>

                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pt-4">
                        <div class="glass-card p-8 rounded-[3rem] space-y-4 text-center animate-float backdrop-blur-3xl">
                            <div class="w-16 h-16 rounded-2xl bg-white/15 border border-white/30 text-white flex items-center justify-center font-bold text-xl mx-auto shadow-lg shadow-white/20 backdrop-blur-3xl">🎨</div>
                            <h3 class="text-2xl font-extrabold text-white">Mahima</h3>
                            <p class="text-xs text-slate-300 font-bold uppercase tracking-widest">Designer</p>

                        <div class="glass-card p-8 rounded-[3rem] space-y-4 text-center animate-float backdrop-blur-3xl" style="animation-delay: 0.5s;">
                            <div class="w-16 h-16 rounded-2xl bg-white/15 border border-white/30 text-white flex items-center justify-center font-bold text-xl mx-auto shadow-lg shadow-white/20 backdrop-blur-3xl">🤖</div>
                            <h3 class="text-2xl font-extrabold text-white">Diksha</h3>
                            <p class="text-xs text-slate-300 font-bold uppercase tracking-widest">AI Specialist</p>
                            <p class="text-slate-300 text-xs font-normal">Engineered intelligent workflows and cutting-edge assistance mechanics.</p>
                        </div>

                        <div class="glass-card p-8 rounded-[3rem] space-y-4 text-center animate-float backdrop-blur-3xl" style="animation-delay: 1s;">
                            <div class="w-16 h-16 rounded-2xl bg-white/15 border border-white/30 text-white flex items-center justify-center font-bold text-xl mx-auto shadow-lg shadow-white/20 backdrop-blur-3xl">💻</div>
                            <h3 class="text-2xl font-extrabold text-white">Ishaan</h3>
                            <p class="text-xs text-slate-300 font-bold uppercase tracking-widest">Frontend & Backend Developer</p>

                        </div>
                    </div>

            `;
        }

        // 9. CONTACT US SECTION (/contact)
        function renderContact() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-3xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-slate-300 bg-white/10 border border-white/25 px-4 py-1.5 rounded-full backdrop-blur-3xl">Get In Touch</span>
                        <h1 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight">Contact Team Vitality</h1>
                        <p class="text-slate-300 text-sm font-medium">Have feedback or inquiries? Send us a message and rate your experience below.</p>
                    </div>

                    <div class="glass-card p-6 sm:p-8 lg:p-12 rounded-[2.5rem] sm:rounded-[3.5rem] space-y-6 backdrop-blur-3xl">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-300 mb-2">Your Name</label>
                                <input type="text" id="contactName" placeholder="Enter your name" class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 sm:px-5 py-3.5 text-xs sm:text-sm text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-300 mb-2">Email Address</label>
                                <input type="email" id="contactEmail" placeholder="student@university.ac.in" class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 sm:px-5 py-3.5 text-xs sm:text-sm text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-300 mb-2">Platform Experience Rating</label>
                            <div class="star-rating flex gap-3 text-3xl text-slate-500" id="starRatingContainer">
                                <span onclick="setRating(1)" class="${appState.selectedRating >= 1 ? 'active' : ''}">★</span>
                                <span onclick="setRating(2)" class="${appState.selectedRating >= 2 ? 'active' : ''}">★</span>
                                <span onclick="setRating(3)" class="${appState.selectedRating >= 3 ? 'active' : ''}">★</span>
                                <span onclick="setRating(4)" class="${appState.selectedRating >= 4 ? 'active' : ''}">★</span>
                                <span onclick="setRating(5)" class="${appState.selectedRating >= 5 ? 'active' : ''}">★</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-300 mb-2">Message / Feedback</label>
                            <textarea id="contactMsg" rows="4" placeholder="How can we assist you?" class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 sm:px-5 py-3.5 text-xs sm:text-sm text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl resize-none"></textarea>
                        </div>
                        <button onclick="handleContactSubmit()" class="white-glow-btn w-full py-4 rounded-2xl text-base">
                            Submit Feedback & Rating 💎
                        </button>
                    </div>
                </div>
            `;
        }

        function handleContactSubmit() {
            const rawName = document.getElementById('contactName').value;
            const cleanName = sanitize(rawName); // XSS Sanitization Patch[cite: 1]
            if(!cleanName) {
                showToast('Please enter your name.');
                return;
            }
            showToast(`💎 Feedback & ${appState.selectedRating}-Star Rating sent successfully, ${cleanName}!`);
        }

        // 10. GLASSMORPHISM SIGN UP / LOGIN PAGE (/signin) WITH VERIFICATION WORKFLOW
        function renderSignIn() {
            const isLogin = appState.authMode === 'login';
            const isVerify = appState.authMode === 'verify';

            if (isVerify) {
                return `
                    <div class="space-y-8 animate-fadeIn max-w-xl mx-auto py-8">
                        <div class="text-center space-y-2">
                            <span class="text-xs font-bold uppercase tracking-widest text-slate-300 bg-white/10 border border-white/25 px-4 py-1.5 rounded-full backdrop-blur-3xl">Email Verification</span>
                            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Verify Your College Email</h1>
                            <p class="text-slate-300 text-xs sm:text-sm font-medium">We have sent a verification code to <span class="text-white underline">${appState.pendingEmail}</span>.</p>
                        </div>

                        <div class="glass-card p-6 sm:p-8 rounded-[2.5rem] sm:rounded-[3rem] space-y-6 text-center shadow-2xl backdrop-blur-3xl">
                            <div class="bg-white/10 border border-white/20 p-4 rounded-2xl text-xs text-white font-mono backdrop-blur-3xl">
                                💡 <strong>Developer Sandbox Notice:</strong> Your simulated verification code is <span class="text-white font-extrabold text-sm underline">${appState.generatedOtp}</span>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-300 mb-2">Enter 6-Digit OTP Code</label>
                                    <input type="text" id="otpInput" maxlength="6" placeholder="123456" class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-3.5 text-center font-mono tracking-widest text-lg text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">
                                </div>
                                <button onclick="handleVerifyOtp()" class="white-glow-btn w-full py-4 rounded-2xl text-sm">
                                    Verify Email & Complete Registration 💎
                                </button>
                                <button onclick="appState.authMode='signin'; render();" class="text-xs text-slate-300 hover:text-white font-bold underline">
                                    ← Back to Sign Up
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="space-y-8 animate-fadeIn max-w-xl mx-auto py-8">
                    <div class="text-center space-y-2">
                        <span class="text-xs font-bold uppercase tracking-widest text-slate-300 bg-white/10 border border-white/25 px-4 py-1.5 rounded-full backdrop-blur-3xl">Secure Authentication</span>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">${isLogin ? 'Login to Your Account' : 'Create Account & Choose Avatar'}</h1>
                        <p class="text-slate-300 text-xs font-medium">${isLogin ? 'Enter your credentials to access your active 60-day challenge.' : 'Select your professional persona and initialize your cohort streak.'}</p>
                    </div>

                    <div class="glass-card p-6 sm:p-8 rounded-[2.5rem] sm:rounded-[3rem] space-y-6 shadow-2xl backdrop-blur-3xl">
                        <!-- Mode Switcher Tabs -->
                        <div class="flex bg-white/10 p-1.5 rounded-2xl border border-white/20 backdrop-blur-3xl">
                            <button onclick="appState.authMode='signin'; render();" class="flex-1 py-2.5 rounded-xl text-[11px] sm:text-xs font-extrabold transition ${!isLogin ? 'bg-white text-slate-950 shadow-md' : 'text-slate-300 hover:text-white'}">
                                New Registration
                            </button>
                            <button onclick="appState.authMode='login'; render();" class="flex-1 py-2.5 rounded-xl text-[11px] sm:text-xs font-extrabold transition ${isLogin ? 'bg-white text-slate-950 shadow-md' : 'text-slate-300 hover:text-white'}">
                                Existing User Login
                            </button>
                        </div>

                        ${!isLogin ? `
                            <div class="space-y-3">
                                <label class="block text-xs font-bold uppercase text-slate-300 text-center">Choose Your Indian Avatar (10 Choices)</label>
                                <div class="grid grid-cols-5 gap-2.5 sm:gap-3 max-h-48 overflow-y-auto p-2 bg-white/10 border border-white/20 rounded-2xl shadow-inner backdrop-blur-3xl">
                                    ${avatarChoices.map(av => `
                                        <div onclick="appState.selectedAvatar='${av.seed}'; updateLiveAvatar();" class="cursor-pointer flex flex-col items-center p-2 rounded-xl transition border modal-av-item-${av.seed} ${appState.selectedAvatar === av.seed ? 'bg-white/30 border-white scale-105 shadow-md shadow-white/40' : 'border-transparent hover:bg-white/15'}">
                                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${av.seed}&backgroundColor=ffffff" alt="${av.name}" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/20 p-0.5">
                                            <span class="text-[8px] sm:text-[9px] font-bold text-white mt-1 text-center">${av.name}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="text-center text-xs text-slate-200 font-semibold">Selected Persona: <span class="text-white underline">${appState.selectedAvatar}</span></div>
                            </div>
                        ` : ''}

                        <div class="space-y-4">
                            ${!isLogin ? `
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-300 mb-2">Full Name</label>
                                    <input type="text" id="signInName" placeholder="Enter your name" class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 sm:px-5 py-3.5 text-xs sm:text-sm text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-300 mb-2">College Email / Username</label>
                                <input type="email" id="signInEmail" placeholder="student@university.ac.in" class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 sm:px-5 py-3.5 text-xs sm:text-sm text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-300 mb-2">Password / Security Pin</label>
                                <input type="password" id="signInPass" placeholder="••••••••" class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 sm:px-5 py-3.5 text-xs sm:text-sm text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">
                            </div>
                            <button onclick="handleAuthSubmit()" class="white-glow-btn w-full py-4 rounded-2xl text-sm">
                                ${isLogin ? 'Login to Dashboard 🔑' : 'Proceed to Email Verification ✉️'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAuthSubmit() {
            const isLogin = appState.authMode === 'login';
            const emailEl = document.getElementById('signInEmail');
            const passEl = document.getElementById('signInPass');
            const nameEl = document.getElementById('signInName');

            if (!emailEl || !passEl || (!isLogin && !nameEl)) {
                showToast('❌ Form validation error.');
                return;
            }

            const emailVal = emailEl.value.trim();
            const passVal = passEl.value.trim();
            const nameVal = !isLogin ? sanitize(nameEl.value.trim()) : (emailVal.split('@')[0] || 'Scholar');

            if (!emailVal || passVal.length < 4 || (!isLogin && !nameVal)) {
                showToast('Please provide valid credentials (password must be at least 4 characters).');
                return;
            }

            if (isLogin) {
                appState.currentUser = { name: nameVal, email: emailVal, avatar: appState.selectedAvatar };
                localStorage.setItem('abtalks_user', JSON.stringify(appState.currentUser)); // Persistent State Patch[cite: 1]
                showToast(`🔑 Login successful! Welcome back, ${nameVal}.`);
                setTimeout(() => router.navigateTo('/dashboard'), 1200);
            } else {
                appState.pendingEmail = emailVal;
                appState.pendingName = nameVal;
                appState.pendingPass = passVal;
                appState.generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
                appState.authMode = 'verify';
                showToast(`✉️ Verification code sent to ${emailVal}!`);
                render();
            }
        }

        function handleVerifyOtp() {
            const otpInput = document.getElementById('otpInput').value.trim();
            if (otpInput === appState.generatedOtp) {
                appState.currentUser = { name: appState.pendingName, email: appState.pendingEmail, avatar: appState.selectedAvatar };
                localStorage.setItem('abtalks_user', JSON.stringify(appState.currentUser)); // Persistent State Patch[cite: 1]
                showToast(`💎 Email verified! Welcome, ${appState.pendingName}.`);
                appState.authMode = 'signin';
                setTimeout(() => router.navigateTo('/dashboard'), 1200);
            } else {
                showToast('❌ Invalid verification code. Please check sandbox notice.');
            }
        }

        function setRating(stars) {
            appState.selectedRating = stars;
            render();
        }

        function selectCalendarDay(day) {
            appState.selectedCalendarDay = day;
            render();
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 6) + 2;
            appState.captchaNum2 = Math.floor(Math.random() * 4) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = sanitize(document.getElementById('ghInput').value); // XSS Sanitization Patch[cite: 1]
            const li = sanitize(document.getElementById('liInput').value); // XSS Sanitization Patch[cite: 1]
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect verification answer. Try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakDays = 1;
            appState.synergyPoints += 50;

            localStorage.setItem('abtalks_gh', gh);
            localStorage.setItem('abtalks_li', li);
            localStorage.setItem('abtalks_submitted', 'true');
            localStorage.setItem('abtalks_streak', appState.streakDays);
            localStorage.setItem('abtalks_sp', appState.synergyPoints);

            showToast('💎 Day 1 Verified! Streak ignited & +50 Synergy Points added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const route = router.currentRoute;
            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/1') html = renderDayChallenge();
            else if (route === '/chat') html = renderChat();
            else if (route === '/news') html = renderNews();
            else if (route === '/analytics') html = renderAnalytics();
            else if (route === '/resources') html = renderResources();
            else if (route === '/signin') html = renderSignIn();
            else if (route === '/about') html = renderAbout();
            else if (route === '/contact') html = renderContact();
            document.getElementById('app-router').innerHTML = html;

            const authBtn = document.getElementById('nav-auth-btn');
            if (authBtn) {
                if (appState.currentUser) {
                    authBtn.innerText = `👤 ${appState.currentUser.name.split(' ')[0]}`;
                } else {
                    authBtn.innerText = 'Sign In / Login ✦';
                }
            }

            ['/', '/dashboard', '/day/1', '/chat', '/news', '/analytics', '/resources', '/signin', '/about', '/contact'].forEach(r => {
                const btnId = 'nav-' + (r === '/' ? 'home' : (r === '/dashboard' ? 'dashboard' : (r === '/day/1' ? 'day' : (r === '/chat' ? 'chat' : (r === '/news' ? 'news' : (r === '/analytics' ? 'analytics' : (r === '/resources' ? 'resources' : (r === '/about' ? 'about' : 'contact'))))))));
                const btn = document.getElementById(btnId);
                if(btn) {
                    if(r === route) {
                        btn.className = 'px-3.5 py-2 text-xs font-extrabold rounded-xl transition bg-white text-slate-950 shadow-lg shadow-white/30';
                    } else {
                        btn.className = 'px-3.5 py-2 text-xs font-bold rounded-xl transition text-slate-300 hover:text-white';
                    }
                }
            });
            updateClock();
        }

        window.addEventListener('DOMContentLoaded', () => { router.init(); });
    </script>
</body>
</html>
