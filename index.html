<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ABTalks — 60-Day Build Streak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#12151C;
  --surface:#1A2029;
  --surface-2:#212836;
  --surface-3:#262E3D;
  --border:#2B3444;
  --border-soft:#232B39;
  --text:#EDEFF3;
  --text-dim:#9AA3B5;
  --text-faint:#6B7386;

  --turmeric:#FF9F43;
  --turmeric-strong:#FFB258;
  --turmeric-dim:#54401F;
  --turmeric-ink:#2A2013;

  --green:#34C77B;
  --green-strong:#4EE096;
  --green-dim:#173829;

  --coral:#FB6B6B;
  --coral-dim:#3E2323;

  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;

  --font-display:'Sora', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;

  --shadow-card: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px -12px rgba(0,0,0,0.6);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  display:flex;
  justify-content:center;
  align-items:center;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
::selection{background:var(--turmeric-dim);color:var(--turmeric-strong);}

a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--turmeric);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ============================= FULL SCREEN LAPTOP LAYOUT SHELL ============================= */
#app{
  width:100%;
  height:100%;
  max-width:100%;
  margin:0;
  background:var(--bg);
  position:relative;
  padding-bottom:84px;
  overflow-y:auto;
  background-image:
    radial-gradient(circle at 12% 0%, rgba(255,159,67,0.10), transparent 40%),
    radial-gradient(circle at 90% 8%, rgba(52,199,123,0.07), transparent 35%);
}

@media (min-width:900px){
  #app{
    max-width:100%;
    height:100%;
    border-radius:0;
    box-shadow:none;
    margin:0;
  }
}

.max-container{
  max-width:1200px;
  margin:0 auto;
  width:100%;
}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 32px;
  border-bottom:1px solid var(--border-soft);
  background:var(--surface);
  position:sticky;
  top:0;
  z-index:100;
}
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.01em; cursor:pointer; }
.brand-mark{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(145deg, var(--turmeric), #E8792B);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:14px; color:#20140A;
}

/* ============================= UTILITY ============================= */
.eyebrow{
  font-family:var(--font-mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--turmeric); font-weight:600; display:flex; align-items:center; gap:8px;
}
.eyebrow::before{content:"";width:16px;height:1px;background:var(--turmeric);display:inline-block;}
.h1{ font-family:var(--font-display); font-weight:700; font-size:clamp(30px, 4vw, 44px); line-height:1.12; letter-spacing:-0.02em; margin:10px 0 0; }
.h2{ font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1.2; letter-spacing:-0.01em; margin:0; }
.h3{ font-family:var(--font-display); font-weight:600; font-size:17px; margin:0; }
.p-muted{ color:var(--text-dim); font-size:15.5px; line-height:1.6; margin:0; }
.mono{ font-family:var(--font-mono); }

.card{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:12px; font-weight:600; font-size:15px;
  padding:14px 22px; transition:transform .12s ease, filter .12s ease, background .12s ease;
  width:100%;
}
.btn:active{ transform:scale(0.98); }
.btn-primary{ background:linear-gradient(145deg, var(--turmeric-strong), var(--turmeric)); color:#241705; }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-secondary{ background:var(--surface-3); color:var(--text); border:1px solid var(--border); }
.btn-ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--border); }
.btn-sm{ padding:10px 16px; font-size:14px; width:auto; }
.btn[disabled]{ opacity:0.45; cursor:not-allowed; }

.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px;
  font-family:var(--font-mono);
}
.pill-green{ background:var(--green-dim); color:var(--green-strong); }
.pill-turmeric{ background:var(--turmeric-dim); color:var(--turmeric-strong); }
.pill-coral{ background:var(--coral-dim); color:var(--coral); }
.pill-neutral{ background:var(--surface-3); color:var(--text-dim); }

/* ============================= TOAST ============================= */
#toast{
  position:fixed; left:50%; bottom:96px; transform:translate(-50%, 20px);
  background:var(--surface-3); border:1px solid var(--border); color:var(--text);
  padding:12px 20px; border-radius:999px; font-size:14px; font-weight:600;
  box-shadow:0 12px 30px -8px rgba(0,0,0,0.6);
  opacity:0; pointer-events:none; transition:all .25s cubic-bezier(.2,.9,.3,1.3);
  z-index:400; display:flex; align-items:center; gap:8px; white-space:nowrap;
}
#toast.show{ opacity:1; transform:translate(-50%, 0); }

/* ============================= LANDING ============================= */
.hero{ padding:40px 32px; }
.hero-grid-layout { display:grid; grid-template-columns: 1fr; gap:36px; }
@media(min-width:900px){ .hero-grid-layout { grid-template-columns: 1.3fr 0.9fr; align-items:center; } }

.hero-graph{
  margin-top:16px; border-radius:var(--radius-lg); overflow:hidden;
  background:var(--surface); border:1px solid var(--border-soft); padding:20px;
}
.hero-graph-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
.mini-grid{ display:grid; grid-template-columns:repeat(20, 1fr); gap:4px; }
.mini-cell{ aspect-ratio:1; border-radius:3px; background:var(--surface-3); }

.trust-strip{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; padding:16px 32px; max-width:1200px; margin:0 auto;
}
@media(max-width:768px){ .trust-strip { grid-template-columns:1fr; } }
.trust-stat{
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:var(--radius); padding:20px;
}
.trust-stat .num{ font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--turmeric-strong); }
.trust-stat .lbl{ font-size:13px; color:var(--text-dim); margin-top:4px; }

.section{ padding:40px 32px 10px; max-width:1200px; margin:0 auto; width:100%; }
.steps{ margin-top:20px; display:grid; grid-template-columns:1fr; gap:20px; }
@media(min-width:768px){ .steps{ grid-template-columns:repeat(3, 1fr); } }
.step{ display:flex; flex-direction:column; gap:10px; padding:24px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); }
.step-num{ font-family:var(--font-mono); font-weight:700; font-size:15px; color:var(--turmeric); }
.step-body h4{ margin:0; font-family:var(--font-display); font-size:18px; font-weight:600; }
.step-body p{ margin:0; font-size:14.5px; color:var(--text-dim); }

.track-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.track-chip{
  background:var(--surface); border:1px solid var(--border); border-radius:999px;
  padding:10px 18px; font-size:13.5px; font-weight:600; color:var(--text-dim);
}

.testimonials-grid { display:grid; grid-template-columns:1fr; gap:20px; margin-top:20px; }
@media(min-width:768px){ .testimonials-grid { grid-template-columns:repeat(2, 1fr); } }
.testi{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:24px; }
.testi-quote{ font-size:15px; line-height:1.6; }
.testi-who{ display:flex; align-items:center; gap:12px; margin-top:16px; }
.avatar{ width:36px;height:36px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:13px; color:#171a20; }
.testi-who .name{ font-size:14px; font-weight:600; }
.testi-who .meta{ font-size:12px; color:var(--text-faint); }

.faq-item{ border-bottom:1px solid var(--border-soft); }
.faq-q{ width:100%; text-align:left; background:none; border:none; color:var(--text); padding:18px 0; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:15.5px; }
.faq-a{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
.faq-a p{ margin:0 0 18px; font-size:14.5px; color:var(--text-dim); line-height:1.6; }
.faq-item.open .faq-a{ max-height:220px; }
.faq-chevron{ transition:transform .2s ease; color:var(--text-faint); font-family:var(--font-mono); }
.faq-item.open .faq-chevron{ transform:rotate(45deg); color:var(--turmeric); }

.sticky-cta{
  position:fixed; left:0; bottom:0; width:100%; padding:14px 32px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, var(--bg) 85%, transparent);
  z-index:200;
}
.sticky-cta-inner{ max-width:1200px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px 24px; box-shadow:0 -10px 30px -10px rgba(0,0,0,0.5); display:flex; justify-content:space-between; align-items:center;}

/* ============================= AUTH PAGES ============================= */
.auth-container{ padding:60px 32px; display:flex; justify-content:center; align-items:center; min-height:80vh; }
.auth-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:36px; box-shadow:var(--shadow-card); width:100%; max-width:480px; }
.auth-title{ font-family:var(--font-display); font-size:28px; font-weight:700; margin-bottom:8px; }
.auth-subtitle{ font-size:14.5px; color:var(--text-dim); margin-bottom:28px; }
.auth-switch{ text-align:center; font-size:13.5px; color:var(--text-dim); margin-top:24px; }
.auth-switch a{ color:var(--turmeric-strong); font-weight:600; text-decoration:underline; }

/* ============================= DASHBOARD & LAYOUTS ============================= */
.dash-header{ padding:24px 32px 12px; max-width:1200px; margin:0 auto; width:100%; display:flex; align-items:center; justify-content:space-between; }
.greeting{ font-family:var(--font-display); font-weight:700; font-size:24px; }
.greeting-sub{ font-size:14px; color:var(--text-faint); margin-top:4px; }
.profile-dot{ width:44px;height:44px;border-radius:50%; background:var(--surface-3); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:16px; }

.dashboard-grid { display:grid; grid-template-columns:1fr; gap:24px; max-width:1200px; margin:0 auto; padding:0 32px; width:100%; }
@media(min-width:900px){ .dashboard-grid { grid-template-columns: 2fr 1fr; } }

.streak-hero{
  border-radius:var(--radius-lg); padding:28px;
  background:linear-gradient(155deg, #22190C, var(--surface) 55%);
  border:1px solid var(--turmeric-dim);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.streak-hero.zero{ background:var(--surface); border-color:var(--border-soft); }
.streak-num-wrap{ display:flex; align-items:baseline; gap:10px; }
.streak-num{ font-family:var(--font-mono); font-weight:700; font-size:56px; color:var(--turmeric-strong); letter-spacing:-0.02em; }
.streak-hero.zero .streak-num{ color:var(--text-dim); }
.streak-unit{ font-size:15px; color:var(--text-dim); font-weight:600; }
.streak-flame{ font-size:38px; }
.streak-caption{ font-size:13.5px; color:var(--text-dim); margin-top:6px; }

.missed-banner{
  max-width:1200px; margin:0 auto 20px auto; padding:0 32px; width:100%;
}
.missed-banner-inner{
  border-radius:var(--radius); padding:16px 20px;
  background:var(--coral-dim); border:1px solid #5A3030;
  display:flex; gap:14px; align-items:flex-start;
}
.missed-banner .txt{ font-size:14px; color:#FFD9D9; line-height:1.5; }
.missed-banner b{ color:#fff; }

.today-card{ padding:24px; }
.today-card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
.today-title{ font-family:var(--font-display); font-weight:700; font-size:22px; margin:8px 0 8px; line-height:1.3; }
.today-meta{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }

.progress-block{ padding:24px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); }
.progress-bar-track{ height:12px; border-radius:999px; background:var(--surface-3); overflow:hidden; margin-top:12px; }
.progress-bar-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--turmeric), var(--green)); transition:width .5s ease; }
.progress-labels{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--text-dim); margin-top:10px; }

.graph-section{ max-width:1200px; margin:0 auto 24px auto; padding:0 32px; width:100%; }
.graph-card { padding:24px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); }
.graph-scroll{ overflow-x:auto; padding-bottom:8px; margin-top:16px; scrollbar-width:thin; }
.graph-grid{ display:grid; grid-template-rows:repeat(6, 1fr); grid-auto-flow:column; gap:6px; width:max-content; }
.g-cell{ width:18px;height:18px;border-radius:4px; background:var(--surface-3); border:1px solid var(--border-soft); position:relative; }
.g-cell.done{ background:var(--green); border-color:var(--green); }
.g-cell.missed{ background:var(--coral-dim); border-color:var(--coral); }
.g-cell.today{ background:var(--turmeric); border-color:var(--turmeric); box-shadow:0 0 0 3px rgba(255,159,67,0.18); animation:pulse 2s infinite; }
.g-cell.future{ opacity:0.5; }
@keyframes pulse{ 0%,100%{box-shadow:0 0 0 3px rgba(255,159,67,0.18);} 50%{box-shadow:0 0 0 6px rgba(255,159,67,0.05);} }
.graph-legend{ display:flex; gap:20px; margin-top:16px; flex-wrap:wrap; }
.graph-legend span{ font-size:13px; color:var(--text-faint); display:flex; align-items:center; gap:6px; }
.legend-dot{ width:11px;height:11px;border-radius:3px; display:inline-block; }

.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.stat-box{ padding:20px; }
.stat-box .num{ font-family:var(--font-mono); font-size:26px; font-weight:700; }
.stat-box .lbl{ font-size:13px; color:var(--text-dim); margin-top:6px; }

.badge-row{ max-width:1200px; margin:0 auto 24px auto; padding:0 32px; width:100%; display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; }
.badge-chip{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--border-soft); border-radius:999px; padding:12px 20px;
  font-size:14px; font-weight:600; color:var(--text-dim);
}

.bottom-nav{
  position:fixed; left:0; bottom:0; width:100%; background:rgba(26,32,41,0.95); backdrop-filter:blur(10px);
  border-top:1px solid var(--border); display:flex; z-index:250;
  padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav-inner{ max-width:1200px; margin:0 auto; width:100%; display:flex; }
.nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 0 12px; font-size:12px; color:var(--text-faint); font-weight:600; }
.nav-item.active{ color:var(--turmeric); }
.nav-ic{ font-size:20px; line-height:1; }

/* ============================= CHALLENGE DAY ============================= */
.day-container{ max-width:900px; margin:0 auto; padding:0 32px; width:100%; }
.day-hero{ padding:24px 32px 0; }
.day-back{ display:inline-flex; align-items:center; gap:8px; color:var(--text-dim); font-size:14px; font-weight:600; padding:8px 0 12px; }
.day-badge-row{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.day-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(26px, 3.5vw, 34px); line-height:1.25; letter-spacing:-0.01em; margin:0 0 14px; }
.day-meta-row{ display:flex; gap:20px; margin:14px 0 6px; }
.day-meta-row .item{ font-size:14px; color:var(--text-dim); display:flex; align-items:center; gap:8px; }

.brief-card{ margin-top:20px; padding:32px; }
.brief-card p{ margin:0 0 18px; font-size:16px; line-height:1.7; color:var(--text); }
.req-list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px; }
.req-list li{ display:flex; gap:12px; font-size:14.5px; color:var(--text-dim); line-height:1.55; }
.req-list li::before{ content:"—"; color:var(--turmeric); flex:0 0 auto; }

.hint-toggle{ margin-top:20px; background:var(--surface-2); border:1px dashed var(--border); border-radius:12px; padding:16px 20px; font-size:14.5px; color:var(--text-dim); display:flex; justify-content:space-between; align-items:center; }
.hint-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
.hint-body p{ font-size:14px; color:var(--turmeric-strong); background:var(--turmeric-ink); border-radius:10px; padding:16px; margin:14px 0 0; }
.hint-toggle.open .hint-body{ max-height:160px; }

.rescue-card{
  margin-top:20px; padding:24px; border-radius:var(--radius); border:1px solid var(--turmeric-dim);
  background:linear-gradient(155deg, #241A0C, var(--surface));
  display:flex; gap:20px; align-items:flex-start;
}
.rescue-ic{ font-size:32px; }
.rescue-card h4{ margin:0 0 8px; font-family:var(--font-display); font-size:18px; }
.rescue-card p{ margin:0 0 14px; font-size:14px; color:var(--text-dim); line-height:1.55; }
.rescue-actions{ display:flex; gap:12px; flex-wrap:wrap; }

.submit-card{ margin-top:20px; padding:32px; }
.field{ margin-bottom:20px; }
.field label{ display:block; font-size:14px; font-weight:600; color:var(--text-dim); margin-bottom:8px; }
.field input{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:12px; padding:14px 18px; font-size:15px; outline:none;
}
.field input.invalid{ border-color:var(--coral); }
.field input.valid{ border-color:var(--green); }
.field-hint{ font-size:12.5px; color:var(--text-faint); margin-top:6px; }
.field-hint.err{ color:var(--coral); }

.submitted-view{ margin-top:20px; padding:36px; text-align:center; }
.submitted-check{ width:64px;height:64px; border-radius:50%; background:var(--green-dim); display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 16px; }
.submitted-links{ display:flex; flex-direction:column; gap:12px; margin-top:20px; text-align:left; }
.submitted-links a{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:14px 18px; font-size:14px; color:var(--text-dim); display:flex; justify-content:space-between; align-items:center; overflow:hidden; }

.lock-view{ margin-top:20px; padding:48px 32px; text-align:center; }
.lock-ic{ font-size:38px; margin-bottom:14px; }

/* ============================= CHATBOT ============================= */
#chat-fab{
  position:fixed; right:32px; bottom:96px; z-index:300;
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(145deg, var(--turmeric-strong), var(--turmeric));
  display:flex;align-items:center;justify-content:center; font-size:26px;
  box-shadow:0 12px 28px -6px rgba(255,159,67,0.5); border:none;
}

#chat-panel{
  position:fixed; right:32px; bottom:110px; transform:translateY(20px);
  width:100%; max-width:420px; height:600px; max-height:80vh;
  background:var(--surface); border:1px solid var(--border); border-radius:24px;
  z-index:500; display:flex; flex-direction:column; opacity:0; pointer-events:none;
  transition:all .25s cubic-bezier(.2,.9,.3,1.1);
  box-shadow:0 20px 60px -10px rgba(0,0,0,0.8);
}
#chat-panel.open{ opacity:1; pointer-events:auto; transform:translateY(0); }
.chat-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--border-soft); }
.chat-head-title{ display:flex; align-items:center; gap:12px; }
.chat-head-title .dot{ width:10px;height:10px;border-radius:50%; background:var(--green); box-shadow:0 0 0 3px var(--green-dim); }
.chat-close{ background:var(--surface-3); border:none; color:var(--text-dim); width:34px;height:34px;border-radius:50%; font-size:16px; }
.chat-body{ flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px; }
.msg{ max-width:85%; padding:14px 16px; border-radius:16px; font-size:14.5px; line-height:1.55; }
.msg.bot{ background:var(--surface-2); align-self:flex-start; border-bottom-left-radius:4px; }
.msg.user{ background:var(--turmeric-dim); color:var(--turmeric-strong); align-self:flex-end; border-bottom-right-radius:4px; font-weight:600; }
.chat-chips{ display:flex; flex-wrap:wrap; gap:8px; padding:6px 24px 18px; }
.chip{ background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:9px 16px; font-size:13px; color:var(--text-dim); }
.chat-input-row{ display:flex; gap:12px; padding:16px 24px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--border-soft); }
.chat-input-row input{ flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:14px 18px; color:var(--text); font-size:14.5px; outline:none; }
.chat-send{ background:var(--turmeric); border:none; border-radius:14px; width:52px; color:#241705; font-weight:700; font-size:16px; }
#chat-overlay{ display:none; }

/* ============================= QA PANEL ============================= */
#qa-fab{
  position:fixed; left:32px; bottom:96px; z-index:300;
  width:48px;height:48px;border-radius:50%; background:var(--surface-3); border:1px solid var(--border);
  color:var(--text-faint); font-size:18px; display:flex;align-items:center;justify-content:center;
}
#qa-panel{
  position:fixed; left:32px; bottom:156px; z-index:301; width:260px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:16px;
  display:none; box-shadow:0 20px 50px -15px rgba(0,0,0,0.7);
}
#qa-panel.open{ display:block; }
#qa-panel h5{ margin:0 0 10px; font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); }
.qa-opt{ display:block; width:100%; text-align:left; background:none; border:none; color:var(--text-dim); font-size:13.5px; padding:9px 12px; border-radius:8px; }
.qa-opt.active{ background:var(--turmeric-dim); color:var(--turmeric-strong); font-weight:600; }
.qa-note{ font-size:11.5px; color:var(--text-faint); margin-top:12px; line-height:1.4; padding-top:10px; border-top:1px solid var(--border-soft); }

.fade-in{ animation:fadeIn .35s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>

<div id="toast"></div>

      <span class="dot"></span>

        <div style="font-weight:700; font-size:15px;">ABTalks Assistant</div>

<div id="qa-panel">

</div>

<script>
/* ======================================================================
   ABTalks — mock data
   ====================================================================== */
const PLATFORM = {
  name: "ABTalks",
  totalDays: 60,
  stats: { studentsStarted: 4218, day30CrossRatePct: 61, commitsPushed: 9600 },
  tracks: ["Web Dev","DSA","Python","App Dev"]
};

const TASK_POOL = [
  {track:"Web Dev", title:"Build a live character counter", difficulty:"Beginner", estMinutes:45,
   brief:"Most sign-up forms silently reject your bio at 160 characters. Build the counter that would've saved someone's evening — a text box with a live character count that warns you before you hit the wall.",
   requirements:["A textarea with a visible counter that updates on every keystroke","Counter turns amber past 80% of the limit, red at the limit","Submit button disables once the limit is crossed","Plain HTML/CSS/JS or your framework of choice — no character-count libraries"],
   hint:"The `input` event fires on every keystroke — you don't need a button to trigger the count."},
  {track:"DSA", title:"Reverse a linked list in-place", difficulty:"Beginner", estMinutes:40,
   brief:"The interview classic. Reverse a singly linked list without allocating a second list — only pointer moves allowed.",
   requirements:["Implement iteratively with three pointers (prev, curr, next)","O(1) extra space — no arrays, no new list","Add one test with an odd-length list, one with even","Comment the tricky pointer-swap line"],
   hint:"Draw it on paper first. The bug is almost always in the order you reassign `next`."},
  {track:"Python", title:"Parse a messy CSV without pandas", difficulty:"Intermediate", estMinutes:60,
   brief:"You'll get CSVs with missing commas, stray quotes, and blank rows long before you get clean ones. Write a parser that survives that.",
   requirements:["Handle quoted fields containing commas","Skip and log blank rows instead of crashing","Return a list of dicts keyed by header","No pandas or csv module — build the state machine yourself"],
   hint:"Track whether you're 'inside quotes' as a boolean while you scan characters."},
  {track:"App Dev", title:"Ship a swipe-to-delete list", difficulty:"Intermediate", estMinutes:75,
   brief:"Build a list where swiping a row left reveals a delete action, and releasing past a threshold removes the item with an animation.",
   requirements:["Swipe gesture reveals a delete button under the row","Releasing past 40% width auto-completes the delete","Releasing before that snaps back","Deleting animates the row out — no hard cuts"],
   hint:"Track the swipe as a translateX on the row, driven by touch delta, then animate to 0 or -100% on release."},
  {track:"Web Dev", title:"Debounce a search input", difficulty:"Intermediate", estMinutes:50,
   brief:"An unthrottled search box fires a network call on every keystroke. Fix that with a debounce that only fires once typing pauses.",
   requirements:["Search only fires 300ms after the user stops typing","Typing again before 300ms cancels the pending call","Show a subtle loading state while the (mocked) call is in flight","Write the debounce function yourself — no lodash"],
   hint:"setTimeout + clearTimeout on every keystroke is the whole trick."},
  {track:"DSA", title:"Detect a cycle in a graph", difficulty:"Advanced", estMinutes:70,
   brief:"Given a directed graph as an adjacency list, detect whether it contains a cycle — the same check that stops a build system from deadlocking on circular imports.",
   requirements:["DFS with a 'currently visiting' set, not just a 'visited' set","Return the actual cycle path, not just true/false","Handle disconnected components","Explain in a comment why 'visited' alone isn't enough"],
   hint:"A node in your current DFS stack that you reach again is the cycle — that's different from a node you've merely finished visiting."},
  {track:"Python", title:"Write a tiny rate limiter", difficulty:"Intermediate", estMinutes:55,
   brief:"APIs get abused without one. Build a token-bucket rate limiter you could drop into any function to cap how often it runs.",
   requirements:["Configurable max calls per time window","Calls over the limit are rejected, not queued","Works as a decorator on any function","Include a quick script proving it blocks the 4th call in a 3-per-second limit"],
   hint:"Store timestamps of recent calls and prune anything older than the window on each check."},
  {track:"Web Dev", title:"Build a dark-mode toggle that persists", difficulty:"Beginner", estMinutes:35,
   brief:"A theme toggle that forgets your choice on refresh is worse than no toggle at all. Build one that remembers.",
   requirements:["Toggle switches a CSS class or data-attribute on the root element","Choice persists across a page reload","Respects the OS preference on first visit","No flash of the wrong theme on load"],
   hint:"Read the saved preference before the rest of the page paints, not after."},
  {track:"App Dev", title:"Build an offline-first note field", difficulty:"Advanced", estMinutes:80,
   brief:"Hostel wifi drops mid-typing more often than it doesn't. Build a note input that keeps working — and keeps your text — through a disconnect.",
   requirements:["Detect online/offline state changes","Queue unsaved changes locally while offline","Sync automatically the moment connectivity returns","Show the user a clear 'saved / pending / offline' status"],
   hint:"Treat 'saved' as a state machine, not a boolean — you need at least saved, pending, offline."},
  {track:"DSA", title:"Implement an LRU cache", difficulty:"Advanced", estMinutes:65,
   brief:"Build a Least-Recently-Used cache with O(1) get and put — the data structure behind most in-memory caching layers.",
   requirements:["O(1) get and put — no scanning to find the oldest entry","Fixed capacity — inserting past capacity evicts the LRU item","Use a hashmap + doubly linked list, not a sorted structure","Add a test that proves eviction order is correct"],
   hint:"The hashmap gives you O(1) lookup; the doubly linked list gives you O(1) reordering. You need both."}
];

function difficultyForDay(id){ return id<=15?"Beginner": id<=40?"Intermediate":"Advanced"; }

function buildDay(id){
  const base = TASK_POOL[(id-1) % TASK_POOL.length];
  return { id, track: base.track, title: base.title, difficulty: difficultyForDay(id),
    estMinutes: base.estMinutes, brief: base.brief, requirements: base.requirements, hint: base.hint };
}
const DAYS = Array.from({length: PLATFORM.totalDays}, (_,i)=>buildDay(i+1));

function mkSubmission(dayId, hoursAgo){
  return { githubUrl:`https://github.com/aanya-dev/abtalks-60/commit/${(dayId*7919).toString(16).slice(0,7)}`,
            linkedinUrl:`https://www.linkedin.com/posts/aanya-dev_abtalks-day${dayId}-activity`,
            submittedAt: Date.now() - hoursAgo*3600*1000 };
}

const USERS = {
  newUser: {
    key:"newUser", name:"Rahul", college:"", track:null, currentDay:1, streak:0,
    completedDays:{}, badges:[], freezeTokens:1, rank:null
  },
  activeUser: {
    key:"activeUser", name:"Aanya", college:"3rd yr · CSE", track:"Web Dev", currentDay:15, streak:14,
    completedDays: Object.fromEntries(Array.from({length:14},(_,i)=>[i+1, mkSubmission(i+1, (14-i)*26)])),
    badges:["Consistency Streak","Early Bird"], freezeTokens:1, rank:"Top 12% this week"
  },
  missedUser: {
    key:"missedUser", name:"Karan", college:"2nd yr · IT", track:"DSA", currentDay:14, streak:0,
    completedDays: Object.fromEntries(Array.from({length:12},(_,i)=>[i+1, mkSubmission(i+1, (12-i)*30)])),
    missedDay:13, badges:["Early Bird"], freezeTokens:0, rank:null
  }
};

/* ======================================================================
   STATE
   ====================================================================== */
const STATE = { userKey:"activeUser", simulateNight:false };
function currentUser(){ return USERS[STATE.userKey]; }

/* ======================================================================
   UTILS
   ====================================================================== */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function timeAgo(ts){ const h=Math.round((Date.now()-ts)/3600000); if(h<1) return "just now"; if(h<24) return `${h}h ago`; return `${Math.round(h/24)}d ago`; }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 2200);
}
function initials(name){ return (name||"?").trim().charAt(0).toUpperCase(); }
function isLateNight(){ if(STATE.simulateNight) return true; const h=new Date().getHours(); return h>=21 || h<5; }

function dayStatus(user, dayId){
  if(user.completedDays[dayId]) return "completed";
  if(user.missedDay===dayId) return "missed";
  if(dayId===user.currentDay) return "today";
  if(dayId<user.currentDay) return "past-empty";
  return "locked";
}

/* ======================================================================
   COMMIT GRAPH
   ====================================================================== */
function renderMiniGrid(){
  let cells="";
  for(let i=0;i<60;i++){
    const on = Math.random() > 0.72;
    cells += `<div class="mini-cell" style="background:${on? (Math.random()>0.5?'var(--turmeric)':'var(--green)') : 'var(--surface-3)'}"></div>`;
  }
  return `<div class="mini-grid">${cells}</div>`;
}

function renderCommitGraph(user){
  let cells = "";
  for(let d=1; d<=PLATFORM.totalDays; d++){
    const status = dayStatus(user, d);
    const cls = status==="completed" ? "done" : status==="missed" ? "missed" : status==="today" ? "today" : status==="locked" ? "future" : "future";
    cells += `<a href="#/day/${d}" class="g-cell ${cls}" title="Day ${d}${status==='completed'?' · done':status==='missed'?' · missed':status==='today'?' · today':''}"></a>`;
  }
  return `
    <div class="graph-scroll"><div class="graph-grid">${cells}</div></div>
    <div class="graph-legend">
      <span><i class="legend-dot" style="background:var(--green)"></i>Shipped</span>
      <span><i class="legend-dot" style="background:var(--turmeric)"></i>Today</span>
      <span><i class="legend-dot" style="background:var(--coral)"></i>Missed</span>
      <span><i class="legend-dot" style="background:var(--surface-3)"></i>Upcoming</span>
    </div>`;
}

   ====================================================================== */
function viewDashboard(){
  const u = currentUser();
  const totalDone = Object.keys(u.completedDays).length;
  const pct = Math.round((totalDone/PLATFORM.totalDays)*100);
  const night = isLateNight();
  const today = DAYS[u.currentDay-1];
  const isNewUser = u.currentDay===1 && totalDone===0;

    <div class="missed-banner-inner">
      <span style="font-size:20px;">⚠️</span>
      <div class="txt"><b>You missed Day ${u.missedDay}.</b> Your streak reset to 0 — it happens. ${u.freezeTokens>0 ? `You still have <b>${u.freezeTokens} streak-freeze token</b> left.` : `You're out of freeze tokens this month.`}</div>
    </div>
  </div>` : ``}

  <div class="dashboard-grid fade-in">
    <div>
      <div class="streak-hero ${u.streak===0?'zero':''}" style="margin-bottom:24px;">
        <div>
          <div class="streak-num-wrap"><span class="streak-num">${u.streak}</span><span class="streak-unit">day${u.streak===1?'':'s'} streak</span></div>
          <div class="streak-caption">${u.streak===0? "No active streak yet — Day 1 starts it." : `Longest this challenge: ${Math.max(u.streak, totalDone)} days`}</div>
        </div>
        <div class="streak-flame">${u.streak>0?'🔥':'🕯️'}</div>
      </div>

      <a href="#/day/${u.currentDay}" class="card today-card" style="display:block; margin-bottom:24px;">
        <div class="top-row">
          <span class="pill pill-turmeric">Day ${u.currentDay} of ${PLATFORM.totalDays}</span>
          <span class="pill pill-neutral">${today.difficulty}</span>
        </div>
        <div style="font-size:12px; color:var(--text-faint); font-family:var(--font-mono);">${today.track}</div>
        <div class="today-title">${today.title}</div>
        <div class="today-meta"><span class="pill pill-neutral">⏱ ~${today.estMinutes} min</span></div>
        <div class="btn btn-primary">${isNewUser? "Start Day 1 →" : "Open today's challenge →"}</div>
      </a>
    </div>

    <div style="display:flex; flex-direction:column; gap:24px;">
      <div class="stat-grid" style="margin:0;">
        <div class="card stat-box"><div class="num">${u.rank || '—'}</div><div class="lbl">Standing</div></div>
        <div class="card stat-box"><div class="num">${u.freezeTokens} 🧊</div><div class="lbl">Freezes left</div></div>
      </div>

      <div class="progress-block">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
          <span class="h3">Progress</span>
          <span class="mono" style="font-size:14px; color:var(--turmeric-strong);">${pct}%</span>
        </div>
        <div class="progress-bar-track" style="margin:0;"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="progress-labels"><span>${totalDone} shipped</span><span>${PLATFORM.totalDays-totalDone} remaining</span></div>
      </div>
    </div>
  </div>

  <div class="graph-section fade-in">
    <div class="graph-card">
      <span class="eyebrow">Your commit graph</span>
      ${renderCommitGraph(u)}
    </div>
  </div>

  ${u.badges.length ? `
  <div class="badge-row fade-in">
    ${u.badges.map(b=>`<div class="badge-chip">🏅 ${b}</div>`).join('')}
  </div>` : ``}

  <div style="height:40px;"></div>
  ${renderBottomNav('dash')}
  `;
}

/* ======================================================================
   VIEW: CHALLENGE DAY  (/day/:id)
   ====================================================================== */
function viewDay(id){
  const u = currentUser();
  const dayId = Math.min(Math.max(parseInt(id)||1,1), PLATFORM.totalDays);
  const day = DAYS[dayId-1];
  const status = dayStatus(u, dayId);
  const night = isLateNight();
  const showRescue = status==="today" && night;

  let body = "";

  if(status==="locked"){
    body = `
    <div class="card lock-view fade-in">
      <div class="lock-ic">🔒</div>
      <div class="h3">Day ${dayId} is locked</div>
      <p class="p-muted" style="margin-top:10px;">This unlocks once you complete Day ${u.currentDay}. One day at a time — that's the whole method.</p>
      <a href="#/day/${u.currentDay}" class="btn btn-primary" style="margin-top:20px; max-width:240px; margin-inline:auto;">Go to Day ${u.currentDay} →</a>
    </div>`;
  } else {
    body = `
    <div class="brief-card card fade-in">
      <p>${day.brief}</p>
      <ul class="req-list">${day.requirements.map(r=>`<li>${r}</li>`).join('')}</ul>
      <div class="hint-toggle" id="hint-toggle">
        <span>💡 Stuck? Peek at a hint</span><span id="hint-chevron">+</span>
        <div class="hint-body" id="hint-body"><p>${day.hint}</p></div>
      </div>
    </div>`;

    if(status==="missed"){
      body += `
      <div class="missed-banner fade-in" style="margin-top:20px; padding:0;">
        <div class="missed-banner-inner">
          <span style="font-size:20px;">⚠️</span>
          <div class="txt"><b>This day was missed.</b> It's kept here for record, but no longer counts toward today's streak.</div>
        </div>
      </div>`;
    }

    if(showRescue){
      body += `
      <div class="rescue-card fade-in" style="margin-top:20px;">
        <div class="rescue-ic">🦉</div>
        <div style="flex:1;">
          <h4>Night Owl Rescue</h4>
          <p>It's late and today's task is still open. Swap to a 15-minute micro-version to keep the chain alive.</p>
          <div class="rescue-actions">
            <button class="btn btn-secondary btn-sm" id="rescue-micro">Try micro-task</button>
            <button class="btn btn-ghost btn-sm" id="rescue-freeze" ${u.freezeTokens<1?'disabled':''}>Use freeze (${u.freezeTokens})</button>
          </div>
        </div>
      </div>`;
    }

    if(status==="completed"){
      const sub = u.completedDays[dayId];
      body += `
      <div class="submitted-view card fade-in" style="margin-top:20px;">
        <div class="submitted-check">✅</div>
        <div class="h3">Day ${dayId} logged</div>
        <p class="p-muted" style="margin-top:8px;">Submitted ${timeAgo(sub.submittedAt)}. Nice work.</p>
        <div class="submitted-links">
          <a href="${sub.githubUrl}" target="_blank" rel="noopener"><span>⌥ ${sub.githubUrl.replace('https://','')}</span><span>↗</span></a>
          <a href="${sub.linkedinUrl}" target="_blank" rel="noopener"><span>in ${sub.linkedinUrl.replace('https://www.','')}</span><span>↗</span></a>
        </div>
        <button class="btn btn-ghost btn-sm" style="margin-top:16px; width:100%;" id="edit-submission">Edit submission</button>
      </div>`;
    } else if(status==="today" || status==="missed" || status==="past-empty"){
      body += renderSubmitForm(dayId, status);
    }
  }

  return `
  <div class="topbar">
    <div class="max-container" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
      <div class="brand" onclick="location.hash='#/'"><span class="brand-mark">AB</span>${PLATFORM.name}</div>
    </div>
  </div>
  <div class="day-container">
    <div class="day-hero fade-in">
      <a href="#/dashboard" class="day-back">← Dashboard</a>
      <div class="day-badge-row">
        <span class="pill pill-turmeric">Day ${dayId} / ${PLATFORM.totalDays}</span>
        <span class="pill pill-neutral">${day.track}</span>
        <span class="pill ${status==='completed'?'pill-green':status==='missed'?'pill-coral':'pill-neutral'}">${day.difficulty}</span>
      </div>
      <h1 class="day-title">${day.title}</h1>
      <div class="day-meta-row">
        <span class="item">⏱ ~${day.estMinutes} min</span>
        <span class="item">${status==='completed'?'✅ Completed':status==='missed'?'⚠️ Missed':status==='locked'?'🔒 Locked':'🟠 In progress'}</span>
      </div>
    </div>
    ${body}
  </div>
  <div style="height:40px;"></div>
  ${renderBottomNav('day')}
  `;
}

function renderSubmitForm(dayId, status){
  return `
  <div class="submit-card card fade-in" style="margin-top:20px;" id="submit-card">
    <span class="h3">Submit proof of work</span>
    <p class="p-muted" style="margin:8px 0 20px;">Two links, that's it. We check the URL shape — not the code.</p>

    <div class="field">
      <label for="gh-input">GitHub commit or repo URL</label>
      <input id="gh-input" type="url" placeholder="https://github.com/you/repo/commit/…" autocomplete="off" />
      <div class="field-hint" id="gh-hint">Must be a github.com link.</div>
    </div>
    <div class="field">
      <label for="li-input">LinkedIn post URL</label>
      <input id="li-input" type="url" placeholder="https://www.linkedin.com/posts/…" autocomplete="off" />
      <div class="field-hint" id="li-hint">Must be a linkedin.com link.</div>
    </div>

    <button class="btn btn-primary" id="submit-btn" disabled>Log Day ${dayId} & extend streak</button>
  </div>`;
}

/* ======================================================================
   ROUTER
   ====================================================================== */
function parseRoute(){
  const hash = location.hash.replace(/^#/, '') || '/';
  if(hash==='/' ) return {name:'landing'};
  if(hash==='/login') return {name:'login'};
  if(hash==='/signup') return {name:'signup'};
  if(hash==='/dashboard') return {name:'dashboard'};
  const m = hash.match(/^\/day\/(\d+)$/);
  if(m) return {name:'day', id:m[1]};
  return {name:'landing'};
}

function render(){
  const route = parseRoute();
  const app = document.getElementById('app');
  if(route.name==='landing') app.innerHTML = viewLanding();
  else if(route.name==='login') app.innerHTML = viewLogin();
  else if(route.name==='signup') app.innerHTML = viewSignup();
  else if(route.name==='dashboard') app.innerHTML = viewDashboard();
  else if(route.name==='day') app.innerHTML = viewDay(route.id);
  app.scrollTop = 0;
  bindPageEvents(route);
  syncQaPanel();
}

/* ======================================================================
   PAGE-LEVEL EVENT BINDING
   ====================================================================== */
function bindPageEvents(route){
  document.querySelectorAll('[data-faq]').forEach(btn=>{
    btn.addEventListener('click', ()=> btn.parentElement.classList.toggle('open'));
  });

  if(route.name==='day'){
    const dayId = Math.min(Math.max(parseInt(route.id)||1,1), PLATFORM.totalDays);
    const u = currentUser();

    const hintToggle = document.getElementById('hint-toggle');
    if(hintToggle) hintToggle.addEventListener('click', ()=> hintToggle.classList.toggle('open'));

    const gh = document.getElementById('gh-input');
    const li = document.getElementById('li-input');
    const submitBtn = document.getElementById('submit-btn');
    function validate(){
      if(!gh || !li) return;
      const ghOk = /^https:\/\/(www\.)?github\.com\/.+/i.test(gh.value.trim());
      const liOk = /^https:\/\/(www\.)?linkedin\.com\/.+/i.test(li.value.trim());
      gh.classList.toggle('invalid', gh.value.length>0 && !ghOk);
      gh.classList.toggle('valid', ghOk);
      li.classList.toggle('invalid', li.value.length>0 && !liOk);
      li.classList.toggle('valid', liOk);
      document.getElementById('gh-hint').textContent = gh.value.length>0 && !ghOk ? "That doesn't look like a github.com link yet." : "Must be a github.com link.";
      document.getElementById('gh-hint').classList.toggle('err', gh.value.length>0 && !ghOk);
      document.getElementById('li-hint').textContent = li.value.length>0 && !liOk ? "That doesn't look like a linkedin.com link yet." : "Must be a linkedin.com link.";
      document.getElementById('li-hint').classList.toggle('err', li.value.length>0 && !liOk);
      if(submitBtn) submitBtn.disabled = !(ghOk && liOk);
    }
    if(gh) gh.addEventListener('input', validate);
    if(li) li.addEventListener('input', validate);
    if(submitBtn) submitBtn.addEventListener('click', ()=>{
      u.completedDays[dayId] = { githubUrl: gh.value.trim(), linkedinUrl: li.value.trim(), submittedAt: Date.now() };
      if(u.missedDay===dayId) delete u.missedDay;
      if(dayId===u.currentDay){
        u.streak += 1;
        u.currentDay = Math.min(dayId+1, PLATFORM.totalDays);
      }
      toast(`Day ${dayId} logged · streak now ${u.streak} 🔥`);
      render();
      setTimeout(()=> location.hash = '#/dashboard', 900);
    });

    const editBtn = document.getElementById('edit-submission');
    if(editBtn) editBtn.addEventListener('click', ()=>{
      delete u.completedDays[dayId];
      render();
    });

    const rescueMicro = document.getElementById('rescue-micro');
    if(rescueMicro) rescueMicro.addEventListener('click', ()=>{
      toast("Micro-task unlocked — a 15-min version replaces today's brief.");
      const day = DAYS[dayId-1];
      day.brief = "Rescue mode: skip the full build. Just get one working piece on screen and commit it. You can finish properly tomorrow; tonight is about not breaking the chain.";
      day.requirements = ["Any visible, working fragment","Commit it","Come back tomorrow to finish"];
      day.estMinutes = 15;
      render();
    });
    const rescueFreeze = document.getElementById('rescue-freeze');
    if(rescueFreeze) rescueFreeze.addEventListener('click', ()=>{
      if(u.freezeTokens<1) return;
      u.freezeTokens -= 1;
      toast("Freeze token used — Day " + dayId + " protected.");
      render();
    });
  }
}

/* ======================================================================
   AI CHATBOT
   ====================================================================== */
const CHAT_KNOWLEDGE = [
  { k:["miss","missed","skip"], a:"If you miss a day, your streak resets to 0 — but every day you already shipped stays on your profile forever. Use a freeze token!" },
  { k:["github","commit","repo"], a:"Paste a link to your exact GitHub commit or repo for the day's task to log your progress." },
  { k:["linkedin","post"], a:"Sharing your build on LinkedIn is a great way to stay accountable and showcase your consistency." },
  { k:["track","switch","change"], a:"You can switch tracks anytime up to Day 10. Your progress and streak will carry over safely." },
  { k:["free","cost","price","pay"], a:"ABTalks is 100% free across all 60 days and tracks. No payment info required." },
  { k:["freeze","token"], a:"Streak-freeze tokens protect your streak when life gets busy. You get one per month automatically." },
  { k:["hello","hi","hey"], a:"Hey there! Ready to crush today's coding challenge and grow your streak?" },
  { k:["help","stuck","hint"], a:"If you're stuck, check the hint toggle inside today's challenge card, or ask me for clarification!" }
];

function chatReply(text){
  const q = text.toLowerCase();
  const hit = CHAT_KNOWLEDGE.find(f=> f.k.some(k=>q.includes(k)));
  if(hit) return hit.a;

  if(q.includes('day')) {
    const u = currentUser();
    return `You are currently on Day ${u.currentDay} with an active streak of ${u.streak} days! Keep the momentum going.`;
  }
  if(q.includes('code') || q.includes('debug') || q.includes('error')) {
    return "Debugging is part of the grind! Make sure your logic handles edge cases properly, or check the task hint.";
  }
  return `That's a great question about "${text}". Check out today's brief or ask me about streaks, submissions, tracks, or hints!`;
}

function addMsg(text, who){
  const body = document.getElementById('chat-body');
  const m = el(`<div class="msg ${who}"></div>`); m.textContent = text;
  body.appendChild(m); body.scrollTop = body.scrollHeight;
}

function initChat(){
  addMsg(`Hey! I'm your interactive ABTalks AI assistant 🤖 Ask me anything about your challenge, tasks, or troubleshooting!`, 'bot');
  const chips = document.getElementById('chat-chips');
  chips.innerHTML = '';
  ["What if I miss a day?","How do I submit code?","I'm stuck on a task","Can I change tracks?"].forEach(c=>{
    const b = el(`<button class="chip"></button>`); b.textContent = c;
    b.addEventListener('click', ()=> sendChat(c));
    chips.appendChild(b);
  });
}

function sendChat(text){
  if(!text || !text.trim()) return;
  addMsg(text, 'user');
  const input = document.getElementById('chat-input'); if(input) input.value='';
  setTimeout(()=> {
    addMsg(chatReply(text), 'bot');
  }, 450);
}
</script>

<script>
/* ======================================================================
   GLOBAL WIRE-UP
   ====================================================================== */
const chatFab = document.getElementById('chat-fab');
const chatPanel = document.getElementById('chat-panel');
let chatBooted = false;

function toggleChat(){
  chatPanel.classList.toggle('open');
  if(chatPanel.classList.contains('open') && !chatBooted){
    initChat();
    chatBooted = true;
  }
}
function closeChat(){ chatPanel.classList.remove('open'); }

chatFab.addEventListener('click', toggleChat);
document.getElementById('chat-close-btn').addEventListener('click', closeChat);
document.getElementById('chat-send-btn').addEventListener('click', ()=> sendChat(document.getElementById('chat-input').value));
document.getElementById('chat-input').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(e.target.value); });

const qaFab = document.getElementById('qa-fab');
const qaPanel = document.getElementById('qa-panel');
qaFab.addEventListener('click', ()=> qaPanel.classList.toggle('open'));
document.querySelectorAll('.qa-opt').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    STATE.userKey = btn.dataset.user;
    qaPanel.classList.remove('open');
    location.hash = '#/dashboard';
    render();
  });
});
function syncQaPanel(){
  document.querySelectorAll('.qa-opt').forEach(b=> b.classList.toggle('active', b.dataset.user===STATE.userKey));
}

window.addEventListener('hashchange', render);
render();
</script>
