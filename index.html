<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MorphismOS — Object-Oriented Category Kernel & Crystal UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                }
            }
        }
    </script>
    <style>
        /* Transparent Crystal Glassmorphism Core */
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }
        .crystal-btn {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 50%, #cbd5e1 100%);
            color: #020617;
            font-weight: 800;
            box-shadow: 0 12px 35px rgba(255, 255, 255, 0.35);
            transition: all 0.3s ease;
        }
        .crystal-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 18px 45px rgba(255, 255, 255, 0.6);
        }
        .crystal-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes morphBlob {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translate(0px, 0px) scale(1); }
            50% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; transform: translate(35px, -35px) scale(1.1); }
        }
        .animate-morph-blob {
            animation: morphBlob 16s ease-in-out infinite;
        }

        @keyframes fadeInSlide {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-fade-in {
            animation: fadeInSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 768px) {
            .mobile-padding { padding-left: 1rem !important; padding-right: 1rem !important; }
        }
    </style>
</head>
<body class="bg-[#020617] text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-white selection:text-slate-950 overflow-x-hidden">

    <!-- Transparent Crystal Morphing Backdrop Ambient Orbs -->
    <div class="fixed top-[-15%] left-[-10%] w-[800px] h-[800px] bg-white/10 rounded-full blur-[200px] pointer-events-none animate-morph-blob"></div>
    <div class="fixed bottom-[-15%] right-[-10%] w-[800px] h-[800px] bg-indigo-500/10 rounded-full blur-[200px] pointer-events-none animate-morph-blob" style="animation-delay: -8s;"></div>

    <!-- NAVBAR -->
    <header class="border-b border-white/10 bg-white/[0.02] backdrop-blur-3xl sticky top-0 z-50 px-6 lg:px-20 py-4 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="AppEngine.router.navigate('home')">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-white to-slate-300 flex items-center justify-center font-bold text-slate-950 shadow-lg group-hover:scale-105 transition">
                💎
            </div>
            <div>
                <span class="font-bold tracking-wider text-xs sm:text-sm text-white uppercase">MorphismOS</span>
                <span class="block text-[9px] sm:text-[10px] text-slate-400 font-mono">Class & Functor Kernel</span>
            </div>
        </div>

        <nav class="hidden md:flex gap-6 text-xs font-mono text-slate-400">
            <button onclick="AppEngine.router.navigate('home')" id="nav-home" class="hover:text-white transition">01 // Overview</button>
            <button onclick="AppEngine.router.navigate('classes')" id="nav-classes" class="hover:text-white transition">02 // OOP Classes</button>
            <button onclick="AppEngine.router.navigate('morphism')" id="nav-morphism" class="hover:text-white transition">03 // Morphism Lab</button>
        </nav>

        <div class="flex items-center gap-4">
            <div class="hidden xl:flex items-center gap-2 bg-white/5 border border-white/10 px-4 py-2 rounded-xl font-mono text-xs text-white backdrop-blur-3xl">
                <span>⚡</span> <span id="clockText">00:00:00</span>
            </div>
            <button onclick="AppEngine.router.navigate('auth')" id="navAuthBtn" class="crystal-btn px-5 py-2.5 rounded-xl text-xs">
                Initialize Session ✦
            </button>
        </div>
    </header>

    <!-- DYNAMIC ROUTER CONTAINER -->
    <main id="appRouter" class="flex-grow max-w-7xl mx-auto w-full mobile-padding py-12 z-10"></main>

    <!-- TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <div class="glass-panel px-5 py-3.5 rounded-2xl border border-white/30 text-xs font-bold text-white shadow-2xl flex items-center gap-3 backdrop-blur-3xl">
            <span class="text-white">✦</span> <span id="toastText">System notification</span>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="border-t border-white/10 bg-white/[0.02] py-8 px-6 lg:px-20 text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4 backdrop-blur-3xl">
        <div>© 2026 MorphismOS. Pure OOP Class Architectures & Structure-Preserving Morphism Maps.</div>
        <div class="flex gap-4 font-mono text-slate-400">
            <span>[Category: Object → UI]</span>
            <span>[Status: Transparent Crystal]</span>
        </div>
    </footer>

    <!-- SOFTWARE ENGINEERING OOP & CATEGORY THEORY CORE -->
    <script>
        // --- OOP CLASSES DEFINITION ---
        class CategoryObject {
            constructor(name, metadata = {}) {
                this.id = Math.random().toString(36).substring(2, 9);
                this.name = name;
                this.metadata = metadata;
                this.createdAt = new Date().toISOString();
            }
            inspect() {
                return `Category Object [${this.name}] UUID: ${this.id}`;
            }
        }

        class UserEntity extends CategoryObject {
            constructor(name, email, role = 'Category Theorist') {
                super(name, { email, role });
                this.sessionActive = true;
                this.operationsCount = 0;
            }
            incrementOperations() {
                this.operationsCount++;
            }
        }

        class MorphismTransformation {
            constructor(sourceDomain, targetCodomain, transformFunction) {
                this.source = sourceDomain;
                this.target = targetCodomain;
                this.transform = transformFunction;
            }
            execute(payload) {
                return this.transform(payload);
            }
        }

        // --- APPLICATION ENGINE & ROUTER ---
        const AppEngine = {
            state: {
                user: JSON.parse(localStorage.getItem('morphismos_user')) || null,
                authMode: 'signin', // 'signin' or 'signup'
                activeRoute: 'home'
            },

            showToast(msg) {
                const container = document.getElementById('toastContainer');
                document.getElementById('toastText').innerText = msg;
                container.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
                container.classList.add('translate-y-0', 'opacity-100');
                setTimeout(() => {
                    container.classList.remove('translate-y-0', 'opacity-100');
                    container.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
                }, 3500);
            },

            router: {
                navigate(route) {
                    AppEngine.state.activeRoute = route;
                    window.location.hash = route;
                    AppEngine.render();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },
                init() {
                    const hash = window.location.hash.replace('#', '') || 'home';
                    this.navigate(hash);
                }
            },

            render() {
                const container = document.getElementById('appRouter');
                const route = this.state.activeRoute;
                let html = '';

                if (route === 'home') html = this.views.renderHome();
                else if (route === 'auth') html = this.views.renderAuth();
                else if (route === 'classes') html = this.views.renderClasses();
                else if (route === 'morphism') html = this.views.renderMorphismLab();
                else if (route === 'dashboard') html = this.views.renderDashboard();

                container.innerHTML = html;
                this.updateNavbar();
            },

            updateNavbar() {
                const btn = document.getElementById('navAuthBtn');
                if (this.state.user) {
                    btn.innerText = `👤 ${this.state.user.name}`;
                    btn.onclick = () => this.router.navigate('dashboard');
                } else {
                    btn.innerText = 'Initialize Session ✦';
                    btn.onclick = () => this.router.navigate('auth');
                }

                ['home', 'classes', 'morphism'].forEach(tab => {
                    const el = document.getElementById(`nav-${tab}`);
                    if (el) {
                        if (tab === this.state.activeRoute) el.classList.add('text-white', 'underline');
                        else el.classList.remove('text-white', 'underline');
                    }
                });
            },

            views: {
                renderHome() {
                    return `
                        <div class="space-y-16 animate-fade-in">
                            <div class="glass-panel p-10 lg:p-20 rounded-[3.5rem] text-center space-y-8 relative overflow-hidden shadow-2xl">
                                <div class="absolute -top-32 -left-32 w-80 h-80 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>
                                <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

                                <span class="bg-white/10 text-white border border-white/20 px-5 py-2 rounded-full text-xs font-mono uppercase tracking-widest backdrop-blur-3xl">
                                    Transparent Crystal UI Architecture
                                </span>
                                <h1 class="text-4xl lg:text-7xl font-extrabold tracking-tight text-white max-w-4xl mx-auto leading-tight">
                                    Where <span class="crystal-gradient">OOP Classes</span> Encapsulate State & <span class="crystal-gradient">Morphisms</span> Transform Form.
                                </h1>
                                <p class="text-slate-300 text-base lg:text-lg max-w-2xl mx-auto font-normal">
                                    A pure software engineering environment combining rigorous object-oriented taxonomy with ultra-transparent glassmorphic design.
                                </p>
                                <div class="flex flex-wrap justify-center gap-4 pt-4">
                                    <button onclick="AppEngine.router.navigate('classes')" class="crystal-btn px-8 py-4 rounded-2xl text-sm">
                                        Explore OOP Classes →
                                    </button>
                                    <button onclick="AppEngine.router.navigate('morphism')" class="glass-panel px-8 py-4 rounded-2xl text-sm hover:bg-white/20 text-white backdrop-blur-3xl">
                                        Open Morphism Lab 🧪
                                    </button>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="glass-panel p-8 rounded-[2.5rem] space-y-4 backdrop-blur-3xl">
                                    <div class="w-12 h-12 rounded-2xl bg-white/10 text-white border border-white/20 flex items-center justify-center text-xl font-bold shadow-sm">🏛️</div>
                                    <h3 class="text-lg font-bold text-white">Class Hierarchy</h3>
                                    <p class="text-slate-300 text-xs leading-relaxed">
                                        Explicit JavaScript object inheritance models governing system entities and authentication lifecycles.
                                    </p>
                                </div>
                                <div class="glass-panel p-8 rounded-[2.5rem] space-y-4 backdrop-blur-3xl">
                                    <div class="w-12 h-12 rounded-2xl bg-white/10 text-white border border-white/20 flex items-center justify-center text-xl font-bold shadow-sm">🔄</div>
                                    <h3 class="text-lg font-bold text-white">Functor Morphisms</h3>
                                    <p class="text-slate-300 text-xs leading-relaxed">
                                        Structure-preserving mapping operations converting internal state models into reactive view payloads cleanly.
                                    </p>
                                </div>
                                <div class="glass-panel p-8 rounded-[2.5rem] space-y-4 backdrop-blur-3xl">
                                    <div class="w-12 h-12 rounded-2xl bg-white/10 text-white border border-white/20 flex items-center justify-center text-xl font-bold shadow-sm">💎</div>
                                    <h3 class="text-lg font-bold text-white">Crystal Transparency</h3>
                                    <p class="text-slate-300 text-xs leading-relaxed">
                                        High-end graphic designer aesthetics using multi-layered backdrop blur filters and dynamic chromatic glows.
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                },

                renderAuth() {
                    const isLogin = AppEngine.state.authMode === 'login';
                    return `
                        <div class="max-w-md mx-auto py-8 animate-fade-in">
                            <div class="glass-panel p-10 rounded-[3rem] space-y-8 relative overflow-hidden shadow-2xl backdrop-blur-3xl">
                                <div class="text-center space-y-2">
                                    <span class="text-xs font-mono text-slate-300 uppercase tracking-widest bg-white/10 border border-white/20 px-3.5 py-1.5 rounded-full backdrop-blur-3xl">
                                        Authentication Functor
                                    </span>
                                    <h2 class="text-2xl font-bold text-white pt-3">${isLogin ? 'Access Portal' : 'Register Entity'}</h2>
                                    <p class="text-xs text-slate-300">Instantiate a secure <span class="font-mono text-white underline">UserEntity</span> object instance.</p>
                                </div>

                                <div class="flex bg-white/10 p-1.5 rounded-2xl border border-white/20 backdrop-blur-3xl">
                                    <button onclick="AppEngine.state.authMode='signin'; AppEngine.render();" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition ${!isLogin ? 'bg-white text-slate-950 shadow-md' : 'text-slate-300 hover:text-white'}">
                                        New Registration
                                    </button>
                                    <button onclick="AppEngine.state.authMode='login'; AppEngine.render();" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition ${isLogin ? 'bg-white text-slate-950 shadow-md' : 'text-slate-300 hover:text-white'}">
                                        Existing Login
                                    </button>
                                </div>

                                <div class="space-y-4">
                                    ${!isLogin ? `
                                        <div>
                                            <label class="block text-xs font-mono uppercase text-slate-300 mb-2">Entity Name</label>
                                            <input type="text" id="authName" placeholder="Dr. Alan Turing" class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-3.5 text-xs sm:text-sm text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">
                                        </div>
                                    ` : ''}
                                    <div>
                                        <label class="block text-xs font-mono uppercase text-slate-300 mb-2">Identifier (Email)</label>
                                        <input type="email" id="authEmail" placeholder="turing@algebra.edu" class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-3.5 text-xs sm:text-sm text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-mono uppercase text-slate-300 mb-2">Security Key (Password)</label>
                                        <input type="password" id="authPass" placeholder="••••••••" class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-3.5 text-xs sm:text-sm text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">
                                    </div>
                                    <button onclick="AppEngine.handleAuthSubmit()" class="crystal-btn w-full py-4 rounded-2xl text-sm font-bold shadow-lg">
                                        ${isLogin ? 'Authenticate Session ⚡' : 'Instantiate Entity Class ✦'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                },

                renderClasses() {
                    return `
                        <div class="space-y-8 animate-fade-in max-w-5xl mx-auto">
                            <div class="text-center space-y-3">
                                <span class="bg-white/10 text-white border border-white/20 px-4 py-1.5 rounded-full text-xs font-mono uppercase tracking-widest backdrop-blur-3xl">
                                    OOP Taxonomy
                                </span>
                                <h1 class="text-3xl lg:text-4xl font-extrabold text-white">Class Hierarchy Registry</h1>
                                <p class="text-slate-300 text-sm">Underlying software architecture classes built into this application.</p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4">
                                <div class="glass-panel p-8 rounded-[2.5rem] space-y-4 backdrop-blur-3xl">
                                    <div class="text-xs font-mono text-slate-300">Class 01 // Base</div>
                                    <h3 class="text-xl font-bold text-white">CategoryObject</h3>
                                    <p class="text-slate-300 text-xs leading-relaxed">Manages universal entity properties, metadata storage, and creation timestamps.</p>
                                    <div class="p-3 bg-white/5 rounded-xl font-mono text-[11px] text-white border border-white/15 overflow-x-auto">
                                        class CategoryObject {<br>&nbsp;&nbsp;constructor(name, meta)<br>}
                                    </div>
                                </div>
                                <div class="glass-panel p-8 rounded-[2.5rem] space-y-4 backdrop-blur-3xl">
                                    <div class="text-xs font-mono text-slate-300">Class 02 // Derived</div>
                                    <h3 class="text-xl font-bold text-white">UserEntity</h3>
                                    <p class="text-slate-300 text-xs leading-relaxed">Extends base class to handle user authentication state and operation counters.</p>
                                    <div class="p-3 bg-white/5 rounded-xl font-mono text-[11px] text-white border border-white/15 overflow-x-auto">
                                        class UserEntity extends CategoryObject {<br>&nbsp;&nbsp;incrementOperations()<br>}
                                    </div>
                                </div>
                                <div class="glass-panel p-8 rounded-[2.5rem] space-y-4 backdrop-blur-3xl">
                                    <div class="text-xs font-mono text-slate-300">Class 03 // Functor</div>
                                    <h3 class="text-xl font-bold text-white">MorphismTransformation</h3>
                                    <p class="text-slate-300 text-xs leading-relaxed">Encapsulates structure-preserving mapping functions between categories.</p>
                                    <div class="p-3 bg-white/5 rounded-xl font-mono text-[11px] text-white border border-white/15 overflow-x-auto">
                                        class MorphismTransformation {<br>&nbsp;&nbsp;execute(payload)<br>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                },

                renderMorphismLab() {
                    return `
                        <div class="space-y-8 animate-fade-in max-w-4xl mx-auto">
                            <div class="text-center space-y-3">
                                <span class="bg-white/10 text-white border border-white/20 px-4 py-1.5 rounded-full text-xs font-mono uppercase tracking-widest backdrop-blur-3xl">
                                    Category Theory Sandbox
                                </span>
                                <h1 class="text-3xl lg:text-4xl font-extrabold text-white">Morphism Transformation Matrix</h1>
                                <p class="text-slate-300 text-sm">Provide object payload data and execute structure-preserving mappings in real time.</p>
                            </div>

                            <div class="glass-panel p-8 lg:p-10 rounded-[3rem] space-y-6 backdrop-blur-3xl">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="space-y-2">
                                        <label class="text-xs font-mono uppercase text-slate-300">Source Object (Category A)</label>
                                        <textarea id="labInput" rows="6" class="w-full bg-white/10 border border-white/20 rounded-2xl p-4 font-mono text-xs text-white focus:outline-none focus:border-white shadow-inner backdrop-blur-3xl">{
  "rawUser": "ADA LOVELACE",
  "securityTier": 5,
  "systemActive": true
}</textarea>
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-xs font-mono uppercase text-slate-300">Transformed Output (Category B)</label>
                                        <div id="labOutput" class="w-full bg-black/40 border border-white/20 rounded-2xl p-4 font-mono text-xs text-emerald-300 h-[146px] overflow-y-auto backdrop-blur-3xl">
                                            Awaiting morphism execution pipeline...
                                        </div>
                                    </div>
                                </div>
                                <button onclick="AppEngine.executeMorphismLab()" class="crystal-btn w-full py-4 rounded-2xl text-sm font-bold shadow-lg">
                                    Execute Morphism Mapping ⚡
                                </button>
                            </div>
                        </div>
                    `;
                },

                renderDashboard() {
                    const u = AppEngine.state.user || { name: 'Scholar', email: 'scholar@morphism.os', role: 'Theorist' };
                    return `
                        <div class="space-y-8 animate-fade-in max-w-4xl mx-auto">
                            <div class="glass-panel p-8 rounded-[3rem] flex flex-col sm:flex-row items-center justify-between gap-6 backdrop-blur-3xl">
                                <div class="flex items-center gap-6 text-center sm:text-left">
                                    <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-white to-slate-300 flex items-center justify-center text-3xl shadow-xl">👑</div>
                                    <div class="space-y-1">
                                        <span class="text-[10px] font-mono text-slate-300 uppercase tracking-widest">Active UserEntity Instance</span>
                                        <h2 class="text-2xl font-bold text-white">${u.name}</h2>
                                        <p class="text-xs text-slate-300 font-mono">${u.email} • Role: ${u.role}</p>
                                    </div>
                                </div>
                                <button onclick="AppEngine.state.user = null; localStorage.removeItem('morphismos_user'); AppEngine.showToast('Session terminated.'); AppEngine.router.navigate('home');" class="bg-red-500/20 border border-red-500/40 px-5 py-3 rounded-2xl text-xs font-bold text-red-200 hover:bg-red-500/30 transition backdrop-blur-3xl">
                                    Terminate Session ⎋
                                </button>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="glass-panel p-7 rounded-[2.5rem] space-y-3 backdrop-blur-3xl">
                                    <span class="text-xs font-mono uppercase text-slate-300">Class Polymorphism</span>
                                    <div class="text-2xl font-bold text-white">UserEntity [Active]</div>
                                    <p class="text-xs text-slate-300">Instance verified securely against local storage container category.</p>
                                </div>
                                <div class="glass-panel p-7 rounded-[2.5rem] space-y-3 backdrop-blur-3xl">
                                    <span class="text-xs font-mono uppercase text-slate-300">Functor Mapping</span>
                                    <div class="text-2xl font-bold text-white">Isomorphic State</div>
                                    <p class="text-xs text-slate-300">UI layout reflects current object property values without state loss.</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
            },

            handleAuthSubmit() {
                const email = document.getElementById('authEmail').value.trim();
                const name = document.getElementById('authName') ? document.getElementById('authName').value.trim() : 'Scholar';
                
                if (!email || !email.includes('@')) {
                    this.showToast('❌ Please provide a valid email identifier.');
                    return;
                }

                // Instantiate UserEntity class object
                const activeUser = new UserEntity(name || email.split('@')[0], email, 'Category Theorist');
                this.state.user = { name: activeUser.name, email: activeUser.metadata.email, role: activeUser.metadata.role };
                
                localStorage.setItem('morphismos_user', JSON.stringify(this.state.user));
                this.showToast(`✦ Successfully instantiated session for ${activeUser.name}!`);
                this.router.navigate('dashboard');
            },

            executeMorphismLab() {
                try {
                    const rawInput = document.getElementById('labInput').value;
                    const parsedData = JSON.parse(rawInput);

                    // Instantiate a MorphismTransformation object
                    const structuralMorphism = new MorphismTransformation('SourceJSON', 'FormattedView', (input) => ({
                        normalizedUser: input.rawUser ? input.rawUser.toLowerCase() : 'guest',
                        securityRank: `Tier-${input.securityTier || 1} [Verified]`,
                        operationalFlag: input.systemActive ? 'ONLINE 🟢' : 'OFFLINE 🔴',
                        morphismTimestamp: new Date().toLocaleTimeString()
                    }));

                    const output = structuralMorphism.execute(parsedData);
                    document.getElementById('labOutput').innerText = JSON.stringify(output, null, 2);
                    this.showToast('⚡ Morphism transformation executed successfully.');
                } catch (err) {
                    document.getElementById('labOutput').innerText = `Error: Invalid JSON payload (${err.message})`;
                    this.showToast('❌ Morphism mapping failed.');
                }
            }
        };

        // Live Clock Engine
        function updateClock() {
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            const clockEl = document.getElementById('clockText');
            if (clockEl) clockEl.innerText = timeString;
        }
        setInterval(updateClock, 1000);

        window.addEventListener('DOMContentLoaded', () => {
            AppEngine.router.init();
        });
    </script>
</body>
</html>
