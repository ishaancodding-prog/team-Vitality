<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub (Team Vitality Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        .classy-card {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .classy-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }
        .gold-btn {
            background: linear-gradient(135deg, #f3e7e2 0%, #e5c158 50%, #c59b27 100%);
            color: #0c0c0e;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(197, 155, 39, 0.25);
            transition: all 0.3s ease;
        }
        .gold-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(197, 155, 39, 0.4);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #f3e7e2 40%, #e5c158 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .star-rating span {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .star-rating span.active {
            color: #e5c158;
            text-shadow: 0 0 12px rgba(229, 193, 88, 0.6);
        }
    </style>
</head>
<body class="bg-[#0c0c0e] text-slate-100 antialiased selection:bg-[#e5c158] selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Ambient Background Lighting -->
    <div class="fixed top-0 left-1/4 w-[700px] h-[700px] bg-[#e5c158]/5 rounded-full blur-[180px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[700px] h-[700px] bg-amber-700/5 rounded-full blur-[180px] pointer-events-none"></div>

    <!-- NAVBAR -->
    <header class="border-b border-white/5 bg-[#0c0c0e]/80 backdrop-blur-2xl sticky top-0 z-50 px-6 lg:px-20 py-5 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-4 cursor-pointer group" onclick="router.navigateTo('/')">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-[#c59b27] to-[#e5c158] flex items-center justify-center font-bold text-slate-950 text-xl shadow-lg shadow-amber-500/20 group-hover:scale-105 transition">
                ✧
            </div>
            <div>
                <span class="font-bold tracking-widest text-sm text-white uppercase">ABTalks</span>
                <span class="block text-[9px] text-[#e5c158] font-semibold tracking-widest uppercase">Team Vitality</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center gap-1 bg-white/[0.03] p-1.5 rounded-2xl border border-white/5">
            <button onclick="router.navigateTo('/')" id="nav-home" class="px-4 py-2 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">Overview</button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="px-4 py-2 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">Dashboard</button>
            <button onclick="router.navigateTo('/day/1')" id="nav-day" class="px-4 py-2 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">Day One</button>
            <button onclick="router.navigateTo('/aichat')" id="nav-aichat" class="px-4 py-2 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">AI Tutor ✦</button>
            <button onclick="router.navigateTo('/analytics')" id="nav-analytics" class="px-4 py-2 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">Analytics 📊</button>
            <button onclick="router.navigateTo('/resources')" id="nav-resources" class="px-4 py-2 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">Resources 📚</button>
            <button onclick="router.navigateTo('/about')" id="nav-about" class="px-4 py-2 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">About</button>
            <button onclick="router.navigateTo('/contact')" id="nav-contact" class="px-4 py-2 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">Contact</button>
        </nav>

        <div class="flex items-center gap-4">
            <div id="liveClock" class="hidden xl:flex items-center gap-2 bg-white/[0.03] border border-white/5 px-4 py-2 rounded-xl font-mono text-xs text-amber-200/80 font-medium">
                <span>🕒</span> <span id="clockText">00:00:00</span>
            </div>
            <button onclick="router.navigateTo('/signin')" class="bg-white/[0.05] border border-white/10 hover:border-[#e5c158] px-4 py-2 rounded-xl text-xs font-semibold transition text-amber-200">
                Sign In ✦
            </button>
        </div>
    </header>

    <!-- MAIN ROUTER CONTAINER -->
    <main id="app-router" class="flex-grow max-w-7xl mx-auto w-full px-6 lg:px-20 py-12 z-10"></main>

    <!-- FOOTER -->
    <footer class="border-t border-white/5 bg-[#0c0c0e] py-10 px-6 lg:px-20 z-10 text-xs text-slate-500">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 font-medium">
            <div>© 2026 ABTalks Ecosystem. Engineered with expanded features by Team <span class="text-[#e5c158]">Vitality</span>.</div>
            <div class="flex gap-6">
                <a href="#/" onclick="router.navigateTo('/')" class="hover:text-amber-200 transition">Overview</a>
                <a href="#/dashboard" onclick="router.navigateTo('/dashboard')" class="hover:text-amber-200 transition">Dashboard</a>
                <a href="#/day/1" onclick="router.navigateTo('/day/1')" class="hover:text-amber-200 transition">Day One</a>
                <a href="#/aichat" onclick="router.navigateTo('/aichat')" class="hover:text-amber-200 transition">AI Tutor</a>
                <a href="#/analytics" onclick="router.navigateTo('/analytics')" class="hover:text-amber-200 transition">Analytics</a>
                <a href="#/resources" onclick="router.navigateTo('/resources')" class="hover:text-amber-200 transition">Resources</a>
                <a href="#/contact" onclick="router.navigateTo('/contact')" class="hover:text-amber-200 transition">Contact</a>
            </div>
        </div>
    </footer>

    <!-- ENGINE SCRIPT -->
    <script>
        const appState = {
            streakDays: 1,
            selectedTrack: 'AI & Full Stack',
            githubLink: '',
            linkedinLink: '',
            isSubmitted: false,
            synergyPoints: 50,
            selectedCalendarDay: 1,
            selectedRating: 5,
            captchaNum1: 4,
            captchaNum2: 5,
            captchaInput: '',
            currentUser: null,
            chatMessages: [
                { sender: 'ai', text: "Welcome to ABTalks Enhanced Hub! I am your AI Code Mentor powered by Team Vitality. Ask me for debugging tips, architecture patterns, or daily challenge guidance." }
            ],
            chatInput: '',
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => { appState.toastMessage = null; render(); }, 3500);
        }

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            const clockEl = document.getElementById('clockText');
            if (clockEl) clockEl.innerText = timeString;
        }
        setInterval(updateClock, 1000);

        const router = {
            currentRoute: '/',
            init() { 
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) { 
                window.location.hash = route;
                this.currentRoute = route;
                render(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. LANDING PAGE (/)
        function renderLanding() {
            return `
                <div class="space-y-16 animate-fadeIn py-6">
                    <div class="classy-card p-12 lg:p-24 rounded-[3.5rem] relative overflow-hidden text-center space-y-8">
                        <div class="inline-flex items-center gap-2.5 bg-white/[0.04] text-[#e5c158] border border-amber-500/20 px-5 py-2 rounded-full text-xs font-semibold uppercase tracking-widest">
                            <span class="w-2 h-2 rounded-full bg-[#e5c158] animate-pulse"></span> Team Vitality • Enhanced 60-Day Cohort
                        </div>
                        
                        <h1 class="text-4xl lg:text-7xl font-bold tracking-tight text-white leading-[1.1] max-w-4xl mx-auto">
                            Excellence in Engineering.<br>Own Your <span class="gold-gradient">60-Day Legacy.</span>
                        </h1>
                        
                        <p class="text-slate-400 text-base lg:text-lg leading-relaxed max-w-2xl mx-auto font-normal">
                            Transform post-college hours into high-impact GitHub commits with integrated AI mentorship, automated analytics tracking, and professional proof of work.
                        </p>

                        <div class="pt-4 flex flex-wrap justify-center items-center gap-5">
                            <button onclick="router.navigateTo('/dashboard')" class="gold-btn px-10 py-4 rounded-2xl text-sm tracking-wide">
                                Access Dashboard ✧
                            </button>
                            <button onclick="router.navigateTo('/analytics')" class="classy-card text-amber-200 font-semibold px-9 py-4 rounded-2xl text-sm transition hover:bg-white/[0.04]">
                                View Analytics 📊
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 pt-4">
                        <div class="classy-card p-6 rounded-[2.5rem] space-y-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-[#e5c158] border border-amber-500/20 flex items-center justify-center font-bold text-sm">✦</div>
                            <h3 class="text-base font-bold text-white">AI Tutor Assistant</h3>
                            <p class="text-slate-400 text-xs leading-relaxed font-normal">Real-time answers and intelligent code reviews.</p>
                        </div>
                        <div class="classy-card p-6 rounded-[2.5rem] space-y-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-[#e5c158] border border-amber-500/20 flex items-center justify-center font-bold text-sm">📊</div>
                            <h3 class="text-base font-bold text-white">Deep Analytics</h3>
                            <p class="text-slate-400 text-xs leading-relaxed font-normal">Track commit velocity, language usage, and consistency metrics.</p>
                        </div>
                        <div class="classy-card p-6 rounded-[2.5rem] space-y-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-[#e5c158] border border-amber-500/20 flex items-center justify-center font-bold text-sm">📚</div>
                            <h3 class="text-base font-bold text-white">Resource Vault</h3>
                            <p class="text-slate-400 text-xs leading-relaxed font-normal">Curated guides on algorithms, system design, and AI integration.</p>
                        </div>
                        <div class="classy-card p-6 rounded-[2.5rem] space-y-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-[#e5c158] border border-amber-500/20 flex items-center justify-center font-bold text-sm">🛡️</div>
                            <h3 class="text-base font-bold text-white">Secure Verification</h3>
                            <p class="text-slate-400 text-xs leading-relaxed font-normal">Automated CAPTCHA & GitHub integration checks.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. STUDENT DASHBOARD (/dashboard)
        function renderDashboard() {
            let daysHtml = '';
            for (let i = 1; i <= 60; i++) {
                const isSelected = appState.selectedCalendarDay === i;
                const isUnlocked = i === 1;
                
                let btnClasses = "p-3 rounded-2xl text-xs font-semibold transition flex flex-col items-center justify-center gap-1 border ";
                if (isSelected) {
                    btnClasses += "bg-gradient-to-br from-[#e5c158] to-[#c59b27] text-slate-950 border-amber-300 shadow-lg scale-105 z-10 font-bold";
                } else if (isUnlocked) {
                    btnClasses += "bg-white/[0.04] text-amber-200 border-amber-500/20 hover:bg-white/[0.08]";
                } else {
                    btnClasses += "bg-white/[0.01] text-slate-600 border-white/5 opacity-40 cursor-not-allowed";
                }

                daysHtml += `
                    <button onclick="${isUnlocked ? `selectCalendarDay(${i})` : `showToast('🔒 Day ${i} unlocks after Day 1 completion.')`}" class="${btnClasses}">
                        <span>Day ${i}</span>
                        <span class="text-[9px] ${isSelected ? 'text-slate-950 font-bold' : (isUnlocked ? 'text-emerald-400' : 'text-slate-600')}">${i === 1 ? 'Pending' : 'Lock'}</span>
                    </button>
                `;
            }

            const userName = appState.currentUser ? appState.currentUser.name : "Ishaan Thusoo";

            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto">
                    <!-- Profile Banner -->
                    <div class="classy-card p-8 rounded-[3rem] flex flex-col sm:flex-row items-center justify-between gap-6">
                        <div class="flex items-center gap-6 text-center sm:text-left">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${userName}&backgroundColor=e5c158" alt="User Avatar" class="w-20 h-20 rounded-2xl bg-amber-500/10 border border-amber-400/30 p-1">
                            <div class="space-y-1">
                                <span class="text-[10px] font-semibold text-[#e5c158] uppercase tracking-widest">Verified Scholar</span>
                                <h2 class="text-2xl font-bold text-white">${userName}</h2>
                                <p class="text-xs text-slate-400 font-medium">Govind Ballabh Pant University • AI & Full Stack Track</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="router.navigateTo('/aichat')" class="gold-btn px-5 py-3 rounded-2xl text-xs font-semibold flex items-center gap-2">
                                Ask AI Tutor ✦
                            </button>
                            <button onclick="router.navigateTo('/analytics')" class="classy-card px-5 py-3 rounded-2xl text-xs font-semibold text-amber-200 hover:bg-white/[0.04]">
                                View Stats 📊
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="classy-card p-7 rounded-[2.5rem]">
                            <span class="text-xs uppercase font-semibold text-[#e5c158] tracking-wider">Active Streak</span>
                            <div class="text-4xl font-bold text-white mt-2">${appState.streakDays} <span class="text-lg font-normal text-slate-400">Day 🔥</span></div>
                        </div>
                        <div class="classy-card p-7 rounded-[2.5rem]">
                            <span class="text-xs uppercase font-semibold text-slate-300 tracking-wider">Milestone Progress</span>
                            <div class="text-4xl font-bold text-white mt-2">1.6%</div>
                        </div>
                        <div class="classy-card p-7 rounded-[2.5rem]">
                            <span class="text-xs uppercase font-semibold text-emerald-400 tracking-wider">Synergy Points</span>
                            <div class="text-4xl font-bold text-emerald-400 mt-2">${appState.synergyPoints} SP</div>
                        </div>
                    </div>

                    <div class="classy-card p-8 rounded-[3.5rem] space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h3 class="text-xl font-bold text-white tracking-tight">60-Day Challenge Calendar</h3>
                                <p class="text-xs text-slate-400 font-medium">Select any unlocked day to inspect requirements and verification logs.</p>
                            </div>
                            <span class="text-xs bg-amber-500/10 text-[#e5c158] border border-amber-500/20 px-4 py-1.5 rounded-full font-semibold">Selected: Day ${appState.selectedCalendarDay}</span>
                        </div>

                        <div class="grid grid-cols-5 sm:grid-cols-10 gap-3 max-h-72 overflow-y-auto pr-2">
                            ${daysHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        // 3. CHALLENGE DAY VIEW (/day/1)
        function renderDayChallenge() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-sm text-slate-400 hover:text-white font-semibold flex items-center gap-2">← Back to Dashboard</button>
                        <span class="text-xs font-semibold text-[#e5c158] bg-amber-500/10 border border-amber-500/20 px-4 py-1.5 rounded-full">Day 1 of 60</span>
                    </div>

                    <div class="space-y-3">
                        <h1 class="text-3xl lg:text-5xl font-bold text-white tracking-tight">Environment Setup & Hello World</h1>
                        <p class="text-base text-slate-300 leading-relaxed font-normal">Initialize your public GitHub repository, configure your development environment, and publish your initial proof of work.</p>
                    </div>

                    <div class="classy-card p-8 lg:p-12 rounded-[3.5rem] space-y-6">
                        <h3 class="text-lg font-bold text-white flex items-center justify-between">
                            <span>✧ Submit Day One Proof of Work</span>
                            ${appState.isSubmitted ? '<span class="text-xs text-emerald-400 font-semibold bg-emerald-500/10 px-4 py-1 rounded-full border border-emerald-500/20">Verified ✓</span>' : '<span class="text-xs text-amber-300 font-semibold bg-amber-500/10 px-4 py-1 rounded-full border border-amber-500/20">Pending</span>'}
                        </h3>

                        <div class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" placeholder="https://github.com/username/repo" class="w-full bg-white/[0.02] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#e5c158]">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" placeholder="https://linkedin.com/posts/..." class="w-full bg-white/[0.02] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#e5c158]">
                            </div>
                            
                            <div class="bg-white/[0.02] border border-white/10 p-5 rounded-2xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs uppercase font-semibold text-slate-300">Security Math Verification</span>
                                    <button onclick="refreshCaptcha()" class="text-xs text-[#e5c158] hover:underline font-semibold">Generate New Code ↺</button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="bg-white/[0.04] border border-white/10 px-5 py-3 rounded-2xl text-base font-mono font-bold text-amber-200">
                                        ${appState.captchaNum1} + ${appState.captchaNum2} = ?
                                    </div>
                                    <input type="number" id="captchaInput" value="${appState.captchaInput}" oninput="appState.captchaInput=this.value" placeholder="Answer" class="w-40 bg-white/[0.02] border border-white/10 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#e5c158]">
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-4">
                            <button onclick="handleSubmission()" class="gold-btn flex-1 py-4 rounded-2xl text-base">
                                Verify & Submit Day 1 Proof (+50 SP) ✧
                            </button>
                            <button onclick="router.navigateTo('/aichat')" class="classy-card px-6 py-4 rounded-2xl text-xs font-semibold text-amber-200 hover:bg-white/[0.04] transition">
                                Ask AI Bot ✦
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. ANALYTICS & STATS SCREEN (/analytics)
        function renderAnalytics() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto py-2">
                    <div class="text-center space-y-2">
                        <span class="text-xs font-semibold uppercase tracking-widest text-[#e5c158] bg-amber-500/10 border border-amber-500/20 px-4 py-1.5 rounded-full">Cohort Insights</span>
                        <h1 class="text-3xl font-bold text-white tracking-tight">Performance Analytics & Velocity</h1>
                        <p class="text-slate-400 text-xs sm:text-sm font-medium">Real-time metrics tracking your commit frequency, language distribution, and consistency score.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="classy-card p-7 rounded-[2.5rem] space-y-2">
                            <span class="text-xs uppercase font-semibold text-slate-400">Commit Velocity</span>
                            <div class="text-3xl font-bold text-white">1.2 / day</div>
                            <span class="text-[11px] text-emerald-400 font-semibold">+15% vs cohort average</span>
                        </div>
                        <div class="classy-card p-7 rounded-[2.5rem] space-y-2">
                            <span class="text-xs uppercase font-semibold text-slate-400">Consistency Score</span>
                            <div class="text-3xl font-bold text-amber-200">98.4%</div>
                            <span class="text-[11px] text-[#e5c158] font-semibold">12 Days Active Streak</span>
                        </div>
                        <div class="classy-card p-7 rounded-[2.5rem] space-y-2">
                            <span class="text-xs uppercase font-semibold text-slate-400">Recruiter Visibility</span>
                            <div class="text-3xl font-bold text-sky-400">High Tier</div>
                            <span class="text-[11px] text-sky-300 font-semibold">Profile viewed 14 times</span>
                        </div>
                    </div>

                    <div class="classy-card p-8 rounded-[3.5rem] space-y-5">
                        <h3 class="text-lg font-bold text-white">Language Breakdown (AI & Full Stack Track)</h3>
                        <div class="space-y-3 text-xs">
                            <div>
                                <div class="flex justify-between mb-1 text-slate-300 font-semibold"><span>JavaScript / TypeScript</span><span>55%</span></div>
                                <div class="w-full bg-white/[0.05] h-3 rounded-full overflow-hidden"><div class="bg-amber-400 h-full w-[55%] rounded-full"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between mb-1 text-slate-300 font-semibold"><span>Python & AI Integration</span><span>30%</span></div>
                                <div class="w-full bg-white/[0.05] h-3 rounded-full overflow-hidden"><div class="bg-sky-400 h-full w-[30%] rounded-full"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between mb-1 text-slate-300 font-semibold"><span>HTML / CSS / Tailwind</span><span>15%</span></div>
                                <div class="w-full bg-white/[0.05] h-3 rounded-full overflow-hidden"><div class="bg-purple-400 h-full w-[15%] rounded-full"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. RESOURCE VAULT SCREEN (/resources)
        function renderResources() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto py-2">
                    <div class="text-center space-y-2">
                        <span class="text-xs font-semibold uppercase tracking-widest text-[#e5c158] bg-amber-500/10 border border-amber-500/20 px-4 py-1.5 rounded-full">Knowledge Hub</span>
                        <h1 class="text-3xl font-bold text-white tracking-tight">Curated Engineering Vault</h1>
                        <p class="text-slate-400 text-xs sm:text-sm font-medium">Essential guides, templates, and architectural references for the 60-day challenge.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="classy-card p-8 rounded-[3rem] space-y-4">
                            <div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-[#e5c158] border border-amber-500/20 flex items-center justify-center font-bold text-lg">⚡</div>
                            <h3 class="text-xl font-bold text-white">Full-Stack Architecture Best Practices</h3>
                            <p class="text-slate-400 text-xs sm:text-sm leading-relaxed font-normal">Learn how to structure single-file components, manage state effectively, and deploy with zero downtime.</p>
                            <button onclick="showToast('✧ Resource guide downloaded successfully!')" class="gold-btn px-5 py-2.5 rounded-xl text-xs">Read Guide ✦</button>
                        </div>
                        <div class="classy-card p-8 rounded-[3rem] space-y-4">
                            <div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-[#e5c158] border border-amber-500/20 flex items-center justify-center font-bold text-lg">🤖</div>
                            <h3 class="text-xl font-bold text-white">Prompt Engineering & AI Integrations</h3>
                            <p class="text-slate-400 text-xs sm:text-sm leading-relaxed font-normal">Master building responsive UI workflows and leveraging LLMs for rapid full-stack prototyping.</p>
                            <button onclick="showToast('✧ Resource guide downloaded successfully!')" class="gold-btn px-5 py-2.5 rounded-xl text-xs">Read Guide ✦</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 6. AI CHAT BOT FEATURE (/aichat)
        function renderAiChat() {
            return `
                <div class="space-y-6 animate-fadeIn max-w-4xl mx-auto py-2">
                    <div class="text-center space-y-2">
                        <span class="text-xs font-semibold uppercase tracking-widest text-[#e5c158] bg-amber-500/10 border border-amber-500/20 px-4 py-1.5 rounded-full">AI Mentor • Team Vitality</span>
                        <h1 class="text-3xl font-bold text-white tracking-tight">ABTalks Intelligent Coding Assistant</h1>
                        <p class="text-slate-400 text-xs sm:text-sm font-medium">Ask questions about today's challenge, syntax errors, or architecture guidance.</p>
                    </div>

                    <div class="classy-card p-6 rounded-[3rem] space-y-4">
                        <div id="chatMessagesBox" class="h-96 overflow-y-auto space-y-4 pr-2">
                            ${appState.chatMessages.map(msg => `
                                <div class="flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}">
                                    <div class="max-w-xl p-4 rounded-2xl text-xs sm:text-sm leading-relaxed ${msg.sender === 'user' ? 'bg-[#e5c158] text-slate-950 font-semibold' : 'bg-white/[0.04] border border-white/10 text-slate-200'}">
                                        <div class="text-[10px] opacity-70 mb-1 font-bold uppercase">${msg.sender === 'user' ? 'You' : 'Team Vitality AI'}</div>
                                        ${msg.text}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="flex gap-3 pt-2 border-t border-white/10">
                            <input type="text" id="aiChatInput" value="${appState.chatInput}" oninput="appState.chatInput=this.value" onkeydown="if(event.key==='Enter') sendChatMessage()" placeholder="Ask AI anything about Day 1 setup or debugging..." class="flex-1 bg-white/[0.02] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#e5c158]">
                            <button onclick="sendChatMessage()" class="gold-btn px-7 py-3.5 rounded-2xl text-xs font-bold">
                                Send ✦
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function sendChatMessage() {
            const inputVal = document.getElementById('aiChatInput').value.trim();
            if (!inputVal) return;

            appState.chatMessages.push({ sender: 'user', text: inputVal });
            appState.chatInput = '';
            render();

            setTimeout(() => {
                let aiReply = "That's a great question! For Day 1, make sure your GitHub repository is public and initialized with a clean README before submitting your link.";
                if (inputVal.toLowerCase().includes('github') || inputVal.toLowerCase().includes('repo')) {
                    aiReply = "To initialize your GitHub repo: run `git init`, `git add .`, `git commit -m 'Day 1 setup'`, and push to your remote repository!";
                } else if (inputVal.toLowerCase().includes('streak') || inputVal.toLowerCase().includes('points')) {
                    aiReply = "Completing daily challenges awards 50 Synergy Points and pushes your 60-day consistency record forward!";
                }
                appState.chatMessages.push({ sender: 'ai', text: aiReply });
                render();
                const box = document.getElementById('chatMessagesBox');
                if (box) box.scrollTop = box.scrollHeight;
            }, 800);
        }

        // 7. SIGN IN PAGE (/signin)
        function renderSignIn() {
            return `
                <div class="space-y-6 animate-fadeIn max-w-md mx-auto py-8">
                    <div class="text-center space-y-2">
                        <span class="text-xs font-semibold uppercase tracking-widest text-[#e5c158] bg-amber-500/10 border border-amber-500/20 px-4 py-1.5 rounded-full">Secure Authentication</span>
                        <h1 class="text-3xl font-bold text-white tracking-tight">Sign In to ABTalks</h1>
                        <p class="text-slate-400 text-xs font-medium">Access your 60-day challenge dashboard & AI mentor.</p>
                    </div>

                    <div class="classy-card p-8 rounded-[3rem] space-y-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Full Name</label>
                            <input type="text" id="signInName" placeholder="Ishaan Thusoo" class="w-full bg-white/[0.02] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#e5c158]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">College Email</label>
                            <input type="email" id="signInEmail" placeholder="student@university.ac.in" class="w-full bg-white/[0.02] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#e5c158]">
                        </div>
                        <button onclick="handleSignIn()" class="gold-btn w-full py-4 rounded-2xl text-sm">
                            Sign In & Start Streak ✧
                        </button>
                    </div>
                </div>
            `;
        }

        function handleSignIn() {
            const nameVal = document.getElementById('signInName').value.trim();
            const emailVal = document.getElementById('signInEmail').value.trim();
            if (!nameVal || !emailVal) {
                showToast('Please provide both your name and college email.');
                return;
            }
            appState.currentUser = { name: nameVal, email: emailVal };
            showToast(`✧ Welcome back, ${nameVal}! Session authenticated.`);
            setTimeout(() => router.navigateTo('/dashboard'), 1200);
        }

        // 8. ABOUT US SECTION (/about)
        function renderAbout() {
            return `
                <div class="space-y-12 animate-fadeIn max-w-5xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-semibold uppercase tracking-widest text-[#e5c158] bg-amber-500/10 border border-amber-500/20 px-4 py-1.5 rounded-full">About Us • Team Vitality</span>
                        <h1 class="text-4xl lg:text-5xl font-bold text-white tracking-tight">Meet Our Core Team</h1>
                        <p class="text-slate-400 text-base max-w-2xl mx-auto font-normal">The dedicated creators behind the architecture, design, and intelligence of ABTalks.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pt-4">
                        <div class="classy-card p-8 rounded-[3rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-[#e5c158] flex items-center justify-center font-bold text-xl mx-auto">🎨</div>
                            <h3 class="text-2xl font-bold text-white">Mahima</h3>
                            <p class="text-xs text-amber-400 font-semibold uppercase tracking-widest">Designer</p>
                            <p class="text-slate-400 text-xs font-normal">Crafted intuitive layouts, visual aesthetics, and refined user experiences.</p>
                        </div>

                        <div class="classy-card p-8 rounded-[3rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-[#e5c158] flex items-center justify-center font-bold text-xl mx-auto">🤖</div>
                            <h3 class="text-2xl font-bold text-white">Diksha</h3>
                            <p class="text-xs text-amber-400 font-semibold uppercase tracking-widest">AI Engineer</p>
                            <p class="text-slate-400 text-xs font-normal">Engineered intelligent workflows and cutting-edge assistance mechanics.</p>
                        </div>

                        <div class="classy-card p-8 rounded-[3rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-[#e5c158] flex items-center justify-center font-bold text-xl mx-auto">💻</div>
                            <h3 class="text-2xl font-bold text-white">Ishaan</h3>
                            <p class="text-xs text-amber-400 font-semibold uppercase tracking-widest">Frontend & Backend Developer</p>
                            <p class="text-slate-400 text-xs font-normal">Developed full-stack architecture, routing mechanics, and application logic.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 9. CONTACT US SECTION (/contact)
        function renderContact() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-3xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-semibold uppercase tracking-widest text-[#e5c158] bg-amber-500/10 border border-amber-500/20 px-4 py-1.5 rounded-full">Get In Touch</span>
                        <h1 class="text-4xl font-bold text-white tracking-tight">Contact Team Vitality</h1>
                        <p class="text-slate-400 text-sm font-medium">Have feedback or inquiries? Send us a message and rate your experience below.</p>
                    </div>

                    <div class="classy-card p-8 lg:p-12 rounded-[3.5rem] space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Your Name</label>
                                <input type="text" placeholder="Ishaan Thusoo" class="w-full bg-white/[0.02] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#e5c158]">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Email Address</label>
                                <input type="email" placeholder="student@university.ac.in" class="w-full bg-white/[0.02] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#e5c158]">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Platform Experience Rating</label>
                            <div class="star-rating flex gap-3 text-3xl text-slate-600" id="starRatingContainer">
                                <span onclick="setRating(1)" class="${appState.selectedRating >= 1 ? 'active' : ''}">★</span>
                                <span onclick="setRating(2)" class="${appState.selectedRating >= 2 ? 'active' : ''}">★</span>
                                <span onclick="setRating(3)" class="${appState.selectedRating >= 3 ? 'active' : ''}">★</span>
                                <span onclick="setRating(4)" class="${appState.selectedRating >= 4 ? 'active' : ''}">★</span>
                                <span onclick="setRating(5)" class="${appState.selectedRating >= 5 ? 'active' : ''}">★</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Message / Feedback</label>
                            <textarea rows="4" placeholder="How can we assist you?" class="w-full bg-white/[0.02] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#e5c158] resize-none"></textarea>
                        </div>
                        <button onclick="showToast('✧ Feedback & ${appState.selectedRating}-Star Rating sent successfully!')" class="gold-btn w-full py-4 rounded-2xl text-base">
                            Submit Feedback & Rating ✧
                        </button>
                    </div>
                </div>
            `;
        }

        function setRating(stars) {
            appState.selectedRating = stars;
            render();
        }

        function selectCalendarDay(day) {
            appState.selectedCalendarDay = day;
            render();
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 6) + 2;
            appState.captchaNum2 = Math.floor(Math.random() * 4) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect verification answer. Try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakDays = 1;
            appState.synergyPoints += 50;
            showToast('✧ Day 1 Verified! Streak ignited & +50 Synergy Points added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const route = router.currentRoute;
            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/1') html = renderDayChallenge();
            else if (route === '/analytics') html = renderAnalytics();
            else if (route === '/resources') html = renderResources();
            else if (route === '/aichat') html = renderAiChat();
            else if (route === '/signin') html = renderSignIn();
            else if (route === '/about') html = renderAbout();
            else if (route === '/contact') html = renderContact();
            document.getElementById('app-router').innerHTML = html;

            ['/', '/dashboard', '/day/1', '/analytics', '/resources', '/aichat', '/signin', '/about', '/contact'].forEach(r => {
                const btnId = 'nav-' + (r === '/' ? 'home' : (r === '/dashboard' ? 'dashboard' : (r === '/day/1' ? 'day' : (r === '/analytics' ? 'analytics' : (r === '/resources' ? 'resources' : (r === '/aichat' ? 'aichat' : (r === '/about' ? 'about' : 'contact')))))));
                const btn = document.getElementById(btnId);
                if(btn) {
                    if(r === route) {
                        btn.className = 'px-4 py-2 text-xs font-semibold rounded-xl transition bg-gradient-to-r from-[#e5c158] to-[#c59b27] text-slate-950 shadow-lg shadow-amber-500/20';
                    } else {
                        btn.className = 'px-4 py-2 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white';
                    }
                }
            });
            updateClock();
        }

        window.addEventListener('DOMContentLoaded', () => { router.init(); });
    </script>
</body>
</html>
