<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub (Team Vitality Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        .ruby-card {
            background: linear-gradient(145deg, rgba(26, 10, 12, 0.95) 0%, rgba(14, 4, 6, 0.98) 100%);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(239, 68, 68, 0.35);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ruby-card:hover {
            border-color: rgba(239, 68, 68, 0.7);
            box-shadow: 0 45px 90px rgba(0, 0, 0, 0.95), 0 0 40px rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }
        .ruby-btn {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 50%, #b91c1c 100%);
            color: #ffffff;
            font-weight: 800;
            box-shadow: 0 12px 35px rgba(239, 68, 68, 0.45);
            transition: all 0.3s ease;
        }
        .ruby-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(239, 68, 68, 0.65);
        }
        .ruby-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #fee2e2 40%, #f87171 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes slideFade {
            0% { opacity: 0; transform: translateY(12px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-slide {
            animation: slideFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .star-rating span {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .star-rating span.active {
            color: #f87171;
            text-shadow: 0 0 15px rgba(248, 113, 113, 0.8);
        }
    </style>
</head>
<body class="bg-[#070203] text-slate-100 antialiased selection:bg-red-500 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Ambient Lighting (Crimson & Red) -->
    <div class="fixed top-0 left-1/4 w-[800px] h-[800px] bg-red-600/15 rounded-full blur-[200px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[800px] h-[800px] bg-rose-700/15 rounded-full blur-[200px] pointer-events-none"></div>

    <!-- NAVBAR -->
    <header class="border-b border-red-500/20 bg-[#070203]/90 backdrop-blur-2xl sticky top-0 z-50 px-6 lg:px-20 py-5 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-4 cursor-pointer group" onclick="router.navigateTo('/')">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-red-500 to-rose-700 flex items-center justify-center font-extrabold text-white text-2xl shadow-xl shadow-red-500/30 group-hover:scale-105 transition">
                ⚡
            </div>
            <div>
                <span class="font-extrabold tracking-widest text-sm text-white uppercase">ABTALKS</span>
                <span class="block text-[10px] text-red-400 font-bold tracking-widest uppercase">Team Vitality</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center gap-1 bg-red-950/40 p-1.5 rounded-2xl border border-red-500/20">
            <button onclick="router.navigateTo('/')" id="nav-home" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Overview</button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Dashboard</button>
            <button onclick="router.navigateTo('/day/1')" id="nav-day" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Day One</button>
            <button onclick="router.navigateTo('/analytics')" id="nav-analytics" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Analytics 📊</button>
            <button onclick="router.navigateTo('/resources')" id="nav-resources" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Resources 📚</button>
            <button onclick="router.navigateTo('/about')" id="nav-about" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">About</button>
            <button onclick="router.navigateTo('/contact')" id="nav-contact" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Contact</button>
        </nav>

        <div class="flex items-center gap-4">
            <div id="liveClock" class="hidden xl:flex items-center gap-2 bg-red-950/50 border border-red-500/20 px-4 py-2 rounded-xl font-mono text-xs text-red-300 font-bold">
                <span>🕒</span> <span id="clockText">00:00:00 AM</span>
            </div>
            <button onclick="router.navigateTo('/signin')" id="nav-auth-btn" class="bg-red-500/15 border border-red-500/30 hover:border-red-400 px-4 py-2 rounded-xl text-xs font-bold transition text-red-300">
                Sign In / Login ✦
            </button>
        </div>
    </header>

    <!-- MAIN ROUTER CONTAINER -->
    <main id="app-router" class="flex-grow max-w-7xl mx-auto w-full px-6 lg:px-20 py-12 z-10"></main>

    <!-- TOAST NOTIFICATION POPUP -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <div id="toastMessageContent" class="ruby-card px-6 py-3.5 rounded-2xl border border-red-500/40 text-xs font-bold text-white shadow-2xl flex items-center gap-3">
            <span class="text-red-400">✦</span> <span id="toastText">Notification message</span>
        </div>
    </div>

    <!-- AVATAR EDITOR MODAL OVERLAY -->
    <div id="avatarModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="ruby-card p-8 rounded-[3rem] max-w-lg w-full space-y-6 border border-red-500/40">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-xs font-bold uppercase tracking-widest text-red-400">Persona Customizer</span>
                    <h3 class="text-xl font-extrabold text-white mt-1">Select Your Indian Avatar</h3>
                </div>
                <button onclick="closeAvatarModal()" class="w-9 h-9 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 flex items-center justify-center font-bold hover:bg-red-500/20">✕</button>
            </div>
            <p class="text-xs text-slate-300">Choose from 10 professional student avatars:</p>
            <div class="grid grid-cols-5 gap-3 max-h-60 overflow-y-auto p-2 bg-red-950/20 border border-red-500/20 rounded-2xl" id="modalAvatarGrid"></div>
            <div class="pt-2 flex gap-3">
                <button onclick="saveModalAvatar()" class="ruby-btn flex-1 py-3.5 rounded-2xl text-xs">Save Avatar ⚡</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="border-t border-red-500/20 bg-[#070203] py-10 px-6 lg:px-20 z-10 text-xs text-slate-400">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 font-semibold">
            <div>© 2026 ABTalks Ecosystem. Ruby Red Edition by Team <span class="text-red-400">Vitality</span>.</div>
            <div class="flex gap-6">
                <a href="#/" onclick="router.navigateTo('/')" class="hover:text-red-300 transition">Overview</a>
                <a href="#/dashboard" onclick="router.navigateTo('/dashboard')" class="hover:text-red-300 transition">Dashboard</a>
                <a href="#/day/1" onclick="router.navigateTo('/day/1')" class="hover:text-red-300 transition">Day One</a>
                <a href="#/analytics" onclick="router.navigateTo('/analytics')" class="hover:text-red-300 transition">Analytics</a>
                <a href="#/resources" onclick="router.navigateTo('/resources')" class="hover:text-red-300 transition">Resources</a>
                <a href="#/contact" onclick="router.navigateTo('/contact')" class="hover:text-red-300 transition">Contact</a>
            </div>
        </div>
    </footer>

    <!-- ENGINE SCRIPT -->
    <script>
        const appState = {
            streakDays: 1,
            selectedTrack: 'AI & Full Stack',
            githubLink: '',
            linkedinLink: '',
            isSubmitted: false,
            synergyPoints: 50,
            selectedCalendarDay: 1,
            selectedRating: 5,
            captchaNum1: 4,
            captchaNum2: 3,
            captchaInput: '',
            currentUser: null, 
            selectedAvatar: 'Aarav',
            authMode: 'signin',
            activeSlideTab: 0
        };

        const interactiveSlides = [
            {
                tag: "PHASE 01 • FOUNDATION",
                title: "Initialize Your Developer Environment",
                desc: "Set up version control, configure your remote repository, and execute your first public deployment to ignite your 60-day streak with professional grade tools.",
                stat: "Day 1 to 15",
                highlight: "GitHub & CI/CD Setup"
            },
            {
                tag: "PHASE 02 • ARCHITECTURE",
                title: "Build High-Performance Applications",
                desc: "Implement modern component architectures, state management, and robust backend endpoints tailored for real-world production environments.",
                stat: "Day 16 to 40",
                highlight: "Full-Stack Scaling"
            },
            {
                tag: "PHASE 03 • DEPLOYMENT & LAUNCH",
                title: "Production & Professional Proof",
                desc: "Integrate robust testing suites, secure authentication pipelines, and automated deployments to stand out to elite tech recruiters.",
                stat: "Day 41 to 60",
                highlight: "Production Launch"
            }
        ];

        const avatarChoices = [
            { seed: "Aarav", name: "Aarav", style: "Software Engineer" },
            { seed: "Rohan", name: "Rohan", style: "Full Stack Dev" },
            { seed: "Kabir", name: "Kabir", style: "Backend Architect" },
            { seed: "Aditya", name: "Aditya", style: "Tech Lead" },
            { seed: "Ishaan", name: "Ishaan", style: "Cloud Specialist" },
            { seed: "Ananya", name: "Ananya", style: "UI/UX Designer" },
            { seed: "Diya", name: "Diya", style: "Frontend Dev" },
            { seed: "Priya", name: "Priya", style: "Data Scientist" },
            { seed: "Neha", name: "Neha", style: "Security Analyst" },
            { seed: "Kavya", name: "Kavya", style: "Systems Researcher" }
        ];

        function openAvatarModal() {
            const grid = document.getElementById('modalAvatarGrid');
            if (grid) {
                grid.innerHTML = avatarChoices.map(av => `
                    <div onclick="appState.selectedAvatar='${av.seed}'; updateLiveAvatar();" class="cursor-pointer flex flex-col items-center p-2 rounded-xl transition border modal-av-item-${av.seed} ${appState.selectedAvatar === av.seed ? 'bg-red-500/30 border-red-400 scale-105 shadow-md shadow-red-500/30' : 'border-transparent hover:bg-red-500/10'}">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${av.seed}&backgroundColor=ef4444" alt="${av.name}" class="w-12 h-12 rounded-full bg-red-500/10 p-0.5">
                        <span class="text-[10px] font-bold text-white mt-1 text-center">${av.name}</span>
                    </div>
                `).join('');
            }
            document.getElementById('avatarModal').classList.remove('hidden');
        }

        function closeAvatarModal() {
            document.getElementById('avatarModal').classList.add('hidden');
        }

        function updateLiveAvatar() {
            avatarChoices.forEach(av => {
                const el = document.querySelector(`.modal-av-item-${av.seed}`);
                if (el) {
                    if (appState.selectedAvatar === av.seed) {
                        el.className = `cursor-pointer flex flex-col items-center p-2 rounded-xl transition border bg-red-500/30 border-red-400 scale-105 shadow-md shadow-red-500/30 modal-av-item-${av.seed}`;
                    } else {
                        el.className = `cursor-pointer flex flex-col items-center p-2 rounded-xl transition border border-transparent hover:bg-red-500/10 modal-av-item-${av.seed}`;
                    }
                }
            });
        }

        function saveModalAvatar() {
            if (appState.currentUser) {
                appState.currentUser.avatar = appState.selectedAvatar;
            }
            showToast(`✦ Avatar updated to ${appState.selectedAvatar}!`);
            closeAvatarModal();
            render();
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const textEl = document.getElementById('toastText');
            if (container && textEl) {
                textEl.innerText = msg;
                container.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
                container.classList.add('translate-y-0', 'opacity-100');
                setTimeout(() => {
                    container.classList.remove('translate-y-0', 'opacity-100');
                    container.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
                }, 3500);
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const formattedHours = String(hours).padStart(2, '0');

            const timeString = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
            const clockEl = document.getElementById('clockText');
            if (clockEl) clockEl.innerText = timeString;
        }
        setInterval(updateClock, 1000);

        const router = {
            currentRoute: '/',
            init() { 
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) { 
                window.location.hash = route;
                this.currentRoute = route;
                render(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. HOMEPAGE (Overview)
        function renderLanding() {
            const currentSlide = interactiveSlides[appState.activeSlideTab];
            return `
                <div class="space-y-16 animate-fadeIn py-6">
                    <!-- Hero Header / Professional Call to Action -->
                    <div class="ruby-card p-12 lg:p-24 rounded-[3.5rem] relative overflow-hidden text-center space-y-8 border border-red-500/40 shadow-[0_0_50px_rgba(239,68,68,0.15)]">
                        <div class="absolute -top-32 -right-32 w-96 h-96 bg-red-600/20 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-rose-700/20 rounded-full blur-3xl pointer-events-none"></div>

                        <div class="inline-flex items-center gap-2.5 bg-red-500/15 text-red-300 border border-red-500/40 px-6 py-2.5 rounded-full text-xs font-extrabold uppercase tracking-widest shadow-inner">
                            <span class="w-2.5 h-2.5 rounded-full bg-red-400 animate-pulse"></span> Team Vitality • 60-Day Elite Tech Cohort
                        </div>
                        
                        <h1 class="text-4xl lg:text-7xl font-extrabold tracking-tight text-white leading-[1.1] max-w-5xl mx-auto">
                            Master Code & Build Your <span class="ruby-gradient">60-Day Legacy.</span>
                        </h1>
                        
                        <p class="text-slate-300 text-base lg:text-lg leading-relaxed max-w-3xl mx-auto font-normal">
                            Designed specifically for ambitious engineering students. Turn post-college hours into high-impact GitHub commits, professional verification, and industry proof of work.
                        </p>

                        <!-- Action Buttons including Login/Sign Up options -->
                        <div class="pt-4 flex flex-wrap justify-center items-center gap-5">
                            <button onclick="router.navigateTo('/dashboard')" class="ruby-btn px-10 py-4 rounded-2xl text-sm tracking-wide">
                                Access Dashboard ⚡
                            </button>
                            <button onclick="appState.authMode='signin'; router.navigateTo('/signin');" class="ruby-card text-red-200 font-bold px-9 py-4 rounded-2xl text-sm transition hover:bg-red-500/10 border border-red-500/40">
                                Register / Sign Up ✦
                            </button>
                            <button onclick="appState.authMode='login'; router.navigateTo('/signin');" class="bg-red-500/10 text-red-300 font-bold px-8 py-4 rounded-2xl text-sm transition hover:bg-red-500/20 border border-red-500/20">
                                Existing User Login 🔑
                            </button>
                        </div>
                    </div>

                    <!-- Curriculum / Interactive Slide placed BELOW the sign-in / hero section -->
                    <div class="ruby-card p-8 lg:p-12 rounded-[3.5rem] space-y-8 animate-slide border border-red-500/30" key="${appState.activeSlideTab}">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-red-500/20 pb-6">
                            <div>
                                <span class="text-xs font-extrabold uppercase tracking-widest text-red-400">Curriculum & Roadmap Slider</span>
                                <h2 class="text-2xl font-extrabold text-white mt-1">Explore 60-Day Execution Phases</h2>
                            </div>
                            <!-- Slide Switcher Tabs -->
                            <div class="flex bg-red-950/40 p-1.5 rounded-2xl border border-red-500/30 gap-1">
                                ${interactiveSlides.map((slide, idx) => `
                                    <button onclick="appState.activeSlideTab = ${idx}; render();" class="px-4 py-2 rounded-xl text-xs font-extrabold transition ${appState.activeSlideTab === idx ? 'bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}">
                                        Phase 0${idx + 1}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Active Slide Card Content -->
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-center">
                            <div class="lg:col-span-2 space-y-4">
                                <span class="text-xs font-extrabold uppercase tracking-widest text-red-400 bg-red-500/10 border border-red-500/30 px-3.5 py-1 rounded-full">${currentSlide.tag}</span>
                                <h3 class="text-2xl lg:text-3xl font-extrabold text-white">${currentSlide.title}</h3>
                                <p class="text-slate-300 text-sm sm:text-base leading-relaxed">${currentSlide.desc}</p>
                            </div>
                            <div class="bg-red-950/40 border border-red-500/30 p-6 rounded-3xl space-y-4 text-center">
                                <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Timeline Window</div>
                                <div class="text-2xl font-extrabold text-red-300">${currentSlide.stat}</div>
                                <div class="text-xs font-bold text-white bg-red-500/20 py-2 px-4 rounded-xl border border-red-500/30">${currentSlide.highlight}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Rich Feature Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
                        <div class="ruby-card p-6 rounded-[2.5rem] space-y-3">
                            <div class="w-10 h-10 rounded-xl bg-red-500/20 text-red-300 border border-red-500/30 flex items-center justify-center font-bold text-sm">📊</div>
                            <h3 class="text-base font-extrabold text-white">Deep Analytics</h3>
                            <p class="text-slate-400 text-xs leading-relaxed font-normal">Track commit velocity, language usage, and consistency metrics from zero.</p>
                        </div>
                        <div class="ruby-card p-6 rounded-[2.5rem] space-y-3">
                            <div class="w-10 h-10 rounded-xl bg-red-500/20 text-red-300 border border-red-500/30 flex items-center justify-center font-bold text-sm">📚</div>
                            <h3 class="text-base font-extrabold text-white">Resource Vault</h3>
                            <p class="text-slate-400 text-xs leading-relaxed font-normal">Curated guides on algorithms, system design, and deployment workflows.</p>
                        </div>
                        <div class="ruby-card p-6 rounded-[2.5rem] space-y-3">
                            <div class="w-10 h-10 rounded-xl bg-red-500/20 text-red-300 border border-red-500/30 flex items-center justify-center font-bold text-sm">🛡️</div>
                            <h3 class="text-base font-extrabold text-white">Secure Verification</h3>
                            <p class="text-slate-400 text-xs leading-relaxed font-normal">Automated CAPTCHA & GitHub integration checks.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. STUDENT DASHBOARD (/dashboard)
        function renderDashboard() {
            let daysHtml = '';
            for (let i = 1; i <= 60; i++) {
                const isSelected = appState.selectedCalendarDay === i;
                const isUnlocked = i === 1;
                
                let btnClasses = "p-3 rounded-2xl text-xs font-bold transition flex flex-col items-center justify-center gap-1 border ";
                if (isSelected) {
                    btnClasses += "bg-gradient-to-br from-red-500 to-rose-600 text-white border-red-300 shadow-lg scale-105 z-10 font-extrabold";
                } else if (isUnlocked) {
                    btnClasses += "bg-red-950/60 text-red-300 border-red-500/30 hover:bg-red-900/60";
                } else {
                    btnClasses += "bg-red-950/20 text-slate-600 border-red-900/40 opacity-40 cursor-not-allowed";
                }

                daysHtml += `
                    <button onclick="${isUnlocked ? `selectCalendarDay(${i})` : `showToast('🔒 Day ${i} unlocks after Day 1 completion.')`}" class="${btnClasses}">
                        <span>Day ${i}</span>
                        <span class="text-[9px] ${isSelected ? 'text-white font-extrabold' : (isUnlocked ? 'text-red-400' : 'text-slate-600')}">${i === 1 ? 'Pending' : 'Lock'}</span>
                    </button>
                `;
            }

            const userName = appState.currentUser ? appState.currentUser.name : "Aarav Sharma";
            const avatarSeed = appState.currentUser ? appState.currentUser.avatar : appState.selectedAvatar;

            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto">
                    <!-- Profile Banner with Clickable Avatar -->
                    <div class="ruby-card p-8 rounded-[3rem] flex flex-col sm:flex-row items-center justify-between gap-6">
                        <div class="flex items-center gap-6 text-center sm:text-left">
                            <div onclick="openAvatarModal()" class="relative group cursor-pointer" title="Click to edit avatar">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${avatarSeed}&backgroundColor=ef4444" alt="User Avatar" class="w-20 h-20 rounded-2xl bg-red-500/20 border-2 border-red-400 p-1 group-hover:scale-105 transition shadow-lg shadow-red-500/30">
                                <div class="absolute inset-0 bg-black/50 rounded-2xl opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-[10px] font-extrabold text-white">Edit ✎</div>
                            </div>
                            <div class="space-y-1">
                                <span class="text-[10px] font-bold text-red-400 uppercase tracking-widest">${appState.currentUser ? 'Authenticated Scholar' : 'Guest Scholar (Sign in recommended)'}</span>
                                <h2 class="text-2xl font-extrabold text-white">${userName}</h2>
                                <p class="text-xs text-slate-400 font-medium">${appState.currentUser ? appState.currentUser.email : 'Govind Ballabh Pant University • AI & Full Stack Track'}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="router.navigateTo('/analytics')" class="ruby-card px-5 py-3 rounded-2xl text-xs font-bold text-red-200 hover:bg-red-500/10">
                                View Stats 📊
                            </button>
                            <button onclick="appState.currentUser=null; showToast('Logged out securely.'); router.navigateTo('/');" class="bg-red-500/10 border border-red-500/30 px-4 py-3 rounded-2xl text-xs font-bold text-red-300 hover:bg-red-500/20">
                                Logout ⎋
                            </button>
                        </div>
                    </div>

        // 6. SIGN UP / LOGIN PAGE (/signin)

                    <div class="text-center space-y-2">
                        <span class="text-xs font-bold uppercase tracking-widest text-red-300 bg-red-500/10 border border-red-500/30 px-4 py-1.5 rounded-full">Secure Authentication</span>
                        <h1 class="text-3xl font-extrabold text-white tracking-tight">${isLogin ? 'Login to Your Account' : 'Create Account & Choose Avatar'}</h1>

                    <div class="ruby-card p-8 rounded-[3rem] space-y-6">
                        <!-- Mode Switcher Tabs -->

                                New Registration (Sign Up)
                            </button>
                            <button onclick="appState.authMode='login'; render();" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold transition ${isLogin ? 'bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">
                                Existing User Login

                        ${!isLogin ? `

                                <div class="grid grid-cols-5 gap-3 max-h-48 overflow-y-auto p-2 bg-red-950/20 border border-red-500/20 rounded-2xl">
                                    ${avatarChoices.map(av => `
                                        <div onclick="appState.selectedAvatar='${av.seed}'; render();" class="cursor-pointer flex flex-col items-center p-2 rounded-xl transition border ${appState.selectedAvatar === av.seed ? 'bg-red-500/30 border-red-400 scale-105 shadow-md shadow-red-500/30' : 'border-transparent hover:bg-red-500/10'}">
                                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${av.seed}&backgroundColor=ef4444" alt="${av.name}" class="w-10 h-10 rounded-full bg-red-500/10 p-0.5">
                                            <span class="text-[9px] font-bold text-white mt-1 text-center">${av.name}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="text-center text-xs text-red-300 font-semibold">Selected Persona: <span class="text-white underline">${appState.selectedAvatar}</span></div>
                            </div>
                        ` : ''}

                        <div class="space-y-4">
                            ${!isLogin ? `
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Full Name</label>
                                    <input type="text" id="signInName" placeholder="Enter your name" class="w-full bg-red-950/40 border border-red-500/30 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-red-400">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">College Email / Username</label>
                                <input type="email" id="signInEmail" placeholder="student@university.ac.in" class="w-full bg-red-950/40 border border-red-500/30 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-red-400">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Password / Security Pin</label>

                            </div>
                            <button onclick="handleAuthSubmit()" class="ruby-btn w-full py-4 rounded-2xl text-sm">
                                ${isLogin ? 'Login to Dashboard 🔑' : 'Complete Registration & Start ⚡'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAuthSubmit() {
            const isLogin = appState.authMode === 'login';
            const emailEl = document.getElementById('signInEmail');
            const passEl = document.getElementById('signInPass');
            const nameEl = document.getElementById('signInName');

            if (!emailEl || !passEl || (!isLogin && !nameEl)) {
                showToast('❌ Form validation error.');
                return;
            }

            const emailVal = emailEl.value.trim();
            const passVal = passEl.value.trim();
            const nameVal = !isLogin ? nameEl.value.trim() : (emailVal.split('@')[0] || 'Scholar');

            if (!emailVal || !passVal || (!isLogin && !nameVal)) {
                showToast('Please fill out all required authentication fields.');
                return;
            }

            appState.currentUser = { name: nameVal, email: emailVal, avatar: appState.selectedAvatar };
            showToast(isLogin ? `🔑 Login successful! Welcome back, ${nameVal}.` : `⚡ Registration complete! Welcome, ${nameVal}.`);
            setTimeout(() => router.navigateTo('/dashboard'), 1200);
        }

        // 7. ABOUT US SECTION (/about)
        function renderAbout() {

                            <h3 class="text-2xl font-extrabold text-white">Diksha</h3>
                            <p class="text-xs text-red-400 font-bold uppercase tracking-widest">AI Specialist</p>

        // 8. CONTACT US SECTION (/contact)
        function renderContact() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-3xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-red-300 bg-red-500/10 border border-red-500/30 px-4 py-1.5 rounded-full">Get In Touch</span>
                        <h1 class="text-4xl font-extrabold text-white tracking-tight">Contact Team Vitality</h1>
                        <p class="text-slate-400 text-sm font-medium">Have feedback or inquiries? Send us a message and rate your experience below.</p>
                    </div>

                    <div class="ruby-card p-8 lg:p-12 rounded-[3.5rem] space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Your Name</label>

                        </div>

                        <div>

                                <span onclick="setRating(3)" class="${appState.selectedRating >= 3 ? 'active' : ''}">★</span>

                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Message / Feedback</label>
                            <textarea rows="4" placeholder="How can we assist you?" class="w-full bg-red-950/40 border border-red-500/30 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-red-400 resize-none"></textarea>
                        </div>
                        <button onclick="showToast('⚡ Feedback & ${appState.selectedRating}-Star Rating sent successfully!')" class="ruby-btn w-full py-4 rounded-2xl text-base">
                            Submit Feedback & Rating ⚡
                        </button>
                    </div>
                </div>
            `;
        }

        function setRating(stars) {
            appState.selectedRating = stars;
            render();
        }

        function selectCalendarDay(day) {
            appState.selectedCalendarDay = day;
            render();
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 6) + 2;
            appState.captchaNum2 = Math.floor(Math.random() * 4) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect verification answer. Try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakDays = 1;
            appState.synergyPoints += 50;
            showToast('⚡ Day 1 Verified! Streak ignited & +50 Synergy Points added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const route = router.currentRoute;
            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/1') html = renderDayChallenge();
            else if (route === '/analytics') html = renderAnalytics();
            else if (route === '/resources') html = renderResources();
            else if (route === '/signin') html = renderSignIn();
            else if (route === '/about') html = renderAbout();
            else if (route === '/contact') html = renderContact();
            document.getElementById('app-router').innerHTML = html;

            const authBtn = document.getElementById('nav-auth-btn');
            if (authBtn) {
                if (appState.currentUser) {
                    authBtn.innerText = `👤 ${appState.currentUser.name.split(' ')[0]}`;
                } else {
                    authBtn.innerText = 'Sign In / Login ✦';
                }
            }

            ['/', '/dashboard', '/day/1', '/analytics', '/resources', '/signin', '/about', '/contact'].forEach(r => {
                const btnId = 'nav-' + (r === '/' ? 'home' : (r === '/dashboard' ? 'dashboard' : (r === '/day/1' ? 'day' : (r === '/analytics' ? 'analytics' : (r === '/resources' ? 'resources' : (r === '/about' ? 'about' : 'contact'))))));
                const btn = document.getElementById(btnId);
                if(btn) {
                    if(r === route) {
                        btn.className = 'px-4 py-2 text-xs font-extrabold rounded-xl transition bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-lg shadow-red-500/30';
                    } else {
                        btn.className = 'px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white';
                    }
                }
            });
            updateClock();
        }

        window.addEventListener('DOMContentLoaded', () => { router.init(); });
    </script>
</body>
</html>
