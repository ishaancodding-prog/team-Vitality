<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ABTalks — AI Workspace & 60-Day Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151C;
  --surface:#1A2029;
  --surface-2:#212836;
  --surface-3:#262E3D;
  --border:#2B3444;
  --border-soft:#232B39;
  --text:#EDEFF3;
  --text-dim:#9AA3B5;
  --text-faint:#6B7386;

  --turmeric:#FF9F43;
  --turmeric-strong:#FFB258;
  --turmeric-dim:#54401F;
  --turmeric-ink:#2A2013;

  --green:#34C77B;
  --green-strong:#4EE096;
  --green-dim:#173829;

  --coral:#FB6B6B;
  --coral-dim:#3E2323;

  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;

  --font-display:'Sora', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;

  --shadow-card: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px -12px rgba(0,0,0,0.6);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}
::selection{background:var(--turmeric-dim);color:var(--turmeric-strong);}

a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--turmeric);
  outline-offset:2px;
  border-radius:6px;
}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  padding-bottom:84px;
  background-image:
    radial-gradient(circle at 12% 0%, rgba(255,159,67,0.10), transparent 40%),
    radial-gradient(circle at 90% 8%, rgba(52,199,123,0.07), transparent 35%);
}
@media (min-width:900px){
  #app{ max-width:480px; box-shadow:0 0 0 1px var(--border), 0 40px 100px -30px rgba(0,0,0,0.8); margin:32px auto; min-height:auto; border-radius:28px; overflow:hidden;}
  body{ background: linear-gradient(160deg,#0C0E13,#181C24); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; }
}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px 8px;
}
.brand{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-0.01em; cursor:pointer; }
.brand-mark{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(145deg, var(--turmeric), #E8792B);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:12px; color:#20140A;
}

.eyebrow{
  font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--turmeric); font-weight:600; display:flex; align-items:center; gap:8px;
}
.eyebrow::before{content:"";width:14px;height:1px;background:var(--turmeric);display:inline-block;}
.h1{ font-family:var(--font-display); font-weight:700; font-size:30px; line-height:1.12; letter-spacing:-0.02em; margin:10px 0 0; }
.h3{ font-family:var(--font-display); font-weight:600; font-size:16px; margin:0; }
.p-muted{ color:var(--text-dim); font-size:14.5px; line-height:1.6; margin:0; }
.mono{ font-family:var(--font-mono); }

.card{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:12px; font-weight:600; font-size:15px;
  padding:14px 20px; transition:transform .12s ease, filter .12s ease, background .12s ease;
  width:100%;
}
.btn:active{ transform:scale(0.98); }
.btn-primary{ background:linear-gradient(145deg, var(--turmeric-strong), var(--turmeric)); color:#241705; }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-secondary{ background:var(--surface-3); color:var(--text); border:1px solid var(--border); }
.btn-ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--border); }
.btn-sm{ padding:10px 14px; font-size:13.5px; width:auto; }
.btn[disabled]{ opacity:0.45; cursor:not-allowed; }

.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12px; font-weight:600; padding:5px 10px; border-radius:999px;
  font-family:var(--font-mono);
}
.pill-turmeric{ background:var(--turmeric-dim); color:var(--turmeric-strong); }
.pill-neutral{ background:var(--surface-3); color:var(--text-dim); }

#toast{
  position:fixed; left:50%; bottom:96px; transform:translate(-50%, 20px);
  background:var(--surface-3); border:1px solid var(--border); color:var(--text);
  padding:12px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
  box-shadow:0 12px 30px -8px rgba(0,0,0,0.6);
  opacity:0; pointer-events:none; transition:all .25s cubic-bezier(.2,.9,.3,1.3);
  z-index:400; display:flex; align-items:center; gap:8px; white-space:nowrap;
}
#toast.show{ opacity:1; transform:translate(-50%, 0); }

/* AUTH VIEWS */
.auth-container{ padding:20px 20px 40px; }
.auth-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow-card); margin-top:16px; }
.auth-title{ font-family:var(--font-display); font-size:24px; font-weight:700; margin-bottom:6px; }
.auth-subtitle{ font-size:13.5px; color:var(--text-dim); margin-bottom:20px; }
.auth-switch{ text-align:center; font-size:13px; color:var(--text-dim); margin-top:16px; }
.auth-switch a{ color:var(--turmeric-strong); font-weight:600; text-decoration:underline; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
.field input, .field textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:12px 14px; font-size:13.5px; outline:none;
}

/* DASHBOARD & CHAT WORKSPACE */
.dash-header{ padding:6px 20px 4px; display:flex; align-items:center; justify-content:space-between; }
.greeting{ font-family:var(--font-display); font-weight:700; font-size:19px; }
.greeting-sub{ font-size:12.5px; color:var(--text-faint); margin-top:2px; }
.profile-dot{ width:38px;height:38px;border-radius:50%; background:var(--surface-3); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:14px; }

.ai-workspace{
  margin:16px 20px 0; background:var(--surface); border:1px solid var(--border-soft);
  border-radius:var(--radius-lg); padding:18px; display:flex; flex-direction:column; gap:14px;
  box-shadow:var(--shadow-card);
}
.ai-workspace-head{ display:flex; justify-content:space-between; align-items:center; }
.ai-chat-box{
  background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
  height:240px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px;
}
.ai-msg{ max-width:85%; padding:8px 12px; border-radius:10px; font-size:13px; line-height:1.4; }
.ai-msg.bot{ background:var(--surface-3); align-self:flex-start; color:var(--text); }
.ai-msg.user{ background:var(--turmeric-dim); color:var(--turmeric-strong); align-self:flex-end; font-weight:600; }
.ai-input-row{ display:flex; gap:8px; }
.ai-input-row input{ flex:1; background:var(--surface-3); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-size:13px; outline:none; }
.ai-send{ background:var(--turmeric); border:none; border-radius:10px; padding:0 16px; color:#241705; font-weight:700; }

.bottom-nav{
  position:fixed; left:50%; bottom:0; transform:translateX(-50%);
  width:100%; max-width:480px; background:rgba(26,32,41,0.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--border); display:flex; z-index:250;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:12px 0 10px; font-size:10.5px; color:var(--text-faint); font-weight:600; }
.nav-item.active{ color:var(--turmeric); }
.nav-ic{ font-size:18px; line-height:1; }

.fade-in{ animation:fadeIn .35s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const PLATFORM = { name: "ABTalks", totalDays: 60 };

/* Persistent App State via localStorage */
function getStorageUser() {
  const saved = localStorage.getItem('abtalks_current_user');
  return saved ? JSON.parse(saved) : null;
}

function setStorageUser(user) {
  if(user) localStorage.setItem('abtalks_current_user', JSON.stringify(user));
  else localStorage.removeItem('abtalks_current_user');
}

function getStoredDB() {
  const db = localStorage.getItem('abtalks_db_users');
  return db ? JSON.parse(db) : {};
}

function saveStoredDB(db) {
  localStorage.setItem('abtalks_db_users', JSON.stringify(db));
}

function getStoredChat() {
  const chat = localStorage.getItem('abtalks_chat_history');
  return chat ? JSON.parse(chat) : [
    { sender: 'bot', text: 'Hey there! I am your persistent AI Mentor. Ask me anything about coding, your 60-day challenge, or debugging!' }
  ];
}

function saveStoredChat(history) {
  localStorage.setItem('abtalks_chat_history', JSON.stringify(history));
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 2200);
}
function initials(name){ return (name||"U").trim().charAt(0).toUpperCase(); }

/* VIEWS */
function viewLanding(){
  return `
  <div class="topbar">
    <div class="brand" onclick="location.hash='#/'"><span class="brand-mark">AB</span>${PLATFORM.name}</div>
    <div style="display:flex; gap:8px;">
      <a href="#/login" class="btn btn-ghost btn-sm">Log in</a>
      <a href="#/signup" class="btn btn-primary btn-sm">Sign up</a>
    </div>
  </div>
  <section style="padding:24px 20px;" class="fade-in">
    <div class="eyebrow">Interactive AI Workspace & Challenge Hub</div>
    <h1 class="h1">Build, interact, and save your progress effortlessly.</h1>
    <p class="p-muted" style="margin-top:12px;">Your personal AI companion is built right in to assist your learning journey, maintain streaks, and help you debug in real-time.</p>
    <a href="#/signup" class="btn btn-primary" style="margin-top:20px;">Get Started Free →</a>
  </section>
  `;
}

function viewLogin(){
  return `
  <div class="topbar">
    <div class="brand" onclick="location.hash='#/'"><span class="brand-mark">AB</span>${PLATFORM.name}</div>
    <a href="#/signup" class="btn btn-ghost btn-sm">Sign up</a>
  </div>
  <div class="auth-container fade-in">
    <div class="auth-card">
      <div class="auth-title">Welcome back</div>
      <div class="auth-subtitle">Log in to access your saved workspace and AI chat.</div>
      <form onsubmit="event.preventDefault(); processLogin();">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="login-email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-pass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;">Log In</button>
      </form>
      <div class="auth-switch">Don't have an account? <a href="#/signup">Sign up</a></div>
    </div>
  </div>
  `;
}

function processLogin(){
  const email = document.getElementById('login-email').value.trim();
  const db = getStoredDB();
  if(db[email]){
    setStorageUser(db[email]);
    toast("Successfully logged in!");
    setTimeout(()=> location.hash = '#/dashboard', 600);
  } else {
    toast("Account not found. Please sign up first.");
  }
}

function viewSignup(){
  return `
  <div class="topbar">
    <div class="brand" onclick="location.hash='#/'"><span class="brand-mark">AB</span>${PLATFORM.name}</div>
    <a href="#/login" class="btn btn-ghost btn-sm">Log in</a>
  </div>
  <div class="auth-container fade-in">
    <div class="auth-card">
      <div class="auth-title">Create account</div>
      <div class="auth-subtitle">Your data and chat history will be securely saved.</div>
      <form onsubmit="event.preventDefault(); processSignup();">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="signup-name" placeholder="Aanya Sharma" required />
        </div>
        <div class="field">
          <label>Email address</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signup-pass" placeholder="Create a password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;">Create Account</button>
      </form>
      <div class="auth-switch">Already have an account? <a href="#/login">Log in</a></div>
    </div>
  </div>
  `;
}

function processSignup(){
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const db = getStoredDB();
  
  const newUser = { name, email, streak: 1, currentDay: 1 };
  db[email] = newUser;
  saveStoredDB(db);
  setStorageUser(newUser);

  toast("Account created and saved successfully!");
  setTimeout(()=> location.hash = '#/dashboard', 600);
}

function viewDashboard(){
  const user = getStorageUser() || { name: "Guest User", streak: 0, currentDay: 1 };
  const history = getStoredChat();

  return `
  <div class="topbar">
    <div class="brand" onclick="location.hash='#/'"><span class="brand-mark">AB</span>${PLATFORM.name}</div>
    <button onclick="setStorageUser(null); location.hash='#/';" class="btn btn-ghost btn-sm" style="font-size:12px; padding:6px 10px;">Log out</button>
  </div>

  <div class="dash-header fade-in">
    <div>
      <div class="greeting">Hello, ${user.name} 👋</div>
      <div class="greeting-sub">Your personal AI workspace is active and data is saved.</div>
    </div>
    <div class="profile-dot">${initials(user.name)}</div>
  </div>

  <div class="ai-workspace fade-in">
    <div class="ai-workspace-head">
      <span class="h3">🤖 Persistent AI Assistant</span>
      <span class="pill pill-turmeric">Active</span>
    </div>
    <div class="ai-chat-box" id="ai-chat-box">
      ${history.map(m => `<div class="ai-msg ${m.sender}">${escapeHTML(m.text)}</div>`).join('')}
    </div>
    <div class="ai-input-row">
      <input type="text" id="ai-input" placeholder="Ask AI a question or prompt..." autocomplete="off" />
      <button class="ai-send" onclick="handleSendChat()">Send</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="#/dashboard" class="nav-item active"><span class="nav-ic">◧</span>Workspace</a>
  </nav>
  `;
}

function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, 
    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
  );
}

function handleSendChat(){
  const input = document.getElementById('ai-input');
  const text = input.value.trim();
  if(!text) return;

  const history = getStoredChat();
  history.push({ sender: 'user', text });
  saveStoredChat(history);
  input.value = '';
  renderChatBox();

  setTimeout(() => {
    let reply = "That's a great question! As your persistent assistant, I'm here to help you build and learn.";
    const q = text.toLowerCase();
    if(q.includes('hello') || q.includes('hi')) reply = "Hello! How can I assist you with your projects today?";
    else if(q.includes('streak') || q.includes('day')) reply = "Consistency is key! Keep showing up every single day to grow your streak.";
    else if(q.includes('help')) reply = "I can answer technical queries, give hints, or help organize your study goals.";

    history.push({ sender: 'bot', text: reply });
    saveStoredChat(history);
    renderChatBox();
  }, 500);
}

function renderChatBox(){
  const box = document.getElementById('ai-chat-box');
  if(!box) return;
  const history = getStoredChat();
  box.innerHTML = history.map(m => `<div class="ai-msg ${m.sender}">${escapeHTML(m.text)}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

/* ROUTER */
function parseRoute(){
  const hash = location.hash.replace(/^#/, '') || '/';
  if(hash==='/' ) return {name:'landing'};
  if(hash==='/login') return {name:'login'};
  if(hash==='/signup') return {name:'signup'};
  if(hash==='/dashboard') return {name:'dashboard'};
  return {name:'landing'};
}

function render(){
  const route = parseRoute();
  const app = document.getElementById('app');
  if(route.name==='landing') app.innerHTML = viewLanding();
  else if(route.name==='login') app.innerHTML = viewLogin();
  else if(route.name==='signup') app.innerHTML = viewSignup();
  else if(route.name==='dashboard') {
    if(!getStorageUser()){
      location.hash = '#/login';
      return;
    }
    app.innerHTML = viewDashboard();
    renderChatBox();
    const chatInput = document.getElementById('ai-input');
    if(chatInput) chatInput.addEventListener('keydown', e => { if(e.key==='Enter') handleSendChat(); });
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
