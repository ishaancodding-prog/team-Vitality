<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub (Team Vitality Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        .cyber-card {
            background: rgba(18, 18, 24, 0.95);
            border: 1px solid rgba(0, 255, 157, 0.3);
            box-shadow: 0 0 25px rgba(0, 255, 157, 0.1);
            transition: all 0.3s ease;
        }
        .cyber-card:hover {
            border-color: rgba(0, 255, 157, 0.8);
            box-shadow: 0 0 35px rgba(0, 255, 157, 0.25);
        }
        .cyber-btn {
            background: #00ff9d;
            color: #0b0f19;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
            transition: all 0.2s ease;
        }
        .cyber-btn:hover {
            background: #00cc7d;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.7);
            transform: translateY(-2px);
        }
        .cyber-glow {
            text-shadow: 0 0 15px rgba(0, 255, 157, 0.5);
        }
        .star-rating span {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .star-rating span.active {
            color: #00ff9d;
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.8);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 antialiased selection:bg-[#00ff9d] selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Cyberpunk Ambient Gradients -->
    <div class="fixed top-0 left-1/4 w-[600px] h-[600px] bg-[#00ff9d]/5 rounded-full blur-[150px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[600px] h-[600px] bg-purple-500/5 rounded-full blur-[150px] pointer-events-none"></div>

    <!-- NAVBAR -->
    <header class="border-b border-slate-800 bg-[#0b0f19]/90 backdrop-blur-xl sticky top-0 z-50 px-6 lg:px-16 py-4 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="router.navigateTo('/')">
            <div class="w-11 h-11 rounded-xl bg-[#00ff9d] flex items-center justify-center font-black text-slate-950 text-xl shadow-[0_0_15px_rgba(0,255,157,0.6)] group-hover:scale-105 transition">
                ⚡
            </div>
            <div>
                <span class="font-black tracking-wider text-base text-white">ABTALKS</span>
                <span class="block text-[9px] text-[#00ff9d] font-bold tracking-widest uppercase">Team Vitality</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center gap-1.5 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800">
            <button onclick="router.navigateTo('/')" id="nav-home" class="px-4 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">HOME</button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="px-4 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">DASHBOARD</button>
            <button onclick="router.navigateTo('/day/1')" id="nav-day" class="px-4 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">DAY 1</button>
            <button onclick="router.navigateTo('/about')" id="nav-about" class="px-4 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">ABOUT</button>
            <button onclick="router.navigateTo('/contact')" id="nav-contact" class="px-4 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">CONTACT</button>
        </nav>

        <div class="flex items-center gap-3">
            <div id="liveClock" class="hidden xl:flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl font-mono text-xs text-[#00ff9d] font-bold">
                <span>🕒</span> <span id="clockText">00:00:00</span>
            </div>
            <span class="text-xs bg-[#00ff9d]/10 text-[#00ff9d] border border-[#00ff9d]/30 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-[#00ff9d] animate-pulse"></span> DAY 1 ACTIVE
            </span>
        </div>
    </header>

    <!-- MAIN ROUTER CONTAINER -->
    <main id="app-router" class="flex-grow max-w-7xl mx-auto w-full px-6 lg:px-16 py-10 z-10"></main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 bg-[#0b0f19] py-8 px-6 lg:px-16 z-10 text-xs text-slate-400">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 font-semibold">
            <div>© 2026 ABTalks Ecosystem. Engineered with futuristic precision by Team <span class="text-[#00ff9d]">Vitality</span>.</div>
            <div class="flex gap-6">
                <a href="#/" onclick="router.navigateTo('/')" class="hover:text-[#00ff9d] transition">Home</a>
                <a href="#/dashboard" onclick="router.navigateTo('/dashboard')" class="hover:text-[#00ff9d] transition">Dashboard</a>
                <a href="#/day/1" onclick="router.navigateTo('/day/1')" class="hover:text-[#00ff9d] transition">Day 1</a>
                <a href="#/about" onclick="router.navigateTo('/about')" class="hover:text-[#00ff9d] transition">About Us</a>
                <a href="#/contact" onclick="router.navigateTo('/contact')" class="hover:text-[#00ff9d] transition">Contact</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPT ENGINE -->
    <script>
        const appState = {
            streakDays: 1,
            selectedTrack: 'AI & Full Stack',
            githubLink: '',
            linkedinLink: '',
            isSubmitted: false,
            synergyPoints: 50,
            selectedCalendarDay: 1,
            selectedRating: 5,
            captchaNum1: 4,
            captchaNum2: 2,
            captchaInput: '',
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => { appState.toastMessage = null; render(); }, 3500);
        }

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            const clockEl = document.getElementById('clockText');
            if (clockEl) clockEl.innerText = timeString;
        }
        setInterval(updateClock, 1000);

        const router = {
            currentRoute: '/',
            init() { 
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) { 
                window.location.hash = route;
                this.currentRoute = route;
                render(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. LANDING PAGE (/)
        function renderLanding() {
            return `
                <div class="space-y-16 animate-fadeIn py-6">
                    <div class="cyber-card p-10 lg:p-20 rounded-[2.5rem] relative overflow-hidden text-center space-y-8">
                        <div class="inline-flex items-center gap-2 bg-[#00ff9d]/10 text-[#00ff9d] border border-[#00ff9d]/30 px-4 py-1.5 rounded-xl text-xs font-bold uppercase tracking-wider">
                            ⚡ Team Vitality • Day 1 Challenge Kickoff
                        </div>
                        
                        <h1 class="text-4xl lg:text-7xl font-black tracking-tight text-white leading-tight max-w-4xl mx-auto">
                            CODE WITHOUT LIMITS.<br>OWN YOUR <span class="text-[#00ff9d] cyber-glow">60-DAY STREAK.</span>
                        </h1>
                        
                        <p class="text-slate-400 text-base lg:text-lg leading-relaxed max-w-2xl mx-auto font-medium">
                            Transform post-college hours into high-impact GitHub commits and LinkedIn proof of work. Built for Indian college students striving for top tech roles.
                        </p>

                        <div class="pt-4 flex flex-wrap justify-center items-center gap-4">
                            <button onclick="router.navigateTo('/dashboard')" class="cyber-btn px-8 py-4 rounded-xl text-sm">
                                IGNITE DASHBOARD 🚀
                            </button>
                            <button onclick="router.navigateTo('/day/1')" class="bg-slate-900 border border-slate-700 text-white font-bold px-8 py-4 rounded-xl text-sm hover:border-[#00ff9d] transition">
                                VIEW CHALLENGE DAY 1 ⚡
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4">
                        <div class="cyber-card p-8 rounded-[2rem] space-y-4">
                            <div class="w-12 h-12 rounded-xl bg-[#00ff9d]/10 text-[#00ff9d] border border-[#00ff9d]/30 flex items-center justify-center font-bold text-lg">01</div>
                            <h3 class="text-lg font-bold text-white">Pick Your Track</h3>
                            <p class="text-slate-400 text-xs sm:text-sm leading-relaxed">Select AI & Full Stack development tailored for real-world engineering careers.</p>
                        </div>
                        <div class="cyber-card p-8 rounded-[2rem] space-y-4">
                            <div class="w-12 h-12 rounded-xl bg-[#00ff9d]/10 text-[#00ff9d] border border-[#00ff9d]/30 flex items-center justify-center font-bold text-lg">02</div>
                            <h3 class="text-lg font-bold text-white">Build & Commit Daily</h3>
                            <p class="text-slate-400 text-xs sm:text-sm leading-relaxed">Push code updates to your public GitHub repository and share proof on LinkedIn.</p>
                        </div>
                        <div class="cyber-card p-8 rounded-[2rem] space-y-4">
                            <div class="w-12 h-12 rounded-xl bg-[#00ff9d]/10 text-[#00ff9d] border border-[#00ff9d]/30 flex items-center justify-center font-bold text-lg">03</div>
                            <h3 class="text-lg font-bold text-white">Gain Visibility</h3>
                            <p class="text-slate-400 text-xs sm:text-sm leading-relaxed">Build compounding consistency and become directly visible to top recruiters.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. STUDENT DASHBOARD (/dashboard)
        function renderDashboard() {
            let daysHtml = '';
            for (let i = 1; i <= 60; i++) {
                const isSelected = appState.selectedCalendarDay === i;
                const isUnlocked = i === 1;
                
                let btnClasses = "p-3 rounded-xl text-xs font-bold transition flex flex-col items-center justify-center gap-1 border ";
                if (isSelected) {
                    btnClasses += "bg-[#00ff9d] text-slate-950 border-[#00ff9d] shadow-[0_0_15px_rgba(0,255,157,0.5)] scale-105 z-10 font-black";
                } else if (isUnlocked) {
                    btnClasses += "bg-slate-900 text-[#00ff9d] border-slate-700 hover:border-[#00ff9d]";
                } else {
                    btnClasses += "bg-slate-950 text-slate-600 border-slate-900 opacity-40 cursor-not-allowed";
                }

                daysHtml += `
                    <button onclick="${isUnlocked ? `selectCalendarDay(${i})` : `showToast('🔒 Day ${i} unlocks after Day 1 completion!')`}" class="${btnClasses}">
                        <span>Day ${i}</span>
                        <span class="text-[9px] ${isSelected ? 'text-slate-950 font-black' : (isUnlocked ? 'text-[#00ff9d]' : 'text-slate-600')}">${i === 1 ? 'Pending' : 'Lock'}</span>
                    </button>
                `;
            }

            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto">
                    <div class="bg-amber-500/10 border border-amber-500/30 p-6 rounded-[2rem] flex items-center gap-5 backdrop-blur-xl">
                        <span class="text-4xl">🌱</span>
                        <div>
                            <h4 class="text-sm font-bold text-amber-400 uppercase tracking-wide">Day 1 - Active Challenge Started</h4>
                            <p class="text-xs text-slate-300 mt-1 font-medium">Your 60-day journey begins today. Complete your Day 1 submission to ignite your streak!</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="cyber-card p-7 rounded-[2rem]">
                            <span class="text-xs uppercase font-bold text-[#00ff9d] tracking-wider">Current Streak</span>
                            <div class="text-4xl font-black text-white mt-2">${appState.streakDays} <span class="text-lg font-normal text-slate-400">Day 🔥</span></div>
                        </div>
                        <div class="cyber-card p-7 rounded-[2rem]">
                            <span class="text-xs uppercase font-bold text-purple-400 tracking-wider">Challenge Progress</span>
                            <div class="text-4xl font-black text-white mt-2">1.6%</div>
                        </div>
                        <div class="cyber-card p-7 rounded-[2rem]">
                            <span class="text-xs uppercase font-bold text-emerald-400 tracking-wider">Synergy Points</span>
                            <div class="text-4xl font-black text-emerald-400 mt-2">${appState.synergyPoints} SP</div>
                        </div>
                    </div>

                    <div class="cyber-card p-8 rounded-[2.5rem] space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h3 class="text-xl font-bold text-white tracking-tight">60-Day Challenge Calendar</h3>
                                <p class="text-xs text-slate-400 font-medium">Click any unlocked day to inspect completed work and logs.</p>
                            </div>
                            <span class="text-xs bg-[#00ff9d]/10 text-[#00ff9d] border border-[#00ff9d]/30 px-3.5 py-1.5 rounded-full font-bold">Selected: Day ${appState.selectedCalendarDay}</span>
                        </div>

                        <div class="grid grid-cols-5 sm:grid-cols-10 gap-3 max-h-72 overflow-y-auto pr-2">
                            ${daysHtml}
                        </div>
                    </div>

                    <div class="cyber-card p-8 rounded-[2.5rem] border border-[#00ff9d]/40 space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-[#00ff9d] uppercase tracking-widest bg-[#00ff9d]/10 px-3.5 py-1 rounded-full border border-[#00ff9d]/30">Day 1 Focus • Setup & Hello World</span>
                            <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3.5 py-1 rounded-full font-bold">In Progress</span>
                        </div>
                        <h4 class="text-xl font-bold text-white">Environment Setup & Core Architecture Initialization</h4>
                        <p class="text-slate-300 text-sm leading-relaxed font-medium">
                            Initialize your public GitHub repository, configure your development environment, and deploy your initial Day 1 proof of work.
                        </p>
                        <div class="pt-2">
                            <button onclick="router.navigateTo('/day/1')" class="cyber-btn px-6 py-3 rounded-xl text-xs">
                                Open Day 1 Submission Portal →
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 3. CHALLENGE DAY VIEW (/day/1)
        function renderDayChallenge() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-sm text-slate-400 hover:text-white font-bold flex items-center gap-2">← Back to Dashboard</button>
                        <span class="text-xs font-bold text-[#00ff9d] bg-[#00ff9d]/10 border border-[#00ff9d]/30 px-4 py-1.5 rounded-full">Day 1 of 60 Challenge</span>
                    </div>

                    <div class="space-y-3">
                        <h1 class="text-3xl lg:text-5xl font-black text-white tracking-tight">Environment Setup & Hello World</h1>
                        <p class="text-base text-slate-300 leading-relaxed font-medium">Initialize your public GitHub repository, configure your development environment, and publish your initial proof of work to kick off your streak.</p>
                    </div>

                    <div class="cyber-card p-8 lg:p-10 rounded-[2.5rem] space-y-6">
                        <h3 class="text-lg font-bold text-white flex items-center justify-between">
                            <span>🚀 Submit Day 1 Proof of Work</span>
                            ${appState.isSubmitted ? '<span class="text-xs text-emerald-400 font-bold bg-emerald-500/10 px-3.5 py-1 rounded-full border border-emerald-500/30">Verified ✓</span>' : '<span class="text-xs text-amber-400 font-bold bg-amber-500/10 px-3.5 py-1 rounded-full border border-amber-500/30">Pending</span>'}
                        </h3>

                        <div class="space-y-5">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" placeholder="https://github.com/username/repo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#00ff9d]">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#00ff9d]">
                            </div>
                            
                            <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs uppercase font-bold text-slate-300">Security Math Verification</span>
                                    <button onclick="refreshCaptcha()" class="text-xs text-[#00ff9d] hover:underline font-bold">Generate New Code 🔄</button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="bg-slate-900 border border-slate-700 px-5 py-3 rounded-xl text-base font-mono font-bold text-[#00ff9d]">
                                        ${appState.captchaNum1} + ${appState.captchaNum2} = ?
                                    </div>
                                    <input type="number" id="captchaInput" value="${appState.captchaInput}" oninput="appState.captchaInput=this.value" placeholder="Enter answer" class="w-40 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#00ff9d]">
                                </div>
                            </div>
                        </div>

                        <button onclick="handleSubmission()" class="cyber-btn w-full py-4 rounded-xl text-base">
                            VERIFY & SUBMIT DAY 1 PROOF (+50 SP) ⚡
                        </button>
                    </div>
                </div>
            `;
        }

        // 4. ABOUT US SECTION (/about)
        function renderAbout() {
            return `
                <div class="space-y-12 animate-fadeIn max-w-5xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-[#00ff9d] bg-[#00ff9d]/10 border border-[#00ff9d]/30 px-4 py-1.5 rounded-full">About Us • Team Vitality</span>
                        <h1 class="text-4xl lg:text-5xl font-black text-white tracking-tight">Meet Our Core Team</h1>
                        <p class="text-slate-400 text-base max-w-2xl mx-auto font-medium">The dedicated creators behind the architecture, design, and intelligence of ABTalks.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pt-4">
                        <div class="cyber-card p-8 rounded-[2.5rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-purple-500/10 border border-purple-500/30 text-purple-400 flex items-center justify-center font-bold text-2xl mx-auto">🎨</div>
                            <h3 class="text-2xl font-bold text-white">Mahima</h3>
                            <p class="text-xs text-purple-400 font-bold uppercase tracking-widest">Designer</p>
                            <p class="text-slate-400 text-xs font-medium">Crafted intuitive layouts, visual aesthetics, and responsive user experiences.</p>
                        </div>

                        <div class="cyber-card p-8 rounded-[2.5rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-blue-500/10 border border-blue-500/30 text-blue-400 flex items-center justify-center font-bold text-2xl mx-auto">🤖</div>
                            <h3 class="text-2xl font-bold text-white">Diksha</h3>
                            <p class="text-xs text-blue-400 font-bold uppercase tracking-widest">AI Engineer</p>
                            <p class="text-slate-400 text-xs font-medium">Engineered intelligent workflows and cutting-edge assistance mechanics.</p>
                        </div>

                        <div class="cyber-card p-8 rounded-[2.5rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-[#00ff9d]/10 border border-[#00ff9d]/30 text-[#00ff9d] flex items-center justify-center font-bold text-2xl mx-auto">💻</div>
                            <h3 class="text-2xl font-bold text-white">Ishaan</h3>
                            <p class="text-xs text-[#00ff9d] font-bold uppercase tracking-widest">Frontend & Backend Developer</p>
                            <p class="text-slate-400 text-xs font-medium">Developed full-stack architecture, routing mechanics, and application logic.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. CONTACT US SECTION (/contact)
        function renderContact() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-3xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-[#00ff9d] bg-[#00ff9d]/10 border border-[#00ff9d]/30 px-4 py-1.5 rounded-full">Get In Touch</span>
                        <h1 class="text-4xl font-black text-white tracking-tight">Contact Team Vitality</h1>
                        <p class="text-slate-400 text-sm font-medium">Have feedback or questions? Drop us a message and rate your experience below.</p>
                    </div>

                    <div class="cyber-card p-8 lg:p-10 rounded-[2.5rem] space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Your Name</label>
                                <input type="text" placeholder="Enter your name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#00ff9d]">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Email Address</label>
                                <input type="email" placeholder="student@college.edu" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#00ff9d]">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Platform Experience Rating</label>
                            <div class="star-rating flex gap-3 text-3xl text-slate-600" id="starRatingContainer">
                                <span onclick="setRating(1)" class="${appState.selectedRating >= 1 ? 'active' : ''}">★</span>
                                <span onclick="setRating(2)" class="${appState.selectedRating >= 2 ? 'active' : ''}">★</span>
                                <span onclick="setRating(3)" class="${appState.selectedRating >= 3 ? 'active' : ''}">★</span>
                                <span onclick="setRating(4)" class="${appState.selectedRating >= 4 ? 'active' : ''}">★</span>
                                <span onclick="setRating(5)" class="${appState.selectedRating >= 5 ? 'active' : ''}">★</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Message / Feedback</label>
                            <textarea rows="4" placeholder="How can we help you?" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-[#00ff9d] resize-none"></textarea>
                        </div>
                        <button onclick="showToast('✅ Feedback & ${appState.selectedRating}-Star Rating sent successfully!')" class="cyber-btn w-full py-4 rounded-xl text-sm">
                            SUBMIT FEEDBACK & RATING ⭐
                        </button>
                    </div>
                </div>
            `;
        }

        function setRating(stars) {
            appState.selectedRating = stars;
            render();
        }

        function selectCalendarDay(day) {
            appState.selectedCalendarDay = day;
            render();
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 6) + 1;
            appState.captchaNum2 = Math.floor(Math.random() * 4) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect CAPTCHA answer. Try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakDays = 1;
            appState.synergyPoints += 50;
            showToast('🎉 Day 1 Verified! Streak ignited & +50 Synergy Points added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const route = router.currentRoute;
            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/1') html = renderDayChallenge();
            else if (route === '/about') html = renderAbout();
            else if (route === '/contact') html = renderContact();
            document.getElementById('app-router').innerHTML = html;

            ['/', '/dashboard', '/day/1', '/about', '/contact'].forEach(r => {
                const btnId = 'nav-' + (r === '/' ? 'home' : (r === '/dashboard' ? 'dashboard' : (r === '/day/1' ? 'day' : (r === '/about' ? 'about' : 'contact'))));
                const btn = document.getElementById(btnId);
                if(btn) {
                    if(r === route) {
                        btn.className = 'px-4 py-2 text-xs font-bold rounded-lg transition bg-[#00ff9d] text-slate-950 shadow-[0_0_10px_rgba(0,255,157,0.5)]';
                    } else {
                        btn.className = 'px-4 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white';
                    }
                }
            });
            updateClock();
        }

        window.addEventListener('DOMContentLoaded', () => { router.init(); });
    </script>
</body>
</html>
