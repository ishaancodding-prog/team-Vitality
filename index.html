<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub (Desktop Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card-hover:hover { border-color: rgba(6, 182, 212, 0.3); transform: translateY(-2px); transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Glowing Aesthetic Background Accents -->
    <div class="fixed top-0 left-1/4 w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- DESKTOP / LAPTOP NAVBAR -->
    <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-50 px-10 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigateTo('/')">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center font-bold text-slate-950 text-lg shadow-lg shadow-cyan-500/20">AB</div>
            <div>
                <span class="font-extrabold tracking-wider text-base bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">ABTALKS</span>
                <span class="block text-[10px] text-cyan-400 font-semibold tracking-widest uppercase">Desktop Workstation</span>
            </div>
        </div>

        <nav class="flex items-center gap-8">
            <button onclick="router.navigateTo('/')" id="nav-home" class="text-sm font-semibold transition text-slate-400 hover:text-white flex items-center gap-2">
                🏠 Home
            </button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="text-sm font-semibold transition text-slate-400 hover:text-white flex items-center gap-2">
                📊 Dashboard
            </button>
            <button onclick="router.navigateTo('/day/12')" id="nav-day" class="text-sm font-semibold transition text-slate-400 hover:text-white flex items-center gap-2">
                ⚡ Day 12 Challenge
            </button>
            <div class="h-5 w-px bg-slate-800"></div>
            <span class="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3.5 py-1.5 rounded-full font-bold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> India Cohort 2026
            </span>
        </nav>
    </header>

    <!-- MAIN ROUTER CONTAINER (Optimized for Laptop Viewports) -->
    <main id="app-router" class="flex-grow max-w-7xl mx-auto w-full px-8 py-10 z-10">
        <!-- Dynamically injected views go here -->
    </main>

    <!-- LAPTOP FOOTER -->
    <footer class="border-t border-slate-900 bg-slate-950 py-6 px-10 text-center text-xs text-slate-500 flex justify-between items-center z-10">
        <div>© 2026 ABTalks Ecosystem. All rights reserved.</div>
        <div class="flex gap-6">
            <a href="https://abtalks.in" target="_blank" class="hover:text-cyan-400 transition">Official Platform</a>
            <a href="https://www.youtube.com/live/Tl7kFB_DXYc" target="_blank" class="hover:text-cyan-400 transition">ViCodathon Stream</a>
            <a href="https://github.com" target="_blank" class="hover:text-cyan-400 transition">GitHub Organization</a>
        </div>
    </footer>

    <!-- JAVASCRIPT APP & DESKTOP ROUTER -->
    <script>
        const appState = {
            streakState: 'active', // 'active', 'zero', 'missed'
            selectedTrack: 'AI & Full Stack',
            githubLink: 'https://github.com/ishaancodding-prog/ai-agent',
            linkedinLink: 'https://linkedin.com/posts/ishaancodding_aicoding',
            isSubmitted: false,
            synergyPoints: 450,
            activeTab: 'tasks',
            captchaNum1: Math.floor(Math.random() * 8) + 2,
            captchaNum2: Math.floor(Math.random() * 8) + 1,
            captchaInput: '',
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => {
                appState.toastMessage = null;
                render();
            }, 3000);
        }

        const router = {
            currentRoute: '/',
            init() {
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) {
                window.location.hash = route;
                this.currentRoute = route;
                render();
                window.scrollTo(0, 0);
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. LANDING PAGE VIEW (/)
        function renderLanding() {
            return `
                <div class="space-y-10 animate-fadeIn">
                    <!-- Hero Section with Split Desktop Layout -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                        <div class="lg:col-span-7 space-y-6">
                            <div class="inline-flex items-center gap-2 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3.5 py-1.5 rounded-full text-xs font-bold">
                                🚀 60-Day Engineering Challenge for Indian College Students
                            </div>
                            <h1 class="text-4xl lg:text-6xl font-extrabold tracking-tight text-white leading-tight">
                                Build every day.<br>Get noticed by <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">top recruiters.</span>
                            </h1>
                            <p class="text-slate-400 text-base lg:text-lg leading-relaxed max-w-2xl">
                                Code post-college, build real applications, commit to public GitHub repos, and share your daily proof of work on LinkedIn to build an unignorable professional streak.
                            </p>
                            
                            <!-- Track Selector Card -->
                            <div class="glass-card p-5 rounded-3xl space-y-3 max-w-xl">
                                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Select Your Learning Track</h3>
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="setTrack('AI & Full Stack')" class="p-3.5 rounded-2xl text-sm font-semibold border text-left transition ${appState.selectedTrack === 'AI & Full Stack' ? 'bg-cyan-500/15 border-cyan-500 text-cyan-300 shadow-lg shadow-cyan-500/10' : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:text-white'}">
                                        🤖 AI & Full Stack
                                    </button>
                                    <button onclick="setTrack('Cloud & DevOps')" class="p-3.5 rounded-2xl text-sm font-semibold border text-left transition ${appState.selectedTrack === 'Cloud & DevOps' ? 'bg-cyan-500/15 border-cyan-500 text-cyan-300 shadow-lg shadow-cyan-500/10' : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:text-white'}">
                                        ☁️ Cloud & DevOps
                                    </button>
                                </div>
                            </div>

                            <div class="pt-2 flex items-center gap-4">
                                <button onclick="router.navigateTo('/dashboard')" class="bg-gradient-to-r from-cyan-500 to-indigo-500 hover:opacity-95 text-slate-950 font-extrabold px-8 py-4 rounded-2xl text-base transition shadow-xl shadow-cyan-500/25 flex items-center gap-3">
                                    <span>Start 60-Day Journey (${appState.selectedTrack})</span>
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                        </div>

                        <!-- Right Hero Image Showcase -->
                        <div class="lg:col-span-5">
                            <div class="relative rounded-3xl overflow-hidden border border-slate-800 shadow-2xl group">
                                <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1000&q=80" alt="Coding Workspace" class="w-full h-[400px] object-cover opacity-70 group-hover:scale-105 transition duration-700">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                                <div class="absolute bottom-6 left-6 right-6 space-y-2">
                                    <span class="text-xs font-extrabold uppercase tracking-widest text-cyan-400">Hostel & Dorm Optimized</span>
                                    <h3 class="text-xl font-bold text-white">Built for high consistency & zero friction</h3>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Trust Metrics Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6">
                        <div class="glass-card p-6 rounded-3xl flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 font-bold text-xl">🏆</div>
                            <div>
                                <div class="text-2xl font-extrabold text-white">25+ Placements</div>
                                <div class="text-xs text-slate-400 mt-0.5">Students secured roles via ABTalks network</div>
                            </div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 font-bold text-xl">👥</div>
                            <div>
                                <div class="text-2xl font-extrabold text-white">10,000+ Active</div>
                                <div class="text-xs text-slate-400 mt-0.5">Learners across 20+ countries</div>
                            </div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold text-xl">🌙</div>
                            <div>
                                <div class="text-2xl font-extrabold text-white">Late-Night Mode</div>
                                <div class="text-xs text-slate-400 mt-0.5">Optimized for post-college dorm sessions</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. STUDENT DASHBOARD VIEW (/dashboard)
        function renderDashboard() {
            let streakBanner = '';
            if (appState.streakState === 'zero') {
                streakBanner = `<div class="bg-amber-500/10 border border-amber-500/30 p-5 rounded-3xl flex items-center gap-4 backdrop-blur-md">
                    <span class="text-3xl">🌱</span>
                    <div>
                        <h4 class="text-sm font-bold text-amber-400 uppercase">Day 1 - Fresh Start</h4>
                        <p class="text-xs text-slate-300 mt-0.5">Complete today's task to ignite your 60-day public streak!</p>
                    </div>
                </div>`;
            } else if (appState.streakState === 'missed') {
                streakBanner = `<div class="bg-red-500/10 border border-red-500/30 p-5 rounded-3xl flex items-center gap-4 backdrop-blur-md">
                    <span class="text-3xl">⚠️</span>
                    <div>
                        <h4 class="text-sm font-bold text-red-400 uppercase">Streak Frozen</h4>
                        <p class="text-xs text-slate-300 mt-0.5">You missed yesterday's deadline. Submit Day 12 to revive instantly!</p>
                    </div>
                </div>`;
            }

            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto">
                    <!-- Dashboard Header -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 glass-card p-6 rounded-3xl">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl ring-2 ring-cyan-500/50 p-1 bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center font-bold text-slate-950 text-xl">IT</div>
                            <div>
                                <h2 class="font-extrabold text-xl text-white">Ishaan Thusoo</h2>
                                <p class="text-xs text-cyan-400 font-semibold tracking-wide">Track: ${appState.selectedTrack}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="toggleStreakState()" class="text-xs glass-card text-slate-300 px-4 py-2.5 rounded-xl hover:text-white transition flex items-center gap-2">
                                🔄 Toggle State: <strong class="text-cyan-400 uppercase">${appState.streakState}</strong>
                            </button>
                        </div>
                    </div>

                    ${streakBanner}

                    <!-- Metrics Overview Row -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass-card p-6 rounded-3xl relative overflow-hidden">
                            <span class="text-xs uppercase font-bold text-cyan-400 tracking-wider">Current Streak</span>
                            <div class="text-4xl font-extrabold text-white mt-2">${appState.streakState === 'zero' ? '0' : '11'} <span class="text-lg font-normal text-slate-400">Days 🔥</span></div>
                            <div class="text-xs text-slate-500 mt-2">Personal Best: 11 Days</div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl">
                            <span class="text-xs uppercase font-bold text-indigo-400 tracking-wider">Challenge Progress</span>
                            <div class="text-4xl font-extrabold text-white mt-2">18.3%</div>
                            <div class="w-full bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
                                <div class="bg-indigo-500 h-full w-[18.3%]"></div>
                            </div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl">
                            <span class="text-xs uppercase font-bold text-emerald-400 tracking-wider">Synergy Points</span>
                            <div class="text-4xl font-extrabold text-emerald-400 mt-2">${appState.synergyPoints} SP</div>
                            <div class="text-xs text-slate-500 mt-2">Redeemable for mock interviews</div>
                        </div>
                    </div>

                    <!-- Interactive Dashboard Tabs -->
                    <div class="glass-card p-2 rounded-2xl flex gap-2">
                        <button onclick="setDashboardTab('tasks')" class="flex-1 py-3 text-sm font-bold rounded-xl transition ${appState.activeTab === 'tasks' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}">📋 Today's Task</button>
                        <button onclick="setDashboardTab('leaderboard')" class="flex-1 py-3 text-sm font-bold rounded-xl transition ${appState.activeTab === 'leaderboard' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}">🏆 Cohort Leaderboard</button>
                        <button onclick="setDashboardTab('resources')" class="flex-1 py-3 text-sm font-bold rounded-xl transition ${appState.activeTab === 'resources' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}">📚 Peer Resources</button>
                    </div>

                    ${renderTabContent()}

                    <!-- 60-Day Full Roadmap Grid -->
                    <div class="glass-card p-8 rounded-3xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h4 class="text-sm font-bold text-slate-300 uppercase tracking-wider">60-Day Complete Roadmap</h4>
                            <span class="text-xs text-cyan-400 font-bold">12 / 60 Completed</span>
                        </div>
                        <div class="grid grid-cols-12 md:grid-cols-20 gap-2.5 pt-2">
                            ${generateRoadmapGrid()}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTabContent() {
            if (appState.activeTab === 'tasks') {
                return `
                    <div class="relative rounded-3xl overflow-hidden border border-cyan-500/35 shadow-2xl p-8 space-y-6">
                        <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-950 to-indigo-950/40 -z-10"></div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Active Task • Day 12 of 60</span>
                            <span class="text-xs ${appState.isSubmitted ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'} border px-4 py-1.5 rounded-full font-bold">
                                ${appState.isSubmitted ? 'Completed ✓' : 'Pending Verification'}
                            </span>
                        </div>
                        <div class="space-y-2">
                            <h3 class="font-extrabold text-2xl text-white">AI Interview Screening Agent</h3>
                            <p class="text-slate-300 text-base max-w-3xl leading-relaxed">Build an LLM-backed candidate screening module with structured output JSON parsing. Designed to filter resumes and score qualifications automatically.</p>
                        </div>
                        <button onclick="router.navigateTo('/day/12')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold px-8 py-3.5 rounded-2xl text-sm transition flex items-center gap-3 shadow-xl shadow-cyan-500/20">
                            <span>Open Submission Portal</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                `;
            } else if (appState.activeTab === 'leaderboard') {
                return `
                    <div class="glass-card p-6 rounded-3xl space-y-4 animate-fadeIn">
                        <h4 class="text-sm font-bold text-slate-300 uppercase">Top Cohort Performers</h4>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                                <span class="font-bold text-white text-base">1. Priyanshu Sharma</span>
                                <span class="text-cyan-400 font-extrabold">12 Days Streak 🔥 (1250 SP)</span>
                            </div>
                            <div class="flex justify-between items-center bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                                <span class="font-bold text-white text-base">2. Ananya Verma</span>
                                <span class="text-cyan-400 font-extrabold">12 Days Streak 🔥 (1190 SP)</span>
                            </div>
                            <div class="flex justify-between items-center bg-cyan-500/10 p-4 rounded-2xl border border-cyan-500/30">
                                <span class="font-bold text-cyan-300 text-base">12. Ishaan Thusoo (You)</span>
                                <span class="text-cyan-400 font-extrabold">11 Days Streak 🔥 (${appState.synergyPoints} SP)</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="glass-card p-6 rounded-3xl space-y-4 animate-fadeIn">
                        <h4 class="text-sm font-bold text-slate-300 uppercase">Dorm & Peer Study Materials</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <a href="https://www.youtube.com/live/Tl7kFB_DXYc" target="_blank" class="block bg-slate-900/90 p-5 rounded-2xl border border-slate-800 hover:border-cyan-500 transition space-y-2">
                                <div class="font-extrabold text-cyan-400 text-base">📺 ViCodathon Kickoff Recording</div>
                                <div class="text-xs text-slate-400 leading-relaxed">Master winning strategies, common mistakes to avoid, and rules breakdown from Anil Bajpai.</div>
                            </a>
                            <a href="https://abtalks.in" target="_blank" class="block bg-slate-900/90 p-5 rounded-2xl border border-slate-800 hover:border-cyan-500 transition space-y-2">
                                <div class="font-extrabold text-indigo-400 text-base">🔗 Official ABTalks Portal</div>
                                <div class="text-xs text-slate-400 leading-relaxed">Access the main platform dashboard, challenges, and direct recruiter placement programs.</div>
                            </a>
                        </div>
                    </div>
                `;
            }
        }

        // 3. CHALLENGE DAY VIEW (/day/12) WITH CAPTCHA
        function renderDayChallenge() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-sm text-slate-400 hover:text-white flex items-center gap-2 font-semibold">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                            Back to Dashboard
                        </button>
                        <span class="text-xs font-extrabold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-4 py-1.5 rounded-full">Day 12 of 60 Challenge</span>
                    </div>

                    <div class="space-y-3">
                        <h1 class="text-3xl lg:text-5xl font-extrabold text-white">AI Interview Screening Agent</h1>
                        <p class="text-base text-slate-300 leading-relaxed max-w-3xl">
                            Create a responsive web component that takes a job description and candidate resume text, queries an LLM endpoint, and outputs a formatted JSON screening score.
                        </p>
                    </div>

                    <div class="glass-card p-6 rounded-3xl space-y-3">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Strict Acceptance Criteria</h3>
                        <ul class="space-y-3 text-sm text-slate-300">
                            <li class="flex items-center gap-3">
                                <span class="w-6 h-6 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs font-bold shrink-0">✓</span>
                                Public GitHub repository created after 7:00 PM kickoff timestamp.
                            </li>
                            <li class="flex items-center gap-3">
                                <span class="w-6 h-6 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs font-bold shrink-0">✓</span>
                                Minimum 2 functional commits pushed with professional commit naming.
                            </li>
                            <li class="flex items-center gap-3">
                                <span class="w-6 h-6 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs font-bold shrink-0">✓</span>
                                Share progress update on LinkedIn tagging ABTalks cohort network.
                            </li>
                        </ul>
                    </div>

                    <!-- Proof of Work Submission Form with CAPTCHA -->
                    <div class="glass-card p-8 rounded-3xl space-y-6 shadow-2xl">
                        <h3 class="text-lg font-extrabold text-white flex items-center justify-between">
                            <span>🚀 Submit Proof of Work</span>
                            ${appState.isSubmitted ? '<span class="text-xs text-emerald-400 font-bold bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">Successfully Verified ✓</span>' : ''}
                        </h3>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" placeholder="https://github.com/username/repo" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            
                            <!-- Security CAPTCHA Verification Box -->
                            <div class="bg-slate-950/90 border border-slate-800 p-5 rounded-2xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs uppercase font-extrabold text-slate-300">Security Math Verification</span>
                                    <button onclick="refreshCaptcha()" class="text-xs text-cyan-400 hover:underline font-semibold">Generate New Code 🔄</button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="bg-slate-900 border border-slate-700 px-5 py-3 rounded-xl text-base font-mono font-extrabold text-cyan-300 tracking-wider">
                                        ${appState.captchaNum1} + ${appState.captchaNum2} = ?
                                    </div>
                                    <input type="number" id="captchaInput" value="${appState.captchaInput}" oninput="appState.captchaInput=this.value" placeholder="Enter answer" class="w-40 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                            </div>
                        </div>

                        <button onclick="handleSubmission()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-4 rounded-2xl text-base transition shadow-xl shadow-cyan-500/25 flex items-center justify-center gap-2">
                            <span>Verify & Submit Proof (+50 Synergy Points)</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function generateRoadmapGrid() {
            let html = '';
            for (let i = 1; i <= 60; i++) {
                let bg = 'bg-slate-900 border-slate-800 text-slate-600';
                if (i < 12) bg = 'bg-cyan-500 text-slate-950 font-bold border-cyan-400 shadow-sm shadow-cyan-500/20';
                else if (i === 12) bg = 'bg-indigo-500 text-white font-bold border-indigo-400 animate-pulse';
                html += `<div class="aspect-square rounded-xl border ${bg} flex items-center justify-center text-xs font-semibold">${i}</div>`;
            }
            return html;
        }

        function setTrack(track) {
            appState.selectedTrack = track;
            render();
            showToast(`Track set to: ${track}`);
        }

        function setDashboardTab(tab) {
            appState.activeTab = tab;
            render();
        }

        function toggleStreakState() {
            if (appState.streakState === 'active') appState.streakState = 'zero';
            else if (appState.streakState === 'zero') appState.streakState = 'missed';
            else appState.streakState = 'active';
            render();
            showToast(`Edge-case state switched to: ${appState.streakState}`);
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 8) + 2;
            appState.captchaNum2 = Math.floor(Math.random() * 8) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect CAPTCHA answer. Please try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakState = 'active';
            appState.synergyPoints += 50;
            showToast('🎉 Verified! CAPTCHA passed & +50 Synergy Points added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const route = router.currentRoute;

            // Highlight Desktop Navigation Links
            ['/', '/dashboard', '/day/12'].forEach(r => {
                const navBtn = document.getElementById('nav-' + (r === '/' ? 'home' : r.replace('/', '')));
                if (navBtn) {
                    if (r === route) {
                        navBtn.className = 'text-sm font-bold transition text-cyan-400 flex items-center gap-2';
                    } else {
                        navBtn.className = 'text-sm font-semibold transition text-slate-400 hover:text-white flex items-center gap-2';
                    }
                }
            });

            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/12') html = renderDayChallenge();
            else html = renderLanding();

            if (appState.toastMessage) {
                html += `
                    <div class="fixed top-20 right-8 bg-slate-900 border border-cyan-500/50 text-cyan-300 text-sm px-6 py-3.5 rounded-2xl shadow-2xl z-50 animate-bounce">
                        ${appState.toastMessage}
                    </div>
                `;
            }

            document.getElementById('app-router').innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!window.location.hash) window.location.hash = '/';
            router.init();
        });
    </script>
</body>
</html>
