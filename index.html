<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AB Talks - Sign In / Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="flex justify-between items-center px-8 py-5 border-b border-slate-800">
        <h1 class="text-xl font-bold tracking-wider text-cyan-400">AB TALKS PORTAL</h1>
        <div class="space-x-4">
            <a href="clippings.html" class="text-slate-300 hover:text-cyan-400 text-sm font-medium">ABG News & Clippings</a>
        </div>
    </header>

    <!-- Main Content: Sign Up / Sign In Form -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-white">Welcome Back</h2>
                <p class="text-slate-400 text-sm mt-2">Sign up or sign in to access your developer node & dashboard</p>
            </div>

            <!-- Standard Signup / Signin Simulation Form -->
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="emailInput" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Password</label>
                    <input type="password" id="passwordInput" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-lg transition shadow-md">
                    Sign Up / Sign In
                </button>
            </form>

            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="px-3 text-xs uppercase text-slate-500 font-medium">Or continue with</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- Google Sign-In Button -->
            <button onclick="handleGoogleSignIn()" class="w-full flex items-center justify-center gap-3 bg-white text-slate-900 px-4 py-2.5 rounded-lg font-medium hover:bg-slate-100 transition shadow-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
    </main>

    <!-- Script to handle saving input data & redirecting -->
    <script>
        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            // Store user data locally so it persists across pages
            localStorage.setItem('ab_user_email', email);
            localStorage.setItem('ab_auth_method', 'Email/Password');
            window.location.href = 'dashboard.html';
        });

        function handleGoogleSignIn() {
            // Simulate Google Account Auth connection
            localStorage.setItem('ab_user_email', 'google_user@gmail.com');
            localStorage.setItem('ab_auth_method', 'Google OAuth');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
