<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub (Team Vitality Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.75) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }
        .glass-panel-hover:hover {
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 25px 50px -12px rgba(6, 182, 212, 0.15);
            transform: translateY(-3px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .text-gradient {
            background: linear-gradient(135deg, #22d3ee 0%, #818cf8 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Premium Animated Background Gradients -->
    <div class="fixed top-0 left-1/4 w-[600px] h-[600px] bg-cyan-500/10 rounded-full blur-[140px] pointer-events-none animate-pulse-slow"></div>
    <div class="fixed bottom-0 right-1/4 w-[600px] h-[600px] bg-indigo-500/10 rounded-full blur-[140px] pointer-events-none animate-pulse-slow" style="animation-delay: 2s;"></div>

    <!-- NAVBAR -->
    <header class="border-b border-slate-900/80 bg-[#030712]/90 backdrop-blur-2xl sticky top-0 z-50 px-8 lg:px-12 py-4 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-3.5 cursor-pointer group" onclick="router.navigateTo('/')">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-pink-500 flex items-center justify-center font-extrabold text-slate-950 text-xl shadow-lg shadow-cyan-500/25 group-hover:scale-105 transition">
                ⚡
            </div>
            <div>
                <span class="font-extrabold tracking-widest text-base bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">ABTALKS</span>
                <span class="block text-[10px] text-cyan-400 font-bold tracking-widest uppercase">Team Vitality</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center gap-2 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-800/80">
            <button onclick="router.navigateTo('/')" id="nav-home" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">🏠 Home</button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">📊 Dashboard</button>
            <button onclick="router.navigateTo('/day/1')" id="nav-day" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">⚡ Day 1</button>
            <button onclick="router.navigateTo('/about')" id="nav-about" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">✨ About Us</button>
            <button onclick="router.navigateTo('/contact')" id="nav-contact" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">📬 Contact</button>
        </nav>

        <div class="flex items-center gap-3">
            <span class="hidden sm:inline-flex text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3.5 py-1.5 rounded-full font-bold items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span> India 2026
            </span>
        </div>
    </header>

    <!-- MAIN ROUTER CONTAINER -->
    <main id="app-router" class="flex-grow max-w-7xl mx-auto w-full px-6 lg:px-12 py-12 z-10"></main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-900 bg-[#030712] py-10 px-8 lg:px-12 z-10">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center text-xs text-slate-500 gap-4">
            <div>© 2026 ABTalks Ecosystem. Crafted with precision by Team : <strong class="text-cyan-400">Vitality</strong>.</div>
            <div class="flex gap-6">
                <a href="https://abtalks.in" target="_blank" class="hover:text-cyan-400 transition font-semibold">Official Platform</a>
                <a href="#about" onclick="router.navigateTo('/about')" class="hover:text-cyan-400 transition font-semibold">About Us</a>
                <a href="#contact" onclick="router.navigateTo('/contact')" class="hover:text-cyan-400 transition font-semibold">Contact Us</a>
            </div>
        </div>
    </footer>

    <!-- APP ENGINE -->
    <script>
        const appState = {
            streakDays: 1,
            selectedTrack: 'AI & Full Stack',
            githubLink: '',
            linkedinLink: '',
            isSubmitted: false,
            synergyPoints: 50,
            dashboardTab: 'tasks',
            selectedCalendarDay: 1, // Track which day is selected in the calendar view
            captchaNum1: Math.floor(Math.random() * 8) + 2,
            captchaNum2: Math.floor(Math.random() * 8) + 1,
            captchaInput: '',
            feedbacks: [
                { name: "Aarav Mehta", role: "Full Stack Engineer", text: "Team Vitality's platform completely transformed how I execute daily coding challenges. Absolute masterpiece!" },
                { name: "Sneha Roy", role: "AI Student Developer", text: "The consistency tracker and UI aesthetics are top tier. Keeps me motivated post-college every single day." }
            ],
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => { appState.toastMessage = null; render(); }, 3500);
        }

        const router = {
            currentRoute: '/',
            init() { 
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) { 
                window.location.hash = route;
                this.currentRoute = route;
                render(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. LANDING PAGE
        function renderLanding() {
            return `
                <div class="space-y-20 animate-fadeIn py-6">
                    <div class="glass-panel p-10 lg:p-16 rounded-[2.5rem] relative overflow-hidden text-center space-y-8 border border-cyan-500/20 shadow-2xl">
                        <div class="absolute -top-32 -right-32 w-96 h-96 bg-cyan-500/10 rounded-full blur-[100px] pointer-events-none"></div>
                        <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-indigo-500/10 rounded-full blur-[100px] pointer-events-none"></div>

                        <div class="inline-flex items-center gap-2.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/25 px-5 py-2 rounded-full text-xs font-extrabold uppercase tracking-widest shadow-inner">
                            <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span> Made by Team : Vitality • Day 1 Kickoff
                        </div>
                        
                        <h1 class="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-white leading-[1.1] max-w-5xl mx-auto">
                            Code Without Limits.<br>Own Your <span class="text-gradient">60-Day Public Streak.</span>
                        </h1>
                        
                        <p class="text-slate-300 text-base sm:text-lg leading-relaxed max-w-3xl mx-auto font-medium">
                            Transform post-college hours into high-impact applications. Commit code daily, build production-ready projects, and showcase your proof of work to top recruiters.
                        </p>

                        <div class="pt-4 flex flex-wrap justify-center items-center gap-4">
                            <button onclick="router.navigateTo('/dashboard')" class="bg-gradient-to-r from-cyan-500 via-indigo-500 to-indigo-600 hover:opacity-95 text-slate-950 font-extrabold px-9 py-4 rounded-2xl text-base transition shadow-xl shadow-cyan-500/25 transform hover:-translate-y-0.5">
                                Ignite Your Dashboard 🚀
                            </button>
                            <button onclick="router.navigateTo('/about')" class="glass-panel glass-panel-hover text-white font-bold px-8 py-4 rounded-2xl text-base transition">
                                Meet Team Vitality ✨
                            </button>
                        </div>
                    </div>

                    <div class="space-y-8 pt-4">
                        <div class="text-center space-y-3">
                            <span class="text-xs font-bold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-4 py-1.5 rounded-full uppercase tracking-widest">Daily Motivation</span>
                            <h2 class="text-3xl font-extrabold text-white tracking-tight">Wisdom on Consistency</h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="glass-panel glass-panel-hover p-8 rounded-[2rem] space-y-4 relative overflow-hidden group">
                                <div class="absolute top-6 right-6 text-cyan-500/15 text-5xl font-serif font-bold group-hover:text-cyan-500/30 transition">“</div>
                                <p class="text-sm text-slate-300 italic leading-relaxed font-medium">"Success isn't always about greatness. It's about consistency. Consistent hard work leads to success."</p>
                                <div class="pt-2 border-t border-slate-800/80">
                                    <span class="block text-xs font-extrabold text-cyan-400 tracking-wider">— Dwayne Johnson</span>
                                </div>
                            </div>
                            <div class="glass-panel glass-panel-hover p-8 rounded-[2rem] space-y-4 relative overflow-hidden group">
                                <div class="absolute top-6 right-6 text-indigo-500/15 text-5xl font-serif font-bold group-hover:text-indigo-500/30 transition">“</div>
                                <p class="text-sm text-slate-300 italic leading-relaxed font-medium">"We are what we repeatedly do. Excellence, then, is not an act, but a habit."</p>
                                <div class="pt-2 border-t border-slate-800/80">
                                    <span class="block text-xs font-extrabold text-indigo-400 tracking-wider">— Aristotle</span>
                                </div>
                            </div>
                            <div class="glass-panel glass-panel-hover p-8 rounded-[2rem] space-y-4 relative overflow-hidden group">
                                <div class="absolute top-6 right-6 text-pink-500/15 text-5xl font-serif font-bold group-hover:text-pink-500/30 transition">“</div>
                                <p class="text-sm text-slate-300 italic leading-relaxed font-medium">"Small disciplines repeated with consistency every day lead to great achievements gained slowly over time."</p>
                                <div class="pt-2 border-t border-slate-800/80">
                                    <span class="block text-xs font-extrabold text-pink-400 tracking-wider">— John C. Maxwell</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-8 pt-6 border-t border-slate-900">
                        <div class="text-center space-y-3">
                            <span class="text-xs font-bold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-4 py-1.5 rounded-full uppercase tracking-widest">Testimonials</span>
                            <h2 class="text-3xl font-extrabold text-white tracking-tight">Student Feedback & Reviews</h2>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${appState.feedbacks.map(fb => `
                                <div class="glass-panel p-7 rounded-[2rem] space-y-4">
                                    <div class="flex items-center justify-between">
                                        <h4 class="font-extrabold text-white text-base">${fb.name}</h4>
                                        <span class="text-[11px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/25 px-3 py-1 rounded-full font-bold">${fb.role}</span>
                                    </div>
                                    <p class="text-slate-300 text-xs sm:text-sm leading-relaxed font-medium">"${fb.text}"</p>
                                </div>
                            `).join('')}
                        </div>

                        <div class="glass-panel p-8 rounded-[2.5rem] space-y-5 max-w-2xl mx-auto border border-cyan-500/20">
                            <div class="text-center space-y-1">
                                <h3 class="text-lg font-extrabold text-white uppercase tracking-wider">Leave Your Feedback</h3>
                                <p class="text-xs text-slate-400">Share your thoughts on Team Vitality's platform.</p>
                          </div>
                          <div class="space-y-4">
                              <input type="text" id="fbName" placeholder="Your Name / Role (e.g., Alex, Frontend Dev)" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                              <textarea id="fbText" rows="3" placeholder="Write your experience here..." class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition resize-none"></textarea>
                        </div>
                        <button onclick="submitFeedback()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-4 rounded-2xl text-sm transition shadow-lg shadow-cyan-500/20">
                            Post Feedback to Community 🚀
                        </button>
                    </div>
                </div>
            `;
        }

        // 2. DASHBOARD VIEW WITH INTERACTIVE DAY-WISE CALENDAR
        function renderDashboard() {
            // Generate array of 60 days for calendar
            let daysHtml = '';
            for (let i = 1; i <= 60; i++) {
                const isSelected = appState.selectedCalendarDay === i;
                const isUnlocked = i === 1; // Day 1 is unlocked by default
                
                let btnClasses = "p-3 rounded-xl text-xs font-extrabold transition flex flex-col items-center justify-center gap-1 border ";
                if (isSelected) {
                    btnClasses += "bg-cyan-500 text-slate-950 border-cyan-400 shadow-lg shadow-cyan-500/30 scale-105 z-10";
                } else if (isUnlocked) {
                    btnClasses += "bg-slate-900/90 text-cyan-400 border-cyan-500/30 hover:border-cyan-400 hover:bg-slate-800";
                } else {
                    btnClasses += "bg-slate-950/40 text-slate-600 border-slate-900/80 cursor-not-allowed";
                }

                daysHtml += `
                    <button onclick="${isUnlocked ? `selectCalendarDay(${i})` : `showToast('🔒 Day ${i} unlocks after completing previous days!')`}" class="${btnClasses}">
                        <span>Day ${i}</span>
                        <span class="text-[9px] ${isSelected ? 'text-slate-900 font-bold' : (isUnlocked ? 'text-emerald-400' : 'text-slate-600')}">${i === 1 ? '✓ Done' : 'Locked'}</span>
                    </button>
                `;
            }

            // Content for the selected day in calendar view
            let selectedDayContent = '';
            if (appState.selectedCalendarDay === 1) {
                selectedDayContent = `
                    <div class="space-y-4 animate-fadeIn">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-extrabold text-cyan-400 uppercase tracking-widest">Day 1 Details • Completed Work</span>
                            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3.5 py-1 rounded-full font-bold">Verified ✓</span>
                        </div>
                        <h4 class="text-xl font-extrabold text-white">Environment Setup & Hello World</h4>
                        <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">
                            Initialized public GitHub repository, configured development environment, established Team Vitality layout structure, and published the initial core framework.
                        </p>
                        <div class="pt-2 flex gap-3">
                            <button onclick="router.navigateTo('/day/1')" class="bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/30 font-bold px-4 py-2 rounded-xl text-xs transition">
                                View Day 1 Submission Form →
                            </button>
                        </div>
                    </div>
                `;
            } else {
                selectedDayContent = `
                    <div class="space-y-4 animate-fadeIn text-center py-8">
                        <span class="text-3xl">🔒</span>
                        <h4 class="text-lg font-extrabold text-white">Day ${appState.selectedCalendarDay} Preview</h4>
                        <p class="text-slate-400 text-xs max-w-md mx-auto">This milestone unlocks progressively as you advance through your 60-day public coding challenge streak.</p>
                    </div>
                `;
            }

            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto">
                    <div class="bg-gradient-to-r from-amber-500/10 via-amber-500/5 to-transparent border border-amber-500/30 p-6 rounded-[2rem] flex items-center gap-5 backdrop-blur-xl">
                        <span class="text-4xl">🌱</span>
                        <div>
                            <h4 class="text-sm font-extrabold text-amber-400 uppercase tracking-wide">Day 1 - Active Streak Started</h4>
                            <p class="text-xs text-slate-300 mt-1 font-medium">Your journey begins today. Complete your submission to lock in Day 1!</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass-panel p-7 rounded-[2rem]">
                            <span class="text-xs uppercase font-extrabold text-cyan-400 tracking-wider">Current Streak</span>
                            <div class="text-4xl font-extrabold text-white mt-2">${appState.streakDays} <span class="text-lg font-normal text-slate-400">Day 🔥</span></div>
                        </div>
                        <div class="glass-panel p-7 rounded-[2rem]">
                            <span class="text-xs uppercase font-extrabold text-indigo-400 tracking-wider">Challenge Progress</span>
                            <div class="text-4xl font-extrabold text-white mt-2">1.6%</div>
                        </div>
                        <div class="glass-panel p-7 rounded-[2rem]">
                            <span class="text-xs uppercase font-extrabold text-emerald-400 tracking-wider">Synergy Points</span>
                            <div class="text-4xl font-extrabold text-emerald-400 mt-2">${appState.synergyPoints} SP</div>
                        </div>
                    </div>

                    <div class="glass-panel p-2.5 rounded-2xl flex flex-wrap gap-2">
                        <button onclick="setDashboardTab('tasks')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-extrabold rounded-xl transition ${appState.dashboardTab === 'tasks' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}">📋 Day-Wise Calendar</button>
                        <button onclick="setDashboardTab('leaderboard')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-extrabold rounded-xl transition ${appState.dashboardTab === 'leaderboard' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}">🏆 Leaderboard</button>
                        <button onclick="setDashboardTab('contact')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-extrabold rounded-xl transition ${appState.dashboardTab === 'contact' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}">📬 Dashboard Contact Us</button>
                    </div>

                    ${renderDashboardTabContent(daysHtml, selectedDayContent)}
                </div>
            `;
        }

        function renderDashboardTabContent(daysHtml, selectedDayContent) {
            if (appState.dashboardTab === 'tasks') {
                return `
                    <div class="space-y-6">
                        <!-- Day-Wise Interactive Calendar Grid -->
                        <div class="glass-panel p-8 rounded-[2.5rem] space-y-6">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                <div>
                                    <h3 class="text-xl font-extrabold text-white">60-Day Challenge Calendar</h3>
                                    <p class="text-xs text-slate-400">Click any unlocked day below to inspect completed work and logs.</p>
                                </div>
                                <span class="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3.5 py-1.5 rounded-full font-bold">Selected: Day ${appState.selectedCalendarDay}</span>
                            </div>

                            <div class="grid grid-cols-5 sm:grid-cols-10 gap-2.5 max-h-72 overflow-y-auto pr-2">
                                ${daysHtml}
                            </div>
                        </div>

                        <!-- Selected Day Inspector Box -->
                        <div class="glass-panel p-8 rounded-[2.5rem] border border-cyan-500/30">
                            ${selectedDayContent}
                        </div>
                    </div>
                `;
            } else if (appState.dashboardTab === 'leaderboard') {
                return `
                    <div class="glass-panel p-8 rounded-[2.5rem] space-y-6">
                        <h4 class="text-sm font-extrabold text-slate-300 uppercase tracking-wider">Top Cohort Performers</h4>
                        <div class="space-y-3.5">
                            <div class="flex justify-between items-center bg-slate-900/90 p-4.5 rounded-2xl border border-slate-800">
                                <span class="font-extrabold text-white text-sm">1. Priyanshu Sharma</span>
                                <span class="text-cyan-400 font-extrabold text-xs">1 Day Streak 🔥 (50 SP)</span>
                            </div>
                            <div class="flex justify-between items-center bg-cyan-500/10 p-4.5 rounded-2xl border border-cyan-500/30">
                                <span class="font-extrabold text-cyan-300 text-sm">2. Ishaan Thusoo (You)</span>
                                <span class="text-cyan-400 font-extrabold text-xs">1 Day Streak 🔥 (${appState.synergyPoints} SP)</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="glass-panel p-8 lg:p-10 rounded-[2.5rem] space-y-6 animate-fadeIn">
                        <div class="space-y-2">
                            <span class="text-xs font-extrabold text-cyan-400 uppercase tracking-widest">Support Portal</span>
                            <h3 class="text-2xl font-extrabold text-white">Dashboard Contact Us</h3>
                            <p class="text-slate-400 text-sm">Need help with your Day 1 streak or submissions? Reach out directly to Team Vitality.</p>
                        </div>
                        <div class="space-y-4">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Your Name</label>
                                    <input type="text" placeholder="Ishaan Thusoo" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">College Email</label>
                                    <input type="email" placeholder="student@university.ac.in" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Issue / Message</label>
                                <textarea rows="3" placeholder="Describe your issue regarding submission..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                            </div>
                            <button onclick="showToast('✅ Inquiry sent from Dashboard to Team Vitality!')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-4 px-8 rounded-2xl text-sm transition shadow-lg shadow-cyan-500/20">
                                Submit Support Ticket 📨
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function setDashboardTab(tab) {
            appState.dashboardTab = tab;
            render();
        }

        function selectCalendarDay(day) {
            appState.selectedCalendarDay = day;
            render();
        }

        // 3. DAY 1 CHALLENGE
        function renderDayChallenge() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-sm text-slate-400 hover:text-white flex items-center gap-2 font-bold">← Back to Dashboard</button>
                        <span class="text-xs font-extrabold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-4 py-1.5 rounded-full">Day 1 of 60 Challenge</span>
                    </div>

                    <div class="space-y-3">
                        <h1 class="text-3xl lg:text-5xl font-extrabold text-white tracking-tight">Environment Setup & Hello World</h1>
                        <p class="text-base text-slate-300 leading-relaxed font-medium">Initialize your public GitHub repository, configure your development environment, and publish your initial proof of work.</p>
                    </div>

                    <div class="glass-panel p-8 lg:p-10 rounded-[2.5rem] space-y-6 shadow-2xl">
                        <h3 class="text-lg font-extrabold text-white flex items-center justify-between">
                            <span>🚀 Submit Day 1 Proof of Work</span>
                            ${appState.isSubmitted ? '<span class="text-xs text-emerald-400 font-bold bg-emerald-500/10 px-3.5 py-1 rounded-full">Verified ✓</span>' : ''}
                        </h3>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" placeholder="https://github.com/username/repo" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                             
                            <div class="bg-slate-950/90 border border-slate-800 p-5 rounded-2xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs uppercase font-extrabold text-slate-300">Security Math Verification</span>
                                    <button onclick="refreshCaptcha()" class="text-xs text-cyan-400 hover:underline font-bold">Generate New Code 🔄</button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="bg-slate-900 border border-slate-700 px-5 py-3 rounded-xl text-base font-mono font-extrabold text-cyan-300 tracking-wider">
                                        ${appState.captchaNum1} + ${appState.captchaNum2} = ?
                                    </div>
                                    <input type="number" id="captchaInput" value="${appState.captchaInput}" oninput="appState.captchaInput=this.value" placeholder="Enter answer" class="w-40 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                            </div>
                        </div>

                        <button onclick="handleSubmission()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-4 rounded-2xl text-base transition shadow-xl shadow-cyan-500/25 flex items-center justify-center gap-2">
                            <span>Verify & Submit Day 1 Proof (+50 Synergy Points)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // 4. ABOUT US SECTION
        function renderAbout() {
            return `
                <div class="space-y-12 animate-fadeIn max-w-5xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-4 py-1.5 rounded-full">About Us • Team Vitality</span>
                        <h1 class="text-4xl lg:text-5xl font-extrabold text-white tracking-tight">Meet Our Core Team</h1>
                        <p class="text-slate-400 text-sm sm:text-base max-w-2xl mx-auto font-medium">The dedicated creators behind the design, intelligence, and architecture of this platform.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pt-4">
                        <div class="glass-panel glass-panel-hover p-8 rounded-[2.5rem] space-y-5 text-center group">
                            <div class="w-16 h-16 rounded-2xl bg-pink-500/10 border border-pink-500/25 text-pink-400 flex items-center justify-center font-bold text-2xl mx-auto group-hover:scale-110 transition">🎨</div>
                            <div class="space-y-1">
                                <h3 class="text-2xl font-extrabold text-white">Mahima</h3>
                                <p class="text-xs text-pink-400 font-extrabold uppercase tracking-widest">Designer</p>
                            </div>
                            <p class="text-slate-400 text-xs font-medium">Crafted intuitive layouts, visual aesthetics, and overall user experience.</p>
                        </div>

                        <div class="glass-panel glass-panel-hover p-8 rounded-[2.5rem] space-y-5 text-center group">
                            <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/25 text-indigo-400 flex items-center justify-center font-bold text-2xl mx-auto group-hover:scale-110 transition">🤖</div>
                            <div class="space-y-1">
                                <h3 class="text-2xl font-extrabold text-white">Diksha</h3>
                                <p class="text-xs text-indigo-400 font-extrabold uppercase tracking-widest">AI Engineer</p>
                            </div>
                            <p class="text-slate-400 text-xs font-medium">Engineered intelligent workflows and cutting-edge assistance mechanics.</p>
                        </div>

                        <div class="glass-panel glass-panel-hover p-8 rounded-[2.5rem] space-y-5 text-center group">
                            <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/25 text-cyan-400 flex items-center justify-center font-bold text-2xl mx-auto group-hover:scale-110 transition">💻</div>
                            <div class="space-y-1">
                                <h3 class="text-2xl font-extrabold text-white">Ishaan</h3>
                                <p class="text-xs text-cyan-400 font-extrabold uppercase tracking-widest">Frontend and Backend Developer</p>
                            </div>
                            <p class="text-slate-400 text-xs font-medium">Developed full-stack architecture, routing mechanics, and robust application logic.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. CONTACT US SECTION
        function renderContact() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-3xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-4 py-1.5 rounded-full">Get In Touch</span>
                        <h1 class="text-4xl font-extrabold text-white tracking-tight">Contact Team Vitality</h1>
                        <p class="text-slate-400 text-sm font-medium">Have feedback or questions about our platform? Drop us a message below.</p>
                    </div>

                    <div class="glass-panel p-8 lg:p-10 rounded-[2.5rem] space-y-6 shadow-2xl">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Your Name</label>
                                <input type="text" placeholder="Enter your name" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Email Address</label>
                                <input type="email" placeholder="student@college.edu" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Message</label>
                            <textarea rows="4" placeholder="How can we help you?" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition resize-none"></textarea>
                        </div>
                        <button onclick="showToast('✅ Message sent to Team Vitality successfully!')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-4 rounded-2xl text-sm transition shadow-xl shadow-cyan-500/20">
                            Send Message to Team Vitality 🚀
                        </button>
                    </div>
                </div>
            `;
        }

        function submitFeedback() {
            const name = document.getElementById('fbName').value.trim();
            const text = document.getElementById('fbText').value.trim();
            if (!name || !text) {
                showToast('❌ Please fill in both your name and feedback.');
                return;
            }
            appState.feedbacks.unshift({ name, role: "Community User", text });
            document.getElementById('fbName').value = '';
            document.getElementById('fbText').value = '';
            showToast('✅ Thank you! Your feedback has been posted.');
            render();
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 8) + 2;
            appState.captchaNum2 = Math.floor(Math.random() * 8) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect CAPTCHA answer. Please try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakDays = 1;
            appState.synergyPoints += 50;
            showToast('🎉 Day 1 Verified! Streak ignited & +50 Synergy Points added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const route = router.currentRoute;
            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/1') html = renderDayChallenge();
            else if (route === '/about') html = renderAbout();
            else if (route === '/contact') html = renderContact();
            document.getElementById('app-router').innerHTML = html;

            ['/', '/dashboard', '/day/1', '/about', '/contact'].forEach(r => {
                const btn = document.getElementById('nav-' + (r === '/' ? 'home' : r.replace('/', '')));
                if(btn) {
                    if(r === route) {
                        btn.className = 'px-4 py-2 text-xs font-bold rounded-xl transition bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20';
                    } else {
                        btn.className = 'px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white';
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => { router.init(); });
    </script>
</body>
</html>
