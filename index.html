<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub (Team Vitality Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card-hover:hover { border-color: rgba(6, 182, 212, 0.3); transform: translateY(-2px); transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Glowing Background Accents -->
    <div class="fixed top-0 left-1/4 w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- NAVBAR -->
    <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-50 px-10 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigateTo('/')">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center font-bold text-slate-950 text-lg shadow-lg shadow-cyan-500/20 overflow-hidden">
                <img src="image_d71db8.jpg" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'">
            </div>
            <div>
                <span class="font-extrabold tracking-wider text-base bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">ABTALKS</span>
                <span class="block text-[10px] text-cyan-400 font-semibold tracking-widest uppercase">Made by Team : Vitality</span>
            </div>
        </div>

        <nav class="flex items-center gap-6">
            <button onclick="router.navigateTo('/')" id="nav-home" class="text-sm font-semibold transition text-slate-400 hover:text-white flex items-center gap-1">🏠 Home</button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="text-sm font-semibold transition text-slate-400 hover:text-white flex items-center gap-1">📊 Dashboard</button>
            <button onclick="router.navigateTo('/day/1')" id="nav-day" class="text-sm font-semibold transition text-slate-400 hover:text-white flex items-center gap-1">⚡ Day 1</button>
            <button onclick="router.navigateTo('/about')" id="nav-about" class="text-sm font-semibold transition text-slate-400 hover:text-white flex items-center gap-1">✨ About Us</button>
            <button onclick="router.navigateTo('/contact')" id="nav-contact" class="text-sm font-semibold transition text-slate-400 hover:text-white flex items-center gap-1">📬 Contact Us</button>
            <div class="h-5 w-px bg-slate-800"></div>
            <span class="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3.5 py-1.5 rounded-full font-bold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> India Cohort 2026
            </span>
        </nav>
    </header>

    <!-- MAIN ROUTER VIEW -->
    <main id="app-router" class="flex-grow max-w-7xl mx-auto w-full px-8 py-10 z-10"></main>

    <!-- CLEAN FOOTER -->
    <footer class="border-t border-slate-900 bg-slate-950 py-8 px-10 z-10">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 gap-4">
            <div>© 2026 ABTalks Ecosystem. All rights reserved. Made by Team : <strong>Vitality</strong>.</div>
            <div class="flex gap-6">
                <a href="https://abtalks.in" target="_blank" class="hover:text-cyan-400 transition">Official Platform</a>
                <a href="#about" onclick="router.navigateTo('/about')" class="hover:text-cyan-400 transition">About Us</a>
                <a href="#contact" onclick="router.navigateTo('/contact')" class="hover:text-cyan-400 transition">Contact Us</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPT APPLICATION ENGINE -->
    <script>
        const appState = {
            streakDays: 1,
            selectedTrack: 'AI & Full Stack',
            githubLink: '',
            linkedinLink: '',
            isSubmitted: false,
            synergyPoints: 50,
            dashboardTab: 'tasks',
            captchaNum1: Math.floor(Math.random() * 8) + 2,
            captchaNum2: Math.floor(Math.random() * 8) + 1,
            captchaInput: '',
            feedbacks: [
                { name: "Aarav Mehta", role: "Full Stack Engineer", text: "Team Vitality's platform completely changed how I track daily coding progress. The interface is exceptionally clean!" },
                { name: "Sneha Roy", role: "AI Student Developer", text: "Love the streak mechanism and consistency quotes on the landing page. Keeps me motivated post-college every single day." }
            ],
            newFeedbackName: '',
            newFeedbackText: '',
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => { appState.toastMessage = null; render(); }, 3000);
        }

        const router = {
            currentRoute: '/',
            init() { 
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) { 
                window.location.hash = route;
                this.currentRoute = route;
                render(); 
                window.scrollTo(0, 0);
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. LANDING PAGE (With Logo Image, Consistency Quotes, and Feedback Section)
        function renderLanding() {
            return `
                <div class="space-y-16 animate-fadeIn py-6">
                    <!-- Hero Section -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                        <div class="lg:col-span-7 space-y-6">
                            <div class="inline-flex items-center gap-2 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3.5 py-1.5 rounded-full text-xs font-bold">
                                ⚡ Made by Team : Vitality • Day 1 Kickoff
                            </div>
                            <h1 class="text-4xl lg:text-6xl font-extrabold tracking-tight text-white leading-tight">
                                Start your journey.<br>Build your first <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">Day 1 streak.</span>
                            </h1>
                            <p class="text-slate-400 text-base lg:text-lg leading-relaxed max-w-2xl">
                                Code post-college, build real applications starting right from Day 1, commit to public GitHub repos, and track your progress securely.
                            </p>
                            <div class="pt-2 flex items-center gap-4">
                                <button onclick="router.navigateTo('/dashboard')" class="bg-gradient-to-r from-cyan-500 to-indigo-500 hover:opacity-95 text-slate-950 font-extrabold px-8 py-4 rounded-2xl text-base transition shadow-xl shadow-cyan-500/25">
                                    Open Student Dashboard 📊
                                </button>
                                <button onclick="router.navigateTo('/about')" class="glass-card hover:border-cyan-500/50 text-white font-bold px-6 py-4 rounded-2xl text-base transition">
                                    About Us ✨
                                </button>
                            </div>
                        </div>

                        <!-- Inserted Logo Image (image_d71db8.jpg) -->
                        <div class="lg:col-span-5 flex justify-center">
                            <div class="relative rounded-3xl overflow-hidden border border-slate-800 shadow-2xl p-5 glass-card max-w-sm text-center space-y-4">
                                <img src="image_d71db8.jpg" alt="Team Vitality Hackathon Logo" class="w-full h-56 object-cover rounded-2xl border border-cyan-500/30 shadow-md" onerror="this.style.display='none'">
                                <div class="space-y-1">
                                    <h3 class="text-sm font-extrabold text-cyan-400 uppercase tracking-wider">Vitality Hackathon Edition</h3>
                                    <p class="text-xs text-slate-400">Official Redesign Entry by Team : Vitality</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Consistency Quotes Section -->
                    <div class="space-y-6 pt-6 border-t border-slate-900">
                        <div class="text-center space-y-2">
                            <span class="text-xs font-bold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3.5 py-1.5 rounded-full uppercase tracking-widest">Daily Motivation</span>
                            <h2 class="text-2xl font-extrabold text-white">Wisdom on Consistency</h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="glass-card p-6 rounded-3xl space-y-3 relative overflow-hidden">
                                <div class="absolute top-4 right-4 text-cyan-500/20 text-4xl font-serif">“</div>
                                <p class="text-sm text-slate-300 italic leading-relaxed">"Success isn't always about greatness. It's about consistency. Consistent hard work leads to success."</p>
                                <span class="block text-xs font-bold text-cyan-400">— Dwayne Johnson</span>
                            </div>
                            <div class="glass-card p-6 rounded-3xl space-y-3 relative overflow-hidden">
                                <div class="absolute top-4 right-4 text-indigo-500/20 text-4xl font-serif">“</div>
                                <p class="text-sm text-slate-300 italic leading-relaxed">"We are what we repeatedly do. Excellence, then, is not an act, but a habit."</p>
                                <span class="block text-xs font-bold text-indigo-400">— Aristotle</span>
                            </div>
                            <div class="glass-card p-6 rounded-3xl space-y-3 relative overflow-hidden">
                                <div class="absolute top-4 right-4 text-emerald-500/20 text-4xl font-serif">“</div>
                                <p class="text-sm text-slate-300 italic leading-relaxed">"Small disciplines repeated with consistency every day lead to great achievements gained slowly over time."</p>
                                <span class="block text-xs font-bold text-emerald-400">— John C. Maxwell</span>
                            </div>
                        </div>
                    </div>

                    <!-- Community Feedback Section -->
                    <div class="space-y-6 pt-6 border-t border-slate-900">
                        <div class="text-center space-y-2">
                            <span class="text-xs font-bold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3.5 py-1.5 rounded-full uppercase tracking-widest">Testimonials</span>
                            <h2 class="text-2xl font-extrabold text-white">Student Feedback & Reviews</h2>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${appState.feedbacks.map(fb => `
                                <div class="glass-card p-6 rounded-3xl space-y-3">
                                    <div class="flex items-center justify-between">
                                        <h4 class="font-bold text-white text-sm">${fb.name}</h4>
                                        <span class="text-[10px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2.5 py-1 rounded-full font-semibold">${fb.role}</span>
                                    </div>
                                    <p class="text-slate-300 text-xs leading-relaxed">"${fb.text}"</p>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Add Feedback Form -->
                        <div class="glass-card p-6 rounded-3xl space-y-4 max-w-2xl mx-auto">
                            <h3 class="text-sm font-extrabold text-white uppercase tracking-wider text-center">Leave Your Feedback</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <input type="text" id="fbName" placeholder="Your Name / Role" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-cyan-400">
                                <input type="text" id="fbText" placeholder="Your feedback statement..." class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <button onclick="submitFeedback()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-md">
                                Post Feedback to Community
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. DASHBOARD VIEW
        function renderDashboard() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto">
                    <div class="bg-amber-500/10 border border-amber-500/30 p-5 rounded-3xl flex items-center gap-4 backdrop-blur-md">
                        <span class="text-3xl">🌱</span>
                        <div>
                            <h4 class="text-sm font-bold text-amber-400 uppercase">Day 1 - Active Streak Started</h4>
                            <p class="text-xs text-slate-300 mt-0.5">Your journey begins today. Complete your submission to lock in Day 1!</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass-card p-6 rounded-3xl">
                            <span class="text-xs uppercase font-bold text-cyan-400 tracking-wider">Current Streak</span>
                            <div class="text-4xl font-extrabold text-white mt-2">${appState.streakDays} <span class="text-lg font-normal text-slate-400">Day 🔥</span></div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl">
                            <span class="text-xs uppercase font-bold text-indigo-400 tracking-wider">Challenge Progress</span>
                            <div class="text-4xl font-extrabold text-white mt-2">1.6%</div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl">
                            <span class="text-xs uppercase font-bold text-emerald-400 tracking-wider">Synergy Points</span>
                            <div class="text-4xl font-extrabold text-emerald-400 mt-2">${appState.synergyPoints} SP</div>
                        </div>
                    </div>

                    <div class="glass-card p-2 rounded-2xl flex flex-wrap gap-2">
                        <button onclick="setDashboardTab('tasks')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-bold rounded-xl transition ${appState.dashboardTab === 'tasks' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}">📋 Today's Task</button>
                        <button onclick="setDashboardTab('leaderboard')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-bold rounded-xl transition ${appState.dashboardTab === 'leaderboard' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}">🏆 Leaderboard</button>
                        <button onclick="setDashboardTab('contact')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-bold rounded-xl transition ${appState.dashboardTab === 'contact' ? 'bg-cyan-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}">📬 Dashboard Contact Us</button>
                    </div>

                    ${renderDashboardTabContent()}
                </div>
            `;
        }

        function renderDashboardTabContent() {
            if (appState.dashboardTab === 'tasks') {
                return `
                    <div class="glass-card p-8 rounded-3xl space-y-6">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Active Task • Day 1 of 60</span>
                            <span class="text-xs ${appState.isSubmitted ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'} border px-4 py-1 rounded-full font-bold">
                                ${appState.isSubmitted ? 'Verified ✓' : 'Pending'}
                            </span>
                        </div>
                        <h3 class="font-extrabold text-2xl text-white">Environment Setup & Hello World</h3>
                        <p class="text-slate-300 text-sm">Initialize your public GitHub repository, configure your development environment, and deploy your Day 1 task.</p>
                        <button onclick="router.navigateTo('/day/1')" class="bg-cyan-500 text-slate-950 font-bold px-8 py-3.5 rounded-xl text-sm transition shadow-lg">
                            Open Day 1 Submission Portal →
                        </button>
                    </div>
                `;
            } else if (appState.dashboardTab === 'leaderboard') {
                return `
                    <div class="glass-card p-6 rounded-3xl space-y-4">
                        <h4 class="text-sm font-bold text-slate-300 uppercase">Top Cohort Performers</h4>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                                <span class="font-bold text-white text-base">1. Priyanshu Sharma</span>
                                <span class="text-cyan-400 font-extrabold">1 Day Streak 🔥 (50 SP)</span>
                            </div>
                            <div class="flex justify-between items-center bg-cyan-500/10 p-4 rounded-2xl border border-cyan-500/30">
                                <span class="font-bold text-cyan-300 text-base">2. Ishaan Thusoo (You)</span>
                                <span class="text-cyan-400 font-extrabold">1 Day Streak 🔥 (${appState.synergyPoints} SP)</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="glass-card p-8 rounded-3xl space-y-6 animate-fadeIn">
                        <div class="space-y-2">
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Support Portal</span>
                            <h3 class="text-2xl font-extrabold text-white">Dashboard Contact Us</h3>
                            <p class="text-slate-400 text-sm">Need help with your Day 1 streak or submissions? Reach out directly to Team Vitality.</p>
                        </div>
                        <div class="space-y-4">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Your Name</label>
                                    <input type="text" placeholder="Ishaan Thusoo" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">College Email</label>
                                    <input type="email" placeholder="student@university.ac.in" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Issue / Message</label>
                                <textarea rows="3" placeholder="Describe your issue regarding submission..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400"></textarea>
                            </div>
                            <button onclick="showToast('✅ Inquiry sent from Dashboard to Team Vitality!')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-3.5 px-8 rounded-2xl text-sm transition shadow-lg">
                                Submit Support Ticket
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function setDashboardTab(tab) {
            appState.dashboardTab = tab;
            render();
        }

        // 3. DAY 1 CHALLENGE
        function renderDayChallenge() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-sm text-slate-400 hover:text-white flex items-center gap-2 font-semibold">← Back to Dashboard</button>
                        <span class="text-xs font-extrabold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-4 py-1.5 rounded-full">Day 1 of 60 Challenge</span>
                    </div>

                    <div class="space-y-3">
                        <h1 class="text-3xl lg:text-5xl font-extrabold text-white">Environment Setup & Hello World</h1>
                        <p class="text-base text-slate-300 leading-relaxed">Initialize your public GitHub repository, configure your development environment, and publish your initial proof of work.</p>
                    </div>

                    <div class="glass-card p-8 rounded-3xl space-y-6 shadow-2xl">
                        <h3 class="text-lg font-extrabold text-white flex items-center justify-between">
                            <span>🚀 Submit Day 1 Proof of Work</span>
                            ${appState.isSubmitted ? '<span class="text-xs text-emerald-400 font-bold bg-emerald-500/10 px-3 py-1 rounded-full">Verified ✓</span>' : ''}
                        </h3>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" placeholder="https://github.com/username/repo" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            
                            <div class="bg-slate-950/90 border border-slate-800 p-5 rounded-2xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs uppercase font-extrabold text-slate-300">Security Math Verification</span>
                                    <button onclick="refreshCaptcha()" class="text-xs text-cyan-400 hover:underline font-semibold">Generate New Code 🔄</button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="bg-slate-900 border border-slate-700 px-5 py-3 rounded-xl text-base font-mono font-extrabold text-cyan-300 tracking-wider">
                                        ${appState.captchaNum1} + ${appState.captchaNum2} = ?
                                    </div>
                                    <input type="number" id="captchaInput" value="${appState.captchaInput}" oninput="appState.captchaInput=this.value" placeholder="Enter answer" class="w-40 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                            </div>
                        </div>

                        <button onclick="handleSubmission()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-4 rounded-2xl text-base transition shadow-xl shadow-cyan-500/25 flex items-center justify-center gap-2">
                            <span>Verify & Submit Day 1 Proof (+50 Synergy Points)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // 4. ABOUT US SECTION (ONLY place with member info)
        function renderAbout() {
            return `
                <div class="space-y-10 animate-fadeIn max-w-5xl mx-auto">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3.5 py-1.5 rounded-full">About Us • Made by Team : Vitality</span>
                        <h1 class="text-4xl font-extrabold text-white">Meet Our Core Team</h1>
                        <p class="text-slate-400 text-sm max-w-2xl mx-auto">The dedicated creators behind the design, intelligence, and architecture of this platform.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6">
                        <div class="glass-card p-8 rounded-3xl space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-pink-500/10 border border-pink-500/20 text-pink-400 flex items-center justify-center font-bold text-2xl mx-auto">🎨</div>
                            <h3 class="text-xl font-extrabold text-white">Mahima</h3>
                            <p class="text-xs text-pink-400 font-bold uppercase tracking-wider">Designer</p>
                        </div>

                        <div class="glass-card p-8 rounded-3xl space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-2xl mx-auto">🤖</div>
                            <h3 class="text-xl font-extrabold text-white">Diksha</h3>
                            <p class="text-xs text-indigo-400 font-bold uppercase tracking-wider">AI chatbot</p>
                        </div>

                        <div class="glass-card p-8 rounded-3xl space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold text-2xl mx-auto">💻</div>
                            <h3 class="text-xl font-extrabold text-white">Ishaan</h3>
                            <p class="text-xs text-cyan-400 font-bold uppercase tracking-wider">frontend and Backend Developer</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. CONTACT US SECTION
        function renderContact() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-3xl mx-auto">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3.5 py-1.5 rounded-full">Get In Touch</span>
                        <h1 class="text-4xl font-extrabold text-white">Contact Team Vitality</h1>
                        <p class="text-slate-400 text-sm">Have feedback or questions about our platform? Drop us a message below.</p>
                    </div>

                    <div class="glass-card p-8 rounded-3xl space-y-5">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Your Name</label>
                                <input type="text" placeholder="Enter your name" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Email Address</label>
                                <input type="email" placeholder="student@college.edu" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Message</label>
                            <textarea rows="4" placeholder="How can we help you?" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400"></textarea>
                        </div>
                        <button onclick="showToast('✅ Message sent to Team Vitality successfully!')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-4 rounded-2xl text-sm transition shadow-xl shadow-cyan-500/20">
                            Send Message to Team Vitality
                        </button>
                    </div>
                </div>
            `;
        }

        function submitFeedback() {
            const name = document.getElementById('fbName').value.trim();
            const text = document.getElementById('fbText').value.trim();
            if (!name || !text) {
                showToast('❌ Please fill in both name and feedback text.');
                return;
            }
            appState.feedbacks.unshift({ name, role: "Community User", text });
            document.getElementById('fbName').value = '';
            document.getElementById('fbText').value = '';
            showToast('✅ Thank you! Your feedback has been posted.');
            render();
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 8) + 2;
            appState.captchaNum2 = Math.floor(Math.random() * 8) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect CAPTCHA answer. Please try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakDays = 1;
            appState.synergyPoints += 50;
            showToast('🎉 Day 1 Verified! Streak ignited & +50 Synergy Points added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const route = router.currentRoute;
            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/1') html = renderDayChallenge();
            else if (route === '/about') html = renderAbout();
            else if (route === '/contact') html = renderContact();
            document.getElementById('app-router').innerHTML = html;

            ['/', '/dashboard', '/day/1', '/about', '/contact'].forEach(r => {
                const btn = document.getElementById('nav-' + (r === '/' ? 'home' : r.replace('/', '')));
                if(btn) {
                    if(r === route) btn.className = 'text-sm font-bold text-cyan-400 flex items-center gap-1';
                    else btn.className = 'text-sm font-semibold text-slate-400 hover:text-white flex items-center gap-1';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => { router.init(); });
    </script>
</body>
</html>
