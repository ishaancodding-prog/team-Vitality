<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 flex justify-center min-h-screen">

    <!-- Responsive Container: Fluid on desktop/laptops, neatly centered/constrained on mobile -->
    <div class="w-full max-w-5xl bg-slate-950 min-h-screen flex flex-col justify-between border-x border-slate-900/80 shadow-2xl relative overflow-hidden">

        <!-- Glowing Aesthetic Background Accents -->
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-20 right-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- DESKTOP / LAPTOP HEADER NAVIGATION -->
        <header class="hidden md:flex justify-between items-center px-8 py-5 border-b border-slate-900 bg-slate-950/80 backdrop-blur-md z-50 sticky top-0">
            <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigateTo('/')">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center font-bold text-slate-950 text-base shadow-md shadow-cyan-500/20">AB</div>
                <span class="font-bold tracking-wider text-base bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">ABTALKS</span>
            </div>
            <nav class="flex items-center gap-6">
                <button onclick="router.navigateTo('/')" id="desktop-nav-home" class="text-sm font-medium transition text-slate-400 hover:text-white">Home</button>
                <button onclick="router.navigateTo('/dashboard')" id="desktop-nav-dashboard" class="text-sm font-medium transition text-slate-400 hover:text-white">Dashboard</button>
                <button onclick="router.navigateTo('/day/12')" id="desktop-nav-day" class="text-sm font-medium transition text-slate-400 hover:text-white">Day 12 Challenge</button>
                <span class="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3 py-1 rounded-full font-semibold">🇮🇳 India Cohort</span>
            </nav>
        </header>

        <!-- ROUTER CONTAINER -->
        <div id="app-router" class="flex-grow flex flex-col pb-28 md:pb-12 overflow-y-auto hide-scrollbar z-10 px-4 md:px-12 py-6">
            <!-- Dynamically injected views go here -->
        </div>

        <!-- MOBILE BOTTOM NAVIGATION BAR (Hidden on Desktops) -->
        <nav class="md:hidden absolute bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-xl border-t border-slate-800/80 px-4 py-3 flex justify-between items-center z-50">
            <button onclick="router.navigateTo('/')" id="nav-home" class="flex flex-col items-center gap-1 text-slate-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 text-slate-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-[10px] font-medium">Dashboard</span>
            </button>
            <button onclick="router.navigateTo('/day/12')" id="nav-day" class="flex flex-col items-center gap-1 text-slate-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span class="text-[10px] font-medium">Day 12</span>
            </button>
        </nav>
    </div>

    <!-- JAVASCRIPT APPLICATION & ROUTER LOGIC -->
    <script>
        const appState = {
            streakState: 'active', // 'active', 'zero', 'missed'
            selectedTrack: 'AI & Full Stack',
            githubLink: 'https://github.com/ishaancodding-prog/ai-agent',
            linkedinLink: 'https://linkedin.com/posts/ishaancodding_aicoding',
            isSubmitted: false,
            synergyPoints: 450,
            activeTab: 'tasks',
            captchaNum1: Math.floor(Math.random() * 8) + 2,
            captchaNum2: Math.floor(Math.random() * 8) + 1,
            captchaInput: '',
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => {
                appState.toastMessage = null;
                render();
            }, 3000);
        }

        const router = {
            currentRoute: '/',
            init() {
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) {
                window.location.hash = route;
                this.currentRoute = route;
                render();
                window.scrollTo(0, 0);
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. LANDING PAGE VIEW (/)
        function renderLanding() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-3xl mx-auto w-full">
                    <div class="flex justify-between items-center md:hidden">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center font-bold text-slate-950 text-sm shadow-md shadow-cyan-500/20">AB</div>
                            <span class="font-bold tracking-wider text-sm bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">ABTALKS</span>
                        </div>
                        <span class="text-[10px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2.5 py-1 rounded-full font-semibold">🇮🇳 India Cohort</span>
                    </div>

                    <!-- Aesthetic Hero Banner Image Card -->
                    <div class="relative rounded-3xl overflow-hidden border border-slate-800 shadow-2xl group">
                        <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=80" alt="Coding Workspace" class="w-full h-64 md:h-80 object-cover opacity-65 group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                        <div class="absolute bottom-6 left-6 right-6 space-y-2">
                            <span class="text-xs font-extrabold uppercase tracking-widest text-cyan-400">60-Day Engineering Challenge</span>
                            <h1 class="text-3xl md:text-5xl font-extrabold leading-tight text-white">
                                Build every day.<br>Get noticed by <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">top recruiters.</span>
                            </h1>
                        </div>
                    </div>

                    <p class="text-slate-400 text-sm md:text-base leading-relaxed">
                        Designed for Indian college students. Code post-college, submit your GitHub commit & LinkedIn post, and build an unignorable public streak.
                    </p>

                    <div class="glass-card p-6 rounded-3xl space-y-4">
                        <h3 class="text-xs md:text-sm font-bold text-slate-300 uppercase tracking-wide">Select Your Learning Track</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <button onclick="setTrack('AI & Full Stack')" class="p-4 rounded-2xl text-sm font-semibold border text-left transition ${appState.selectedTrack === 'AI & Full Stack' ? 'bg-cyan-500/15 border-cyan-500 text-cyan-300 shadow-lg shadow-cyan-500/10' : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:text-white'}">
                                🤖 AI & Full Stack
                            </button>
                            <button onclick="setTrack('Cloud & DevOps')" class="p-4 rounded-2xl text-sm font-semibold border text-left transition ${appState.selectedTrack === 'Cloud & DevOps' ? 'bg-cyan-500/15 border-cyan-500 text-cyan-300 shadow-lg shadow-cyan-500/10' : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:text-white'}">
                                ☁️ Cloud & DevOps
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass-card p-6 rounded-3xl text-center">
                            <div class="text-2xl md:text-3xl font-extrabold text-white">25+</div>
                            <div class="text-xs md:text-sm text-slate-400 mt-1">Students Placed</div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl text-center">
                            <div class="text-2xl md:text-3xl font-extrabold text-cyan-400">10k+</div>
                            <div class="text-xs md:text-sm text-slate-400 mt-1">Active Learners</div>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-indigo-950/50 to-slate-900/80 border border-indigo-500/30 p-5 rounded-3xl flex items-center gap-4 backdrop-blur-md">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 flex items-center justify-center text-indigo-400 shrink-0 text-xl">🌙</div>
                        <div>
                            <h3 class="text-xs md:text-sm font-bold text-indigo-300 uppercase tracking-wide">Late-Night Hostel Mode</h3>
                            <p class="text-xs text-slate-400 mt-0.5">Optimized for mobile & low-bandwidth dorm Wi-Fi.</p>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button onclick="router.navigateTo('/dashboard')" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-500 hover:opacity-95 text-slate-950 font-bold py-4 rounded-2xl text-base transition shadow-xl shadow-cyan-500/25 flex items-center justify-center gap-2">
                            <span>Start 60-Day Journey</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        // 2. STUDENT DASHBOARD VIEW (/dashboard)
        function renderDashboard() {
            let streakBanner = '';
            if (appState.streakState === 'zero') {
                streakBanner = `<div class="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl flex items-center gap-3 backdrop-blur-md">
                    <span class="text-2xl">🌱</span>
                    <div>
                        <h4 class="text-xs font-bold text-amber-400 uppercase">Day 1 - Fresh Start</h4>
                        <p class="text-xs text-slate-300 mt-0.5">Complete today's task to start your public streak!</p>
                    </div>
                </div>`;
            } else if (appState.streakState === 'missed') {
                streakBanner = `<div class="bg-red-500/10 border border-red-500/30 p-4 rounded-2xl flex items-center gap-3 backdrop-blur-md">
                    <span class="text-2xl">⚠️</span>
                    <div>
                        <h4 class="text-xs font-bold text-red-400 uppercase">Streak Frozen</h4>
                        <p class="text-xs text-slate-300 mt-0.5">Missed yesterday. Submit Day 12 to revive instantly!</p>
                    </div>
                </div>`;
            }

            return `
                <div class="space-y-6 animate-fadeIn max-w-3xl mx-auto w-full">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-full ring-2 ring-cyan-500/50 p-0.5 bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center font-bold text-slate-950 text-base">IT</div>
                            <div>
                                <h2 class="font-bold text-base text-white">Ishaan Thusoo</h2>
                                <p class="text-xs text-slate-400">${appState.selectedTrack}</p>
                            </div>
                        </div>
                        <button onclick="toggleStreakState()" class="text-xs glass-card text-slate-300 px-3.5 py-2 rounded-xl hover:text-white transition">
                            State: ${appState.streakState} 🔄
                        </button>
                    </div>

                    ${streakBanner}

                    <div class="grid grid-cols-3 gap-3">
                        <div class="glass-card p-4 rounded-2xl text-center">
                            <span class="text-xs uppercase font-bold text-cyan-400">Streak</span>
                            <div class="text-2xl md:text-3xl font-extrabold text-white mt-1">${appState.streakState === 'zero' ? '0' : '11'} <span class="text-sm text-slate-400">🔥</span></div>
                        </div>
                        <div class="glass-card p-4 rounded-2xl text-center">
                            <span class="text-xs uppercase font-bold text-indigo-400">Progress</span>
                            <div class="text-2xl md:text-3xl font-extrabold text-white mt-1">18.3%</div>
                        </div>
                        <div class="glass-card p-4 rounded-2xl text-center">
                            <span class="text-xs uppercase font-bold text-emerald-400">Synergy</span>
                            <div class="text-2xl md:text-3xl font-extrabold text-emerald-400 mt-1">${appState.synergyPoints}</div>
                        </div>
                    </div>

                    <div class="flex bg-slate-900/90 p-1 rounded-2xl border border-slate-800">
                        <button onclick="setDashboardTab('tasks')" class="flex-1 py-2.5 text-xs md:text-sm font-semibold rounded-xl transition ${appState.activeTab === 'tasks' ? 'bg-cyan-500 text-slate-950 shadow-md' : 'text-slate-400'}">Today's Task</button>
                        <button onclick="setDashboardTab('leaderboard')" class="flex-1 py-2.5 text-xs md:text-sm font-semibold rounded-xl transition ${appState.activeTab === 'leaderboard' ? 'bg-cyan-500 text-slate-950 shadow-md' : 'text-slate-400'}">Leaderboard</button>
                        <button onclick="setDashboardTab('resources')" class="flex-1 py-2.5 text-xs md:text-sm font-semibold rounded-xl transition ${appState.activeTab === 'resources' ? 'bg-cyan-500 text-slate-950 shadow-md' : 'text-slate-400'}">Resources</button>
                    </div>

                    ${renderTabContent()}

                    <div class="glass-card p-6 rounded-3xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs md:text-sm font-bold text-slate-300 uppercase tracking-wider">60-Day Roadmap</h4>
                            <span class="text-xs text-slate-500">12 / 60 Completed</span>
                        </div>
                        <div class="grid grid-cols-10 md:grid-cols-20 gap-2 pt-1">
                            ${generateRoadmapGrid()}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTabContent() {
            if (appState.activeTab === 'tasks') {
                return `
                    <div class="relative rounded-3xl overflow-hidden border border-cyan-500/35 shadow-2xl p-6 space-y-4">
                        <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-950 to-indigo-950/40 -z-10"></div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Day 12 Challenge</span>
                            <span class="text-xs ${appState.isSubmitted ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'} border px-3 py-1 rounded-full font-semibold">
                                ${appState.isSubmitted ? 'Completed ✓' : 'Pending'}
                            </span>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg md:text-xl text-white">AI Interview Screening Agent</h3>
                            <p class="text-sm text-slate-400 mt-1">Build an LLM-backed candidate screening module with structured output JSON parsing.</p>
                        </div>
                        <button onclick="router.navigateTo('/day/12')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-2xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20">
                            <span>Open Submission Portal</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                `;
            } else if (appState.activeTab === 'leaderboard') {
                return `
                    <div class="glass-card p-5 rounded-3xl space-y-3 animate-fadeIn">
                        <h4 class="text-xs md:text-sm font-bold text-slate-300 uppercase">Top Cohort Performers</h4>
                        <div class="space-y-2.5 text-sm">
                            <div class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800">
                                <span class="font-semibold text-white">1. Priyanshu Sharma</span>
                                <span class="text-cyan-400 font-bold">12 Days 🔥</span>
                            </div>
                            <div class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800">
                                <span class="font-semibold text-white">2. Ananya Verma</span>
                                <span class="text-cyan-400 font-bold">12 Days 🔥</span>
                            </div>
                            <div class="flex justify-between items-center bg-cyan-500/10 p-3.5 rounded-2xl border border-cyan-500/30">
                                <span class="font-semibold text-cyan-300">12. Ishaan Thusoo (You)</span>
                                <span class="text-cyan-400 font-bold">11 Days 🔥</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="glass-card p-5 rounded-3xl space-y-3 animate-fadeIn">
                        <h4 class="text-xs md:text-sm font-bold text-slate-300 uppercase">Dorm & Peer Resources</h4>
                        <div class="space-y-2.5 text-sm">
                            <a href="https://www.youtube.com/live/Tl7kFB_DXYc" target="_blank" class="block bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 hover:border-cyan-500 transition">
                                <div class="font-bold text-cyan-400">📺 ViCodathon Kickoff Recording</div>
                                <div class="text-xs text-slate-400 mt-0.5">Winning strategies & tips.</div>
                            </a>
                            <a href="https://abtalks.in" target="_blank" class="block bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 hover:border-cyan-500 transition">
                                <div class="font-bold text-indigo-400">🔗 Official ABTalks Portal</div>
                                <div class="text-xs text-slate-400 mt-0.5">Access global challenges.</div>
                            </a>
                        </div>
                    </div>
                `;
            }
        }

        // 3. CHALLENGE DAY VIEW (/day/12) WITH CAPTCHA
        function renderDayChallenge() {
            return `
                <div class="space-y-6 animate-fadeIn max-w-3xl mx-auto w-full">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-xs md:text-sm text-slate-400 hover:text-white flex items-center gap-1 font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                            Back to Dashboard
                        </button>
                        <span class="text-xs font-bold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3 py-1 rounded-full">Day 12 of 60</span>
                    </div>

                    <div class="space-y-2">
                        <h1 class="text-2xl md:text-4xl font-extrabold text-white">AI Interview Screening Agent</h1>
                        <p class="text-sm md:text-base text-slate-400 leading-relaxed">
                            Create a responsive web component that takes a job description and candidate resume text, queries an LLM endpoint, and outputs a formatted JSON screening score.
                        </p>
                    </div>

                    <div class="glass-card p-5 rounded-3xl space-y-3">
                        <h3 class="text-xs md:text-sm font-bold uppercase tracking-wider text-slate-300">Acceptance Criteria</h3>
                        <ul class="space-y-2.5 text-xs md:text-sm text-slate-400">
                            <li class="flex items-center gap-2.5">
                                <span class="w-5 h-5 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs font-bold shrink-0">✓</span>
                                Public GitHub repository created after 7:00 PM
                            </li>
                            <li class="flex items-center gap-2.5">
                                <span class="w-5 h-5 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs font-bold shrink-0">✓</span>
                                Minimum 2 functional commits pushed
                            </li>
                            <li class="flex items-center gap-2.5">
                                <span class="w-5 h-5 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xs font-bold shrink-0">✓</span>
                                Share progress update on LinkedIn with screenshot
                            </li>
                        </ul>
                    </div>

                    <!-- Proof of Work Submission Form with CAPTCHA -->
                    <div class="glass-card p-6 rounded-3xl space-y-5">
                        <h3 class="text-sm md:text-base font-bold text-white flex items-center justify-between">
                            <span>🚀 Submit Proof of Work</span>
                            ${appState.isSubmitted ? '<span class="text-xs text-emerald-400 font-normal">Submitted ✓</span>' : ''}
                        </h3>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" placeholder="https://github.com/..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" placeholder="https://linkedin.com/..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            
                            <!-- Security CAPTCHA Verification Box -->
                            <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs uppercase font-bold text-slate-300">Security Verification</span>
                                    <button onclick="refreshCaptcha()" class="text-xs text-cyan-400 hover:underline">New Code 🔄</button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="bg-slate-900 border border-slate-700/80 px-4 py-2.5 rounded-xl text-sm font-mono font-bold text-cyan-300 tracking-wider">
                                        ${appState.captchaNum1} + ${appState.captchaNum2} = ?
                                    </div>
                                    <input type="number" id="captchaInput" value="${appState.captchaInput}" oninput="appState.captchaInput=this.value" placeholder="Answer" class="w-32 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400">
                                </div>
                            </div>
                        </div>

                        <button onclick="handleSubmission()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-2xl text-sm md:text-base transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
                            <span>Verify & Submit (+50 SP)</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function generateRoadmapGrid() {
            let html = '';
            for (let i = 1; i <= 60; i++) {
                let bg = 'bg-slate-900 border-slate-800 text-slate-600';
                if (i < 12) bg = 'bg-cyan-500 text-slate-950 font-bold border-cyan-400 shadow-sm shadow-cyan-500/20';
                else if (i === 12) bg = 'bg-indigo-500 text-white font-bold border-indigo-400 animate-pulse';
                html += `<div class="aspect-square rounded-xl border ${bg} flex items-center justify-center text-[10px] md:text-xs">${i}</div>`;
            }
            return html;
        }

        function setTrack(track) {
            appState.selectedTrack = track;
            render();
            showToast(`Track set to: ${track}`);
        }

        function setDashboardTab(tab) {
            appState.activeTab = tab;
            render();
        }

        function toggleStreakState() {
            if (appState.streakState === 'active') appState.streakState = 'zero';
            else if (appState.streakState === 'zero') appState.streakState = 'missed';
            else appState.streakState = 'active';
            render();
            showToast(`Edge-case state: ${appState.streakState}`);
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 8) + 2;
            appState.captchaNum2 = Math.floor(Math.random() * 8) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect CAPTCHA answer. Please try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakState = 'active';
            appState.synergyPoints += 50;
            showToast('🎉 Verified! CAPTCHA passed & +50 SP added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const container = document.getElementById('app-router');
            const route = router.currentRoute;

            // Highlight Desktop Navigation Links
            ['/', '/dashboard', '/day/12'].forEach(r => {
                const desktopBtn = document.getElementById('desktop-nav-' + (r === '/' ? 'home' : r.replace('/', '')));
                const mobileBtn = document.getElementById('nav-' + (r === '/' ? 'home' : r.replace('/', '')));
                
                if (desktopBtn) {
                    if (r === route) {
                        desktopBtn.className = 'text-sm font-medium transition text-cyan-400 font-semibold';
                    } else {
                        desktopBtn.className = 'text-sm font-medium transition text-slate-400 hover:text-white';
                    }
                }
                if (mobileBtn) {
                    if (r === route) {
                        mobileBtn.classList.add('text-cyan-400');
                        mobileBtn.classList.remove('text-slate-400');
                    } else {
                        mobileBtn.classList.remove('text-cyan-400');
                        mobileBtn.classList.add('text-slate-400');
                    }
                }
            });

            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/12') html = renderDayChallenge();
            else html = renderLanding();

            if (appState.toastMessage) {
                html += `
                    <div class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900 border border-cyan-500/50 text-cyan-300 text-xs md:text-sm px-5 py-3 rounded-2xl shadow-2xl z-50 animate-bounce">
                        ${appState.toastMessage}
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!window.location.hash) window.location.hash = '/';
            router.init();
        });
    </script>
</body>
</html>
