<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub (Team Vitality Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        .pro-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.8) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .pro-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 25px 50px -12px rgba(56, 189, 248, 0.15);
        }
        .pro-btn {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4);
            transition: all 0.2s ease;
        }
        .pro-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 15px 25px -5px rgba(14, 165, 233, 0.6);
        }
        .text-gradient {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .star-rating span {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .star-rating span.active {
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 antialiased selection:bg-sky-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Professional Background Gradient Orbs -->
    <div class="fixed top-0 left-1/4 w-[600px] h-[600px] bg-sky-500/10 rounded-full blur-[150px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[150px] pointer-events-none"></div>

    <!-- NAVBAR WITH USER AVATAR -->
    <header class="border-b border-slate-800 bg-[#030712]/90 backdrop-blur-2xl sticky top-0 z-50 px-6 lg:px-16 py-4 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-3.5 cursor-pointer group" onclick="router.navigateTo('/')">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sky-500 via-blue-600 to-indigo-600 flex items-center justify-center font-extrabold text-white text-xl shadow-lg shadow-sky-500/25 group-hover:scale-105 transition">
                ⚡
            </div>
            <div>
                <span class="font-extrabold tracking-widest text-base bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">ABTALKS</span>
                <span class="block text-[10px] text-sky-400 font-bold tracking-widest uppercase">Team Vitality</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center gap-1.5 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-800">
            <button onclick="router.navigateTo('/')" id="nav-home" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Home</button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Dashboard</button>
            <button onclick="router.navigateTo('/day/1')" id="nav-day" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Day 1</button>
            <button onclick="router.navigateTo('/about')" id="nav-about" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">About Us</button>
            <button onclick="router.navigateTo('/contact')" id="nav-contact" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">Contact</button>
        </nav>

        <div class="flex items-center gap-4">
            <div id="liveClock" class="hidden xl:flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-3.5 py-1.5 rounded-xl font-mono text-xs text-sky-300 font-bold">
                <span>🕒</span> <span id="clockText">00:00:00</span>
            </div>
            <!-- Professional User Avatar Widget -->
            <div class="flex items-center gap-3 bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-2xl shadow-inner">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=IshaanThusoo&backgroundColor=0ea5e9" alt="User Avatar" class="w-8 h-8 rounded-full bg-sky-500/20 border border-sky-400/40">
                <div class="hidden sm:block text-left">
                    <span class="block text-xs font-extrabold text-white leading-tight">Ishaan Thusoo</span>
                    <span class="block text-[10px] text-sky-400 font-bold">Day 1 • 50 SP</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN ROUTER CONTAINER -->
    <main id="app-router" class="flex-grow max-w-7xl mx-auto w-full px-6 lg:px-16 py-10 z-10"></main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-900 bg-[#030712] py-8 px-6 lg:px-16 z-10 text-xs text-slate-500">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 font-semibold">
            <div>© 2026 ABTalks Ecosystem. Professional Edition crafted by Team <span class="text-sky-400">Vitality</span>.</div>
            <div class="flex gap-6">
                <a href="#/" onclick="router.navigateTo('/')" class="hover:text-sky-400 transition">Home</a>
                <a href="#/dashboard" onclick="router.navigateTo('/dashboard')" class="hover:text-sky-400 transition">Dashboard</a>
                <a href="#/day/1" onclick="router.navigateTo('/day/1')" class="hover:text-sky-400 transition">Day 1</a>
                <a href="#/about" onclick="router.navigateTo('/about')" class="hover:text-sky-400 transition">About Us</a>
                <a href="#/contact" onclick="router.navigateTo('/contact')" class="hover:text-sky-400 transition">Contact</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPT ENGINE -->
    <script>
        const appState = {
            streakDays: 1,
            selectedTrack: 'AI & Full Stack',
            githubLink: '',
            linkedinLink: '',
            isSubmitted: false,
            synergyPoints: 50,
            selectedCalendarDay: 1,
            selectedRating: 5,
            captchaNum1: 4,
            captchaNum2: 3,
            captchaInput: '',
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => { appState.toastMessage = null; render(); }, 3500);
        }

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            const clockEl = document.getElementById('clockText');
            if (clockEl) clockEl.innerText = timeString;
        }
        setInterval(updateClock, 1000);

        const router = {
            currentRoute: '/',
            init() { 
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) { 
                window.location.hash = route;
                this.currentRoute = route;
                render(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. LANDING PAGE (/)
        function renderLanding() {
            return `
                <div class="space-y-16 animate-fadeIn py-6">
                    <div class="pro-card p-10 lg:p-20 rounded-[3rem] relative overflow-hidden text-center space-y-8">
                        <div class="inline-flex items-center gap-2.5 bg-sky-500/10 text-sky-400 border border-sky-500/25 px-5 py-2 rounded-full text-xs font-extrabold uppercase tracking-widest shadow-inner">
                            <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span> Team Vitality • Day 1 Challenge Kickoff
                        </div>
                        
                        <h1 class="text-4xl lg:text-7xl font-extrabold tracking-tight text-white leading-tight max-w-4xl mx-auto">
                            Professional Engineering.<br>Own Your <span class="text-gradient">60-Day Streak.</span>
                        </h1>
                        
                        <p class="text-slate-300 text-base lg:text-lg leading-relaxed max-w-2xl mx-auto font-medium">
                            Transform post-college hours into high-impact GitHub commits and LinkedIn proof of work. Built for Indian college students striving for elite tech roles.
                        </p>

                        <div class="pt-4 flex flex-wrap justify-center items-center gap-4">
                            <button onclick="router.navigateTo('/dashboard')" class="pro-btn px-9 py-4 rounded-2xl text-sm">
                                Access Dashboard 🚀
                            </button>
                            <button onclick="router.navigateTo('/day/1')" class="pro-card pro-card-hover text-white font-bold px-8 py-4 rounded-2xl text-sm transition">
                                View Challenge Day 1 ⚡
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4">
                        <div class="pro-card p-8 rounded-[2.5rem] space-y-4">
                            <div class="w-12 h-12 rounded-2xl bg-sky-500/10 text-sky-400 border border-sky-500/25 flex items-center justify-center font-bold text-lg">01</div>
                            <h3 class="text-lg font-extrabold text-white">Select Specialized Track</h3>
                            <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">Choose AI & Full Stack engineering paths built for modern industry standards.</p>
                        </div>
                        <div class="pro-card p-8 rounded-[2.5rem] space-y-4">
                            <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/25 flex items-center justify-center font-bold text-lg">02</div>
                            <h3 class="text-lg font-extrabold text-white">Consistent Execution</h3>
                            <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">Push clean code daily to public repositories and publish professional updates.</p>
                        </div>
                        <div class="pro-card p-8 rounded-[2.5rem] space-y-4">
                            <div class="w-12 h-12 rounded-2xl bg-purple-500/10 text-purple-400 border border-purple-500/25 flex items-center justify-center font-bold text-lg">03</div>
                            <h3 class="text-lg font-extrabold text-white">Recruiter Visibility</h3>
                            <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">Build undeniable proof of work and stand out to top-tier technical recruiters.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. STUDENT DASHBOARD (/dashboard)
        function renderDashboard() {
            let daysHtml = '';
            for (let i = 1; i <= 60; i++) {
                const isSelected = appState.selectedCalendarDay === i;
                const isUnlocked = i === 1;
                
                let btnClasses = "p-3 rounded-2xl text-xs font-bold transition flex flex-col items-center justify-center gap-1 border ";
                if (isSelected) {
                    btnClasses += "bg-sky-500 text-slate-950 border-sky-400 shadow-lg scale-105 z-10 font-extrabold";
                } else if (isUnlocked) {
                    btnClasses += "bg-slate-900/90 text-sky-300 border-sky-500/30 hover:bg-slate-800";
                } else {
                    btnClasses += "bg-slate-950/40 text-slate-600 border-slate-900 opacity-40 cursor-not-allowed";
                }

                daysHtml += `
                    <button onclick="${isUnlocked ? `selectCalendarDay(${i})` : `showToast('🔒 Day ${i} unlocks after Day 1 completion!')`}" class="${btnClasses}">
                        <span>Day ${i}</span>
                        <span class="text-[9px] ${isSelected ? 'text-slate-950 font-extrabold' : (isUnlocked ? 'text-emerald-400' : 'text-slate-600')}">${i === 1 ? 'Pending' : 'Lock'}</span>
                    </button>
                `;
            }

            return `
                <div class="space-y-8 animate-fadeIn max-w-5xl mx-auto">
                    <!-- Professional Profile Header Banner with Avatar -->
                    <div class="pro-card p-8 rounded-[2.5rem] flex flex-col sm:flex-row items-center justify-between gap-6">
                        <div class="flex items-center gap-5 text-center sm:text-left">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=IshaanThusoo&backgroundColor=0ea5e9" alt="User Avatar" class="w-20 h-20 rounded-2xl bg-sky-500/20 border-2 border-sky-400/40 p-1">
                            <div class="space-y-1">
                                <span class="text-xs font-extrabold text-sky-400 uppercase tracking-widest">Verified Candidate</span>
                                <h2 class="text-2xl font-extrabold text-white">Ishaan Thusoo</h2>
                                <p class="text-xs text-slate-400">Govind Ballabh Pant University • AI & Full Stack Track</p>
                            </div>
                        </div>
                        <div class="bg-sky-500/10 border border-sky-500/25 px-6 py-4 rounded-2xl text-center">
                            <span class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Overall Standing</span>
                            <span class="text-xl font-extrabold text-sky-400">Top 5% Cohort</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="pro-card p-7 rounded-[2.5rem]">
                            <span class="text-xs uppercase font-extrabold text-sky-400 tracking-wider">Current Streak</span>
                            <div class="text-4xl font-extrabold text-white mt-2">${appState.streakDays} <span class="text-lg font-normal text-slate-400">Day 🔥</span></div>
                        </div>
                        <div class="pro-card p-7 rounded-[2.5rem]">
                            <span class="text-xs uppercase font-extrabold text-indigo-400 tracking-wider">Challenge Progress</span>
                            <div class="text-4xl font-extrabold text-white mt-2">1.6%</div>
                        </div>
                        <div class="pro-card p-7 rounded-[2.5rem]">
                            <span class="text-xs uppercase font-extrabold text-emerald-400 tracking-wider">Synergy Points</span>
                            <div class="text-4xl font-extrabold text-emerald-400 mt-2">${appState.synergyPoints} SP</div>
                        </div>
                    </div>

                    <div class="pro-card p-8 rounded-[3rem] space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h3 class="text-xl font-extrabold text-white tracking-tight">60-Day Challenge Calendar</h3>
                                <p class="text-xs text-slate-400 font-medium">Click any unlocked day to inspect completed work and logs.</p>
                            </div>
                            <span class="text-xs bg-sky-500/10 text-sky-400 border border-sky-500/25 px-3.5 py-1.5 rounded-full font-bold">Selected: Day ${appState.selectedCalendarDay}</span>
                        </div>

                        <div class="grid grid-cols-5 sm:grid-cols-10 gap-3 max-h-72 overflow-y-auto pr-2">
                            ${daysHtml}
                        </div>
                    </div>

                    <div class="pro-card p-8 rounded-[3rem] border border-sky-500/30 space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-extrabold text-sky-400 uppercase tracking-widest bg-sky-500/10 px-3.5 py-1 rounded-full border border-sky-500/25">Day 1 Focus • Setup & Hello World</span>
                            <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/25 px-3.5 py-1 rounded-full font-bold">In Progress</span>
                        </div>
                        <h4 class="text-xl font-extrabold text-white">Environment Setup & Core Architecture Initialization</h4>
                        <p class="text-slate-300 text-sm leading-relaxed font-medium">
                            Initialize your public GitHub repository, configure your development environment, and deploy your initial Day 1 proof of work.
                        </p>
                        <div class="pt-2">
                            <button onclick="router.navigateTo('/day/1')" class="pro-btn px-6 py-3 rounded-2xl text-xs">
                                Open Day 1 Submission Portal →
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 3. CHALLENGE DAY VIEW (/day/1)
        function renderDayChallenge() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-sm text-slate-400 hover:text-white font-bold flex items-center gap-2">← Back to Dashboard</button>
                        <span class="text-xs font-extrabold text-sky-400 bg-sky-500/10 border border-sky-500/25 px-4 py-1.5 rounded-full">Day 1 of 60 Challenge</span>
                    </div>

                    <div class="space-y-3">
                        <h1 class="text-3xl lg:text-5xl font-extrabold text-white tracking-tight">Environment Setup & Hello World</h1>
                        <p class="text-base text-slate-300 leading-relaxed font-medium">Initialize your public GitHub repository, configure your development environment, and publish your initial proof of work to kick off your streak.</p>
                    </div>

                    <div class="pro-card p-8 lg:p-10 rounded-[3rem] space-y-6">
                        <h3 class="text-lg font-extrabold text-white flex items-center justify-between">
                            <span>🚀 Submit Day 1 Proof of Work</span>
                            ${appState.isSubmitted ? '<span class="text-xs text-emerald-400 font-bold bg-emerald-500/10 px-3.5 py-1 rounded-full border border-emerald-500/25">Verified ✓</span>' : '<span class="text-xs text-amber-400 font-bold bg-amber-500/10 px-3.5 py-1 rounded-full border border-amber-500/25">Pending</span>'}
                        </h3>

                        <div class="space-y-5">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" placeholder="https://github.com/username/repo" class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-sky-400">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-sky-400">
                            </div>
                            
                            <div class="bg-slate-950/60 border border-slate-800 p-5 rounded-2xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs uppercase font-bold text-slate-300">Security Math Verification</span>
                                    <button onclick="refreshCaptcha()" class="text-xs text-sky-400 hover:underline font-bold">Generate New Code 🔄</button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="bg-slate-900 border border-slate-700 px-5 py-3 rounded-2xl text-base font-mono font-extrabold text-sky-300">
                                        ${appState.captchaNum1} + ${appState.captchaNum2} = ?
                                    </div>
                                    <input type="number" id="captchaInput" value="${appState.captchaInput}" oninput="appState.captchaInput=this.value" placeholder="Enter answer" class="w-40 bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-400">
                                </div>
                            </div>
                        </div>

                        <button onclick="handleSubmission()" class="pro-btn w-full py-4 rounded-2xl text-base">
                            Verify & Submit Day 1 Proof (+50 Synergy Points) ⚡
                        </button>
                    </div>
                </div>
            `;
        }

        // 4. ABOUT US SECTION (/about)
        function renderAbout() {
            return `
                <div class="space-y-12 animate-fadeIn max-w-5xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-sky-400 bg-sky-500/10 border border-sky-500/25 px-4 py-1.5 rounded-full">About Us • Team Vitality</span>
                        <h1 class="text-4xl lg:text-5xl font-extrabold text-white tracking-tight">Meet Our Core Team</h1>
                        <p class="text-slate-400 text-base max-w-2xl mx-auto font-medium">The dedicated creators behind the architecture, design, and intelligence of ABTalks.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pt-4">
                        <div class="pro-card p-8 rounded-[3rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-pink-500/10 border border-pink-500/25 text-pink-400 flex items-center justify-center font-bold text-2xl mx-auto">🎨</div>
                            <h3 class="text-2xl font-extrabold text-white">Mahima</h3>
                            <p class="text-xs text-pink-400 font-extrabold uppercase tracking-widest">Designer</p>
                            <p class="text-slate-300 text-xs font-medium">Crafted intuitive layouts, visual aesthetics, and responsive user experiences.</p>
                        </div>

                        <div class="pro-card p-8 rounded-[3rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/25 text-indigo-400 flex items-center justify-center font-bold text-2xl mx-auto">🤖</div>
                            <h3 class="text-2xl font-extrabold text-white">Diksha</h3>
                            <p class="text-xs text-indigo-400 font-extrabold uppercase tracking-widest">AI Engineer</p>
                            <p class="text-slate-300 text-xs font-medium">Engineered intelligent workflows and cutting-edge assistance mechanics.</p>
                        </div>

                        <div class="pro-card p-8 rounded-[3rem] space-y-4 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-sky-500/10 border border-sky-500/25 text-sky-400 flex items-center justify-center font-bold text-2xl mx-auto">💻</div>
                            <h3 class="text-2xl font-extrabold text-white">Ishaan</h3>
                            <p class="text-xs text-sky-400 font-extrabold uppercase tracking-widest">Frontend & Backend Developer</p>
                            <p class="text-slate-300 text-xs font-medium">Developed full-stack architecture, routing mechanics, and application logic.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. CONTACT US SECTION (/contact)
        function renderContact() {
            return `
                <div class="space-y-8 animate-fadeIn max-w-3xl mx-auto py-6">
                    <div class="text-center space-y-3">
                        <span class="text-xs font-bold uppercase tracking-widest text-sky-400 bg-sky-500/10 border border-sky-500/25 px-4 py-1.5 rounded-full">Get In Touch</span>
                        <h1 class="text-4xl font-extrabold text-white tracking-tight">Contact Team Vitality</h1>
                        <p class="text-slate-400 text-sm font-medium">Have feedback or questions? Drop us a message and rate your experience below.</p>
                    </div>

                    <div class="pro-card p-8 lg:p-10 rounded-[3rem] space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Your Name</label>
                                <input type="text" placeholder="Ishaan Thusoo" class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-sky-400">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Email Address</label>
                                <input type="email" placeholder="student@university.ac.in" class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-sky-400">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Platform Experience Rating</label>
                            <div class="star-rating flex gap-3 text-3xl text-slate-600" id="starRatingContainer">
                                <span onclick="setRating(1)" class="${appState.selectedRating >= 1 ? 'active' : ''}">★</span>
                                <span onclick="setRating(2)" class="${appState.selectedRating >= 2 ? 'active' : ''}">★</span>
                                <span onclick="setRating(3)" class="${appState.selectedRating >= 3 ? 'active' : ''}">★</span>
                                <span onclick="setRating(4)" class="${appState.selectedRating >= 4 ? 'active' : ''}">★</span>
                                <span onclick="setRating(5)" class="${appState.selectedRating >= 5 ? 'active' : ''}">★</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Message / Feedback</label>
                            <textarea rows="4" placeholder="How can we help you?" class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-sky-400 resize-none"></textarea>
                        </div>
                        <button onclick="showToast('✅ Feedback & ${appState.selectedRating}-Star Rating sent successfully!')" class="pro-btn w-full py-4 rounded-2xl text-base">
                            Submit Feedback & Rating ⭐
                        </button>
                    </div>
                </div>
            `;
        }

        function setRating(stars) {
            appState.selectedRating = stars;
            render();
        }

        function selectCalendarDay(day) {
            appState.selectedCalendarDay = day;
            render();
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 6) + 1;
            appState.captchaNum2 = Math.floor(Math.random() * 4) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect CAPTCHA answer. Try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakDays = 1;
            appState.synergyPoints += 50;
            showToast('🎉 Day 1 Verified! Streak ignited & +50 Synergy Points added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const route = router.currentRoute;
            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/1') html = renderDayChallenge();
            else if (route === '/about') html = renderAbout();
            else if (route === '/contact') html = renderContact();
            document.getElementById('app-router').innerHTML = html;

            ['/', '/dashboard', '/day/1', '/about', '/contact'].forEach(r => {
                const btnId = 'nav-' + (r === '/' ? 'home' : (r === '/dashboard' ? 'dashboard' : (r === '/day/1' ? 'day' : (r === '/about' ? 'about' : 'contact'))));
                const btn = document.getElementById(btnId);
                if(btn) {
                    if(r === route) {
                        btn.className = 'px-4 py-2 text-xs font-bold rounded-xl transition bg-sky-500 text-slate-950 shadow-lg shadow-sky-500/25';
                    } else {
                        btn.className = 'px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white';
                    }
                }
            });
            updateClock();
        }

        window.addEventListener('DOMContentLoaded', () => { router.init(); });
    </script>
</body>
</html>
