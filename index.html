<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABTalks — 60-Day Coding Challenge Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        /* Mobile-First 390px Optimized Crystal Glassmorphism */
        body {
            background: #090d16;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .cyan-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #ffffff;
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.35);
            transition: all 0.3s ease;
        }
        .cyan-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="max-w-[390px] mx-auto min-h-screen flex flex-col justify-between p-4 selection:bg-cyan-500 selection:text-white">

    <!-- Ambient Glow -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[350px] h-[350px] bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- HEADER / ROUTE BAR -->
    <header class="glass-card px-4 py-3 rounded-2xl flex justify-between items-center z-20">
        <div class="flex items-center gap-2 cursor-pointer" onclick="router.navigate('/')">
            <div class="w-8 h-8 rounded-xl bg-cyan-500 flex items-center justify-center font-bold text-slate-950 text-sm">⚡</div>
            <span class="font-extrabold text-xs tracking-wider text-white uppercase">ABTALKS</span>
        </div>
        <div class="flex gap-1 bg-slate-900/80 p-1 rounded-xl border border-white/10 text-[10px] font-bold">
            <button onclick="router.navigate('/')" id="r-home" class="px-2.5 py-1 rounded-lg transition text-slate-400">Home</button>
            <button onclick="router.navigate('/dashboard')" id="r-dash" class="px-2.5 py-1 rounded-lg transition text-slate-400">Dash</button>
            <button onclick="router.navigate('/day/12')" id="r-day" class="px-2.5 py-1 rounded-lg transition text-slate-400">Day 12</button>
        </div>
    </header>

    <!-- DYNAMIC ROUTER VIEW CONTAINER -->
    <main id="appContainer" class="flex-grow my-4 z-10 flex flex-col justify-center"></main>

    <!-- ROUTE MAP FOOTER REQUIRED BY HACKATHON -->
    <footer class="glass-card p-3 rounded-2xl text-[10px] font-mono text-slate-400 text-center z-20 space-y-1">
        <div class="font-bold text-cyan-400">Route Map Specification:</div>
        <div class="text-slate-300">/</div>
        <div class="text-slate-300">/dashboard</div>
        <div class="text-slate-300">/day/12</div>
    </footer>

    <!-- ENGINE SCRIPT -->
    <script>
        const store = {
            streak: parseInt(localStorage.getItem('ab_streak')) || 0, // Handles edge case: 0 streak for first-time user
            completedDays: JSON.parse(localStorage.getItem('ab_completed')) || [],
            missedDay: true, // Edge case flag demonstration
            githubUrl: localStorage.getItem('ab_gh_12') || '',
            linkedinUrl: localStorage.getItem('ab_li_12') || ''
        };

        const router = {
            navigate(path) {
                window.location.hash = path;
                this.render(path);
            },
            init() {
                const path = window.location.hash.replace('#', '') || '/';
                this.render(path);
            },
            render(path) {
                const container = document.getElementById('appContainer');
                let html = '';

                // Update nav highlights
                document.querySelectorAll('header button').forEach(b => b.className = "px-2.5 py-1 rounded-lg transition text-slate-400");
                if (path === '/') document.getElementById('r-home').className = "px-2.5 py-1 rounded-lg transition bg-cyan-500 text-slate-950 font-extrabold";
                if (path === '/dashboard') document.getElementById('r-dash').className = "px-2.5 py-1 rounded-lg transition bg-cyan-500 text-slate-950 font-extrabold";
                if (path === '/day/12') document.getElementById('r-day').className = "px-2.5 py-1 rounded-lg transition bg-cyan-500 text-slate-950 font-extrabold";

                if (path === '/') html = this.views.home();
                else if (path === '/dashboard') html = this.views.dashboard();
                else if (path === '/day/12') html = this.views.day12();
                else html = this.views.home();

                container.innerHTML = html;
            },

            views: {
                home() {
                    return `
                        <div class="glass-card p-6 rounded-[2rem] space-y-5 text-center animate-fadeIn">
                            <span class="bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 px-3.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest">
                                Late-Night College Coding
                            </span>
                            <h1 class="text-2xl font-extrabold text-white tracking-tight leading-snug">
                                Build Every Day. <br/><span class="text-cyan-400">Get Noticed by Recruiters.</span>
                            </h1>
                            <p class="text-xs text-slate-300 leading-relaxed">
                                Join Indian college students turning post-college hours into high-impact GitHub commits and public LinkedIn learning streaks.
                            </p>
                            <div class="pt-2">
                                <button onclick="router.navigate('/dashboard')" class="cyan-btn w-full py-3.5 rounded-2xl text-xs tracking-wide">
                                    Start 60-Day Challenge 🚀
                                </button>
                            </div>
                            <div class="grid grid-cols-3 gap-2 pt-2 text-left">
                                <div class="bg-white/5 p-2.5 rounded-xl border border-white/10">
                                    <div class="text-sm font-extrabold text-white">60 Days</div>
                                    <div class="text-[9px] text-slate-400">Consistency</div>
                                </div>
                                <div class="bg-white/5 p-2.5 rounded-xl border border-white/10">
                                    <div class="text-sm font-extrabold text-cyan-400">GitHub</div>
                                    <div class="text-[9px] text-slate-400">Daily Commit</div>
                                </div>
                                <div class="bg-white/5 p-2.5 rounded-xl border border-white/10">
                                    <div class="text-sm font-extrabold text-indigo-400">LinkedIn</div>
                                    <div class="text-[9px] text-slate-400">Visibility</div>
                                </div>
                            </div>
                        </div>
                    `;
                },

                dashboard() {
                    const isZeroStreak = store.streak === 0;
                    const completionRate = Math.round((store.completedDays.length / 60) * 100);

                    return `
                        <div class="space-y-4 animate-fadeIn">
                            <!-- Edge Case Banner: Missed Day warning or Zero Streak -->
                            ${isZeroStreak ? `
                                <div class="bg-amber-500/15 border border-amber-500/30 p-3 rounded-2xl text-[11px] text-amber-200 flex items-center justify-between">
                                    <span>⚠️ Day 1: No active streak yet. Submit today to start!</span>
                                    <button onclick="router.navigate('/day/12')" class="underline font-bold">Start</button>
                                </div>
                            ` : ''}

                            <!-- Streak & Stats Widget -->
                            <div class="glass-card p-5 rounded-[2rem] flex justify-between items-center">
                                <div>
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Active Streak</span>
                                    <div class="text-3xl font-extrabold text-white mt-1">${store.streak} <span class="text-sm text-cyan-400 font-normal">Days 🔥</span></div>
                                </div>
                                <div class="text-right">
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Completion</span>
                                    <div class="text-2xl font-extrabold text-emerald-400 mt-1">${completionRate}%</div>
                                </div>
                            </div>

                            <!-- Today's Task Card -->
                            <div class="glass-card p-5 rounded-[2.5rem] space-y-4 border-cyan-500/40">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] font-extrabold text-cyan-300 bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Today's Focus • Day 12</span>
                                    <span class="text-[10px] text-slate-400">Pending Proof</span>
                                </div>
                                <h3 class="text-sm font-bold text-white">Full-Stack Auth & Middleware Routing</h3>
                                <p class="text-[11px] text-slate-300 leading-relaxed">Implement JWT authentication middleware and secure your API endpoints for mobile deployment.</p>
                                <button onclick="router.navigate('/day/12')" class="cyan-btn w-full py-3 rounded-xl text-xs">
                                    Submit Day 12 Proof ⚡
                                </button>
                            </div>
                        </div>
                    `;
                },

                day12() {
                    const isSubmitted = store.completedDays.includes(12);

                    return `
                        <div class="glass-card p-5 rounded-[2.5rem] space-y-4 animate-fadeIn">
                            <div class="flex justify-between items-center">
                                <button onclick="router.navigate('/dashboard')" class="text-xs text-slate-400 hover:text-white font-bold">← Dash</button>
                                <span class="text-[10px] font-bold text-cyan-300 bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Day 12 of 60</span>
                            </div>

                            <div class="space-y-1">
                                <h1 class="text-base font-extrabold text-white">JWT Auth & Protected Middleware</h1>
                                <p class="text-[11px] text-slate-300 leading-relaxed">Build secure route protection so unauthenticated users cannot access sensitive college portal endpoints.</p>
                            </div>

                            <div class="space-y-3 pt-1">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">GitHub Commit / Repo URL</label>
                                    <input type="text" id="ghInput" value="${store.githubUrl}" placeholder="https://github.com/user/repo-day12" class="w-full bg-slate-900/80 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">LinkedIn Post URL</label>
                                    <input type="text" id="liInput" value="${store.linkedinUrl}" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-900/80 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
                                </div>
                                <button onclick="app.submitDay12()" class="cyan-btn w-full py-3 rounded-xl text-xs">
                                    ${isSubmitted ? 'Update Submission ✓' : 'Submit Proof & Sync Streak ⚡'}
                                </button>
                            </div>

                            ${isSubmitted ? `
                                <div class="bg-emerald-500/15 border border-emerald-500/30 p-3 rounded-xl text-center text-[11px] text-emerald-300 font-bold">
                                    🎉 Day 12 Verified! Streak updated successfully.
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
            }
        };

        const app = {
            submitDay12() {
                const gh = document.getElementById('ghInput').value.trim();
                const li = document.getElementById('liInput').value.trim();
                if (!gh || !li) {
                    alert('Please provide both GitHub and LinkedIn proof links.');
                    return;
                }
                store.githubUrl = gh;
                store.linkedinUrl = li;
                if (!store.completedDays.includes(12)) {
                    store.completedDays.push(12);
                    store.streak += 1;
                }
                localStorage.setItem('ab_gh_12', gh);
                localStorage.setItem('ab_li_12', li);
                localStorage.setItem('ab_completed', JSON.stringify(store.completedDays));
                localStorage.setItem('ab_streak', store.streak);
                router.render('/day/12');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            router.init();
        });
    </script>
</body>
</html>
