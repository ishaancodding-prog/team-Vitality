<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta+Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 flex justify-center min-h-screen">

    <!-- Mobile Frame Simulation Wrapper (Forces 390px Viewport as requested) -->
    <div class="w-full max-w-[390px] bg-slate-950 min-h-screen flex flex-col justify-between border-x border-slate-900 shadow-2xl relative overflow-hidden">

        <!-- ROUTER CONTAINER -->
        <div id="app-router" class="flex-grow flex flex-col pb-24">
            <!-- Dynamically injected views go here -->
        </div>

        <!-- MOBILE BOTTOM NAVIGATION BAR -->
        <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800/80 px-6 py-3 flex justify-between items-center z-50">
            <button onclick="router.navigateTo('/')" id="nav-home" class="flex flex-col items-center gap-1 text-slate-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 text-slate-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-[10px] font-medium">Dashboard</span>
            </button>
            <button onclick="router.navigateTo('/day/12')" id="nav-day" class="flex flex-col items-center gap-1 text-slate-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span class="text-[10px] font-medium">Day 12</span>
            </button>
        </nav>
    </div>

    <!-- JAVASCRIPT APP & ROUTER LOGIC -->
    <script>
        // Mock State supporting edge cases (e.g. toggle first-day/missed-day states)
        const appState = {
            streakState: 'active', // 'active', 'zero', 'missed'
            dayCompleted: false,
            githubLink: '',
            linkedinLink: '',
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => {
                appState.toastMessage = null;
                render();
            }, 3000);
        }

        // Router Implementation
        const router = {
            currentRoute: '/',
            init() {
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) {
                window.location.hash = route;
                this.currentRoute = route;
                render();
                window.scrollTo(0, 0);
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // VIEWS
        function renderLanding() {
            return `
                <div class="p-6 space-y-6 animate-fadeIn">
                    <!-- Top Bar -->
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-cyan-500 flex items-center justify-center font-bold text-slate-950 text-sm">AB</div>
                            <span class="font-bold tracking-wider text-sm">ABTALKS</span>
                        </div>
                        <span class="text-[10px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2.5 py-1 rounded-full font-semibold">🇮🇳 India Cohort</span>
                    </div>

                    <!-- Hero Banner -->
                    <div class="space-y-3 pt-2">
                        <span class="text-xs font-bold uppercase tracking-widest text-cyan-400">60-Day Engineering Challenge</span>
                        <h1 class="text-3xl font-extrabold leading-tight tracking-tight text-white">
                            Build every day.<br>Get noticed by <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">top recruiters.</span>
                        </h1>
                        <p class="text-slate-400 text-sm leading-relaxed">
                            Designed specifically for Indian college students. Code post-college, build real apps, submit your GitHub commit & LinkedIn post, and build an unignorable public streak.
                        </p>
                    </div>

                    <!-- Social Proof Metric Cards -->
                    <div class="grid grid-cols-2 gap-3 py-2">
                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                            <div class="text-xl font-extrabold text-white">25+</div>
                            <div class="text-xs text-slate-400 mt-0.5">Students Placed</div>
                        </div>
                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                            <div class="text-xl font-extrabold text-cyan-400">10,000+</div>
                            <div class="text-xs text-slate-400 mt-0.5">Active Learners</div>
                        </div>
                    </div>

                    <!-- Thoughtful Feature: Late-Night Dorm Mode Indicator -->
                    <div class="bg-gradient-to-r from-indigo-950/40 to-slate-900 border border-indigo-500/30 p-4 rounded-xl flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400 shrink-0 text-lg">🌙</div>
                        <div>
                            <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wide">Late-Night Hostel Friendly</h3>
                            <p class="text-xs text-slate-400 mt-0.5">Optimized for mobile & low-bandwidth dorm Wi-Fi. Submit proof in under 2 minutes.</p>
                        </div>
                    </div>

                    <!-- Action CTA -->
                    <div class="pt-4 space-y-3">
                        <button onclick="router.navigateTo('/dashboard')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
                            <span>Start Your 60-Day Journey</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                        <p class="text-center text-[11px] text-slate-500">No credit card required. Free for all college students.</p>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            // Determine streak badge & view based on appState
            let streakDisplay = '';
            if (appState.streakState === 'zero') {
                streakDisplay = `<div class="bg-amber-500/10 border border-amber-500/30 p-4 rounded-xl flex items-center gap-3 mb-6">
                    <span class="text-2xl">🌱</span>
                    <div>
                        <h4 class="text-xs font-bold text-amber-400 uppercase">Day 1 - Fresh Start</h4>
                        <p class="text-xs text-slate-300 mt-0.5">Your journey begins today. Complete your first commit to ignite your streak!</p>
                    </div>
                </div>`;
            } else if (appState.streakState === 'missed') {
                streakDisplay = `<div class="bg-red-500/10 border border-red-500/30 p-4 rounded-xl flex items-center gap-3 mb-6">
                    <span class="text-2xl">⚠️</span>
                    <div>
                        <h4 class="text-xs font-bold text-red-400 uppercase">Streak Frozen</h4>
                        <p class="text-xs text-slate-300 mt-0.5">You missed yesterday's submission. Submit Day 12 today to instantly revive your streak!</p>
                    </div>
                </div>`;
            }

            return `
                <div class="p-6 space-y-6 animate-fadeIn">
                    <!-- User Header -->
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center font-bold text-slate-950">IT</div>
                            <div>
                                <h2 class="font-bold text-sm text-white">Ishaan Thusoo</h2>
                                <p class="text-xs text-slate-400">GBPUAT • CSE Student</p>
                            </div>
                        </div>
                        <button onclick="toggleStreakState()" class="text-[10px] bg-slate-900 border border-slate-800 text-slate-400 px-2.5 py-1 rounded-md hover:text-white">
                            Toggle State (${appState.streakState})
                        </button>
                    </div>

                    ${streakDisplay}

                    <!-- Core Metrics Grid -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-xl relative overflow-hidden">
                            <span class="text-[10px] uppercase font-bold tracking-wider text-cyan-400">Current Streak</span>
                            <div class="text-3xl font-extrabold text-white mt-1">${appState.streakState === 'zero' ? '0' : '11'} <span class="text-sm font-normal text-slate-400">Days 🔥</span></div>
                            <div class="text-[10px] text-slate-500 mt-1">Personal Best: 11 Days</div>
                        </div>
                        <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-xl">
                            <span class="text-[10px] uppercase font-bold tracking-wider text-indigo-400">Overall Progress</span>
                            <div class="text-3xl font-extrabold text-white mt-1">18.3%</div>
                            <div class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                                <div class="bg-indigo-500 h-full w-[18.3%]"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Today's Active Challenge Card -->
                    <div class="bg-gradient-to-b from-slate-900 to-slate-950 border border-cyan-500/30 p-5 rounded-2xl shadow-xl space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Today's Task • Day 12</span>
                            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-semibold">Active</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-base text-white">AI Interview Screening Agent</h3>
                            <p class="text-xs text-slate-400 mt-1 line-clamp-2">Build a functional LLM-backed candidate screening module with structured output parsing.</p>
                        </div>
                        <button onclick="router.navigateTo('/day/12')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
                            <span>Open Today's Challenge</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>

                    <!-- 60-Day Progress Map Preview -->
                    <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-xl space-y-3">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider">60-Day Roadmap</h4>
                            <span class="text-[10px] text-slate-500">12 / 60 Completed</span>
                        </div>
                        <div class="grid grid-cols-10 gap-1.5 pt-1">
                            ${generateRoadmapGrid()}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDayChallenge() {
            return `
                <div class="p-6 space-y-6 animate-fadeIn">
                    <!-- Top Breadcrumb -->
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                            Back to Dashboard
                        </button>
                        <span class="text-xs font-bold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-2.5 py-1 rounded-full">Day 12 of 60</span>
                    </div>

                    <!-- Task Title & Overview -->
                    <div class="space-y-2">
                        <h1 class="text-2xl font-extrabold text-white">AI Interview Screening Agent</h1>
                        <p class="text-xs text-slate-400 leading-relaxed">
                            Create a responsive web component that takes a job description and candidate resume text, queries an LLM endpoint, and outputs a formatted JSON screening score.
                        </p>
                    </div>

                    <!-- Acceptance Criteria -->
                    <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-xl space-y-2.5">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Acceptance Criteria</h3>
                        <ul class="space-y-2 text-xs text-slate-400">
                            <li class="flex items-center gap-2">
                                <span class="w-4 h-4 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-[10px] font-bold">✓</span>
                                Public GitHub repository created after 7:00 PM
                            </li>
                            <li class="flex items-center gap-2">
                                <span class="w-4 h-4 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-[10px] font-bold">✓</span>
                                Minimum 2 functional commits pushed
                            </li>
                            <li class="flex items-center gap-2">
                                <span class="w-4 h-4 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-[10px] font-bold">✓</span>
                                Share progress update on LinkedIn with screenshot
                            </li>
                        </ul>
                    </div>

                    <!-- Proof of Work Submission Form -->
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <span>🚀 Submit Proof of Work</span>
                        </h3>

                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold uppercase text-slate-400 mb-1">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" placeholder="https://github.com/username/repo" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold uppercase text-slate-400 mb-1">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
                            </div>
                        </div>

                        <button onclick="handleSubmission()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
                            <span>Verify & Submit Proof</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function generateRoadmapGrid() {
            let html = '';
            for (let i = 1; i <= 60; i++) {
                let bg = 'bg-slate-900 border-slate-800 text-slate-600';
                if (i < 12) bg = 'bg-cyan-500 text-slate-950 font-bold border-cyan-400';
                else if (i === 12) bg = 'bg-indigo-500 text-white font-bold border-indigo-400 animate-pulse';
                html += `<div class="aspect-square rounded border ${bg} flex items-center justify-center text-[9px]">${i}</div>`;
            }
            return html;
        }

        function toggleStreakState() {
            if (appState.streakState === 'active') appState.streakState = 'zero';
            else if (appState.streakState === 'zero') appState.streakState = 'missed';
            else appState.streakState = 'active';
            render();
            showToast(`Switched edge-case state to: ${appState.streakState}`);
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }
            appState.dayCompleted = true;
            appState.streakState = 'active';
            showToast('🎉 Submission verified! Streak updated successfully.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        // Main Render Dispatcher
        function render() {
            const container = document.getElementById('app-router');
            const route = router.currentRoute;

            // Highlight Bottom Nav
            ['/', '/dashboard', '/day/12'].forEach(r => {
                const btn = document.getElementById('nav-' + (r === '/' ? 'home' : r.replace('/', '')));
                if (btn) {
                    if (r === route) {
                        btn.classList.add('text-cyan-400');
                        btn.classList.remove('text-slate-400');
                    } else {
                        btn.classList.remove('text-cyan-400');
                        btn.classList.add('text-slate-400');
                    }
                }
            });

            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/12') html = renderDayChallenge();
            else html = renderLanding();

            // Append Toast if active
            if (appState.toastMessage) {
                html += `
                    <div class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-900 border border-cyan-500/50 text-cyan-300 text-xs px-4 py-2.5 rounded-xl shadow-2xl z-50 animate-bounce">
                        ${appState.toastMessage}
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // Initialize Router on Load
        window.addEventListener('DOMContentLoaded', () => {
            if (!window.location.hash) window.location.hash = '/';
            router.init();
        });
    </script>
</body>
</html>
