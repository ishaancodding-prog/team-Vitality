<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive CAPTCHA Component</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- CAPTCHA Container Card -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-sm space-y-4">
        
        <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Security Verification</h3>
            <button onclick="refreshCaptcha()" class="text-xs text-cyan-400 hover:text-cyan-300 font-medium transition">
                Refresh 🔄
            </button>
        </div>

        <!-- CAPTCHA Visual Display Box -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex items-center justify-center relative overflow-hidden">
            <!-- Subtle background grid lines for aesthetic security look -->
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#06b6d4_1px,transparent_1px)] [background-size:16px_16px]"></div>
            
            <span id="captchaDisplay" class="font-mono text-2xl font-extrabold tracking-widest text-cyan-300 select-none">
                <!-- Injected via JavaScript -->
            </span>
        </div>

        <!-- Input & Submit Form -->
        <div class="space-y-3">
            <input type="text" id="captchaInput" placeholder="Enter characters above" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition">
            
            <button onclick="verifyCaptcha()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-cyan-500/20">
                Verify CAPTCHA
            </button>
        </div>

        <!-- Status Message Alert -->
        <div id="captchaStatus" class="text-center text-xs font-medium h-5"></div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentCaptchaCode = '';

        function generateCaptchaText() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function refreshCaptcha() {
            currentCaptchaCode = generateCaptchaText();
            document.getElementById('captchaDisplay').innerText = currentCaptchaCode;
            document.getElementById('captchaInput').value = '';
            document.getElementById('captchaStatus').innerText = '';
        }

        function verifyCaptcha() {
            const userInput = document.getElementById('captchaInput').value.trim();
            const statusEl = document.getElementById('captchaStatus');

            if (!userInput) {
                statusEl.className = 'text-center text-xs font-medium h-5 text-amber-400';
                statusEl.innerText = '⚠️ Please enter the verification code.';
                return;
            }

            if (userInput === currentCaptchaCode) {
                statusEl.className = 'text-center text-xs font-medium h-5 text-emerald-400';
                statusEl.innerText = '🎉 Verification Successful!';
            } else {
                statusEl.className = 'text-center text-xs font-medium h-5 text-red-400';
                statusEl.innerText = '❌ Incorrect code. Please try again.';
                refreshCaptcha();
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', refreshCaptcha);
    </script>
</body>
</html>
