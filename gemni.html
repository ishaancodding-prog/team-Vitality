<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta+Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 flex justify-center min-h-screen">

    <!-- Mobile Frame Simulation Wrapper (390px Viewport) -->
    <div class="w-full max-w-[390px] bg-slate-950 min-h-screen flex flex-col justify-between border-x border-slate-900 shadow-2xl relative overflow-hidden">

        <!-- ROUTER CONTAINER -->
        <div id="app-router" class="flex-grow flex flex-col pb-24 overflow-y-auto hide-scrollbar">
            <!-- Dynamically injected views go here -->
        </div>

        <!-- MOBILE BOTTOM NAVIGATION BAR -->
        <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800/80 px-4 py-3 flex justify-between items-center z-50">
            <button onclick="router.navigateTo('/')" id="nav-home" class="flex flex-col items-center gap-1 text-slate-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 text-slate-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-[10px] font-medium">Dashboard</span>
            </button>
            <button onclick="router.navigateTo('/day/12')" id="nav-day" class="flex flex-col items-center gap-1 text-slate-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span class="text-[10px] font-medium">Day 12</span>
            </button>
        </nav>
    </div>

    <!-- JAVASCRIPT APP & ROUTER LOGIC -->
    <script>
        // Enhanced App State with new interactive features
        const appState = {
            streakState: 'active', // 'active', 'zero', 'missed'
            selectedTrack: 'AI & Full Stack',
            githubLink: 'https://github.com/ishaancodding-prog/ai-agent',
            linkedinLink: 'https://linkedin.com/posts/ishaancodding_aicoding',
            isSubmitted: false,
            synergyPoints: 450,
            activeTab: 'tasks', // For dashboard tabs: 'tasks', 'leaderboard', 'resources'
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => {
                appState.toastMessage = null;
                render();
            }, 3000);
        }

        // Router Implementation
        const router = {
            currentRoute: '/',
            init() {
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) {
                window.location.hash = route;
                this.currentRoute = route;
                render();
                window.scrollTo(0, 0);
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. LANDING PAGE VIEW (/)
        function renderLanding() {
            return `
                <div class="p-6 space-y-6 animate-fadeIn">
                    <!-- Top Bar -->
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-cyan-500 flex items-center justify-center font-bold text-slate-950 text-sm">AB</div>
                            <span class="font-bold tracking-wider text-sm">ABTALKS</span>
                        </div>
                        <span class="text-[10px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2.5 py-1 rounded-full font-semibold">🇮🇳 India Cohort</span>
                    </div>

                    <!-- Hero Banner -->
                    <div class="space-y-3 pt-2">
                        <span class="text-xs font-bold uppercase tracking-widest text-cyan-400">60-Day Engineering Challenge</span>
                        <h1 class="text-3xl font-extrabold leading-tight tracking-tight text-white">
                            Build every day.<br>Get noticed by <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">top recruiters.</span>
                        </h1>
                        <p class="text-slate-400 text-sm leading-relaxed">
                            Designed for Indian college students. Code post-college, submit your GitHub commit & LinkedIn post, and build an unignorable public streak.
                        </p>
                    </div>

                    <!-- Track Selector Feature -->
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
                        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wide">Select Your Learning Track</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="setTrack('AI & Full Stack')" class="p-2.5 rounded-lg text-xs font-medium border text-left transition ${appState.selectedTrack === 'AI & Full Stack' ? 'bg-cyan-500/10 border-cyan-500 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-400'}">
                                🤖 AI & Full Stack
                            </button>
                            <button onclick="setTrack('Cloud & DevOps')" class="p-2.5 rounded-lg text-xs font-medium border text-left transition ${appState.selectedTrack === 'Cloud & DevOps' ? 'bg-cyan-500/10 border-cyan-500 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-400'}">
                                ☁️ Cloud & DevOps
                            </button>
                        </div>
                    </div>

                    <!-- Social Proof Metric Cards -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                            <div class="text-xl font-extrabold text-white">25+</div>
                            <div class="text-xs text-slate-400 mt-0.5">Students Placed</div>
                        </div>
                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                            <div class="text-xl font-extrabold text-cyan-400">10k+</div>
                            <div class="text-xs text-slate-400 mt-0.5">Active Learners</div>
                        </div>
                    </div>

                    <!-- Late-Night Hostel Friendly Badge -->
                    <div class="bg-gradient-to-r from-indigo-950/40 to-slate-900 border border-indigo-500/30 p-4 rounded-xl flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400 shrink-0 text-lg">🌙</div>
                        <div>
                            <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wide">Late-Night Hostel Mode</h3>
                            <p class="text-xs text-slate-400 mt-0.5">Optimized for mobile & low-bandwidth dorm Wi-Fi. Quick 2-minute verification.</p>
                        </div>
                    </div>

                    <!-- Action CTA -->
                    <div class="pt-2 space-y-3">
                        <button onclick="router.navigateTo('/dashboard')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
                            <span>Start 60-Day Journey (${appState.selectedTrack})</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        // 2. STUDENT DASHBOARD VIEW (/dashboard)
        function renderDashboard() {
            let streakBanner = '';
            if (appState.streakState === 'zero') {
                streakBanner = `<div class="bg-amber-500/10 border border-amber-500/30 p-3.5 rounded-xl flex items-center gap-3">
                    <span class="text-xl">🌱</span>
                    <div>
                        <h4 class="text-xs font-bold text-amber-400 uppercase">Day 1 - Fresh Start</h4>
                        <p class="text-[11px] text-slate-300 mt-0.5">Complete today's task to start building your public streak!</p>
                    </div>
                </div>`;
            } else if (appState.streakState === 'missed') {
                streakBanner = `<div class="bg-red-500/10 border border-red-500/30 p-3.5 rounded-xl flex items-center gap-3">
                    <span class="text-xl">⚠️</span>
                    <div>
                        <h4 class="text-xs font-bold text-red-400 uppercase">Streak Frozen</h4>
                        <p class="text-[11px] text-slate-300 mt-0.5">Missed yesterday. Submit Day 12 to revive instantly!</p>
                    </div>
                </div>`;
            }

            return `
                <div class="p-6 space-y-6 animate-fadeIn">
                    <!-- User Header & Edge-case toggle -->
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center font-bold text-slate-950 text-sm">IT</div>
                            <div>
                                <h2 class="font-bold text-sm text-white">Ishaan Thusoo</h2>
                                <p class="text-[11px] text-slate-400">${appState.selectedTrack}</p>
                            </div>
                        </div>
                        <button onclick="toggleStreakState()" class="text-[10px] bg-slate-900 border border-slate-800 text-slate-400 px-2 py-1 rounded hover:text-white">
                            State: ${appState.streakState} 🔄
                        </button>
                    </div>

                    ${streakBanner}

                    <!-- Core Metrics & Synergy Points -->
                    <div class="grid grid-cols-3 gap-2.5">
                        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                            <span class="text-[10px] uppercase font-bold text-cyan-400">Streak</span>
                            <div class="text-xl font-extrabold text-white mt-0.5">${appState.streakState === 'zero' ? '0' : '11'} <span class="text-xs text-slate-400">🔥</span></div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                            <span class="text-[10px] uppercase font-bold text-indigo-400">Progress</span>
                            <div class="text-xl font-extrabold text-white mt-0.5">18.3%</div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                            <span class="text-[10px] uppercase font-bold text-emerald-400">Synergy</span>
                            <div class="text-xl font-extrabold text-emerald-400 mt-0.5">${appState.synergyPoints}</div>
                        </div>
                    </div>

                    <!-- Dashboard Tab Switcher -->
                    <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                        <button onclick="setDashboardTab('tasks')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition ${appState.activeTab === 'tasks' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}">Today's Task</button>
                        <button onclick="setDashboardTab('leaderboard')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition ${appState.activeTab === 'leaderboard' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}">Leaderboard</button>
                        <button onclick="setDashboardTab('resources')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition ${appState.activeTab === 'resources' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}">Resources</button>
                    </div>

                    <!-- Tab Content -->
                    ${renderTabContent()}

                    <!-- 60-Day Progress Map Preview -->
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider">60-Day Roadmap</h4>
                            <span class="text-[10px] text-slate-500">12 / 60 Completed</span>
                        </div>
                        <div class="grid grid-cols-10 gap-1.5 pt-1">
                            ${generateRoadmapGrid()}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTabContent() {
            if (appState.activeTab === 'tasks') {
                return `
                    <div class="bg-gradient-to-b from-slate-900 to-slate-950 border border-cyan-500/30 p-5 rounded-2xl shadow-xl space-y-4 animate-fadeIn">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Day 12 Challenge</span>
                            <span class="text-[10px] ${appState.isSubmitted ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'} border px-2 py-0.5 rounded font-semibold">
                                ${appState.isSubmitted ? 'Completed ✓' : 'Pending Submission'}
                            </span>
                        </div>
                        <div>
                            <h3 class="font-bold text-base text-white">AI Interview Screening Agent</h3>
                            <p class="text-xs text-slate-400 mt-1">Build an LLM-backed candidate screening module with structured output JSON parsing.</p>
                        </div>
                        <button onclick="router.navigateTo('/day/12')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
                            <span>Open Submission Portal</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                `;
            } else if (appState.activeTab === 'leaderboard') {
                return `
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3 animate-fadeIn">
                        <h4 class="text-xs font-bold text-slate-300 uppercase">Top Cohort Performers</h4>
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                                <span class="font-semibold text-white">1. Priyanshu Sharma</span>
                                <span class="text-cyan-400 font-bold">12 Days 🔥 (1250 SP)</span>
                            </div>
                            <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                                <span class="font-semibold text-white">2. Ananya Verma</span>
                                <span class="text-cyan-400 font-bold">12 Days 🔥 (1190 SP)</span>
                            </div>
                            <div class="flex justify-between items-center bg-cyan-500/10 p-2.5 rounded-lg border border-cyan-500/30">
                                <span class="font-semibold text-cyan-300">12. Ishaan Thusoo (You)</span>
                                <span class="text-cyan-400 font-bold">11 Days 🔥 (${appState.synergyPoints} SP)</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3 animate-fadeIn">
                        <h4 class="text-xs font-bold text-slate-300 uppercase">Dorm & Peer Resources</h4>
                        <div class="space-y-2 text-xs">
                            <a href="https://www.youtube.com/live/Tl7kFB_DXYc" target="_blank" class="block bg-slate-950 p-3 rounded-lg border border-slate-800 hover:border-cyan-500 transition">
                                <div class="font-bold text-cyan-400">📺 ViCodathon Kickoff Recording</div>
                                <div class="text-[11px] text-slate-400 mt-0.5">Winning strategies, tips & mistakes to avoid.</div>
                            </a>
                            <a href="https://abtalks.in" target="_blank" class="block bg-slate-950 p-3 rounded-lg border border-slate-800 hover:border-cyan-500 transition">
                                <div class="font-bold text-indigo-400">🔗 Official ABTalks Portal</div>
                                <div class="text-[11px] text-slate-400 mt-0.5">Access global challenges and recruiter networks.</div>
                            </a>
                        </div>
                    </div>
                `;
            }
        }

        // 3. CHALLENGE DAY VIEW (/day/12)
        function renderDayChallenge() {
            return `
                <div class="p-6 space-y-6 animate-fadeIn">
                    <!-- Top Breadcrumb -->
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                            Back to Dashboard
                        </button>
                        <span class="text-xs font-bold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-2.5 py-1 rounded-full">Day 12 of 60</span>
                    </div>

                    <!-- Task Title & Overview -->
                    <div class="space-y-2">
                        <h1 class="text-2xl font-extrabold text-white">AI Interview Screening Agent</h1>
                        <p class="text-xs text-slate-400 leading-relaxed">
                            Create a responsive web component that takes a job description and candidate resume text, queries an LLM endpoint, and outputs a formatted JSON screening score.
                        </p>
                    </div>

                    <!-- Acceptance Criteria -->
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2.5">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Acceptance Criteria</h3>
                        <ul class="space-y-2 text-xs text-slate-400">
                            <li class="flex items-center gap-2">
                                <span class="w-4 h-4 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-[10px] font-bold">✓</span>
                                Public GitHub repository created after 7:00 PM
                            </li>
                            <li class="flex items-center gap-2">
                                <span class="w-4 h-4 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-[10px] font-bold">✓</span>
                                Minimum 2 functional commits pushed
                            </li>
                            <li class="flex items-center gap-2">
                                <span class="w-4 h-4 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-[10px] font-bold">✓</span>
                                Share progress update on LinkedIn with screenshot
                            </li>
                        </ul>
                    </div>

                    <!-- Proof of Work Submission Form -->
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                        <h3 class="text-sm font-bold text-white flex items-center justify-between">
                            <span>🚀 Submit Proof of Work</span>
                            ${appState.isSubmitted ? '<span class="text-xs text-emerald-400 font-normal">Submitted Successfully ✓</span>' : ''}
                        </h3>

                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold uppercase text-slate-400 mb-1">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" placeholder="https://github.com/username/repo" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold uppercase text-slate-400 mb-1">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" placeholder="https://linkedin.com/posts/..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
                            </div>
                        </div>

                        <button onclick="handleSubmission()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
                            <span>Verify & Submit Proof (+50 Synergy Points)</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function generateRoadmapGrid() {
            let html = '';
            for (let i = 1; i <= 60; i++) {
                let bg = 'bg-slate-900 border-slate-800 text-slate-600';
                if (i < 12) bg = 'bg-cyan-500 text-slate-950 font-bold border-cyan-400';
                else if (i === 12) bg = 'bg-indigo-500 text-white font-bold border-indigo-400 animate-pulse';
                html += `<div class="aspect-square rounded border ${bg} flex items-center justify-center text-[9px]">${i}</div>`;
            }
            return html;
        }

        function setTrack(track) {
            appState.selectedTrack = track;
            render();
            showToast(`Track set to: ${track}`);
        }

        function setDashboardTab(tab) {
            appState.activeTab = tab;
            render();
        }

        function toggleStreakState() {
            if (appState.streakState === 'active') appState.streakState = 'zero';
            else if (appState.streakState === 'zero') appState.streakState = 'missed';
            else appState.streakState = 'active';
            render();
            showToast(`Edge-case state: ${appState.streakState}`);
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }
            appState.isSubmitted = true;
            appState.streakState = 'active';
            appState.synergyPoints += 50;
            showToast('🎉 Verified! +50 Synergy Points added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        // Main Render Dispatcher
        function render() {
            const container = document.getElementById('app-router');
            const route = router.currentRoute;

            // Highlight Bottom Nav
            ['/', '/dashboard', '/day/12'].forEach(r => {
                const btn = document.getElementById('nav-' + (r === '/' ? 'home' : r.replace('/', '')));
                if (btn) {
                    if (r === route) {
                        btn.classList.add('text-cyan-400');
                        btn.classList.remove('text-slate-400');
                    } else {
                        btn.classList.remove('text-cyan-400');
                        btn.classList.add('text-slate-400');
                    }
                }
            });

            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/12') html = renderDayChallenge();
            else html = renderLanding();

            if (appState.toastMessage) {
                html += `
                    <div class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-900 border border-cyan-500/50 text-cyan-300 text-xs px-4 py-2.5 rounded-xl shadow-2xl z-50 animate-bounce">
                        ${appState.toastMessage}
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!window.location.hash) window.location.hash = '/';
            router.init();
        });
    </script>
</body>
</html>
